                  - id: bnd_growth_15000
                    object: credit_bundle
                    name: Growth
                    credits: 15000
                    bonus_credits: 0
                    monthly: false
                    price: { amount: "120.00", currency: USD }
                    price_per_credit: "0.0080"
                    effective_rate_bps: 24
                    stablecoin_discount_bps: 300
                    expires_after_months: 24
                    crypto_prices:
                      - asset: "btc:bitcoin"
                        amount: "0.00178173"
