  /credits/purchases:
    post:
      tags: [Credits]
      operationId: createCreditPurchase
      summary: Purchase credits with crypto or a saved card
      description: |
        Creates a **CreditPurchase** for a bundle.

        **Card.** Pass `payment_method` (a `pm_` id from `GET /credits/payment_methods`), or in the dashboard
        checkout a fresh card token as `source_id` (optionally `save_card`). The card is charged
        at once and the response is final: `paid` (credits added), or `pending` when the processor holds the
        charge for review (credits are added if it is approved). A decline returns `402 card_declined` and
        records a `failed` purchase. Card purchases pay the list price (the stablecoin discount is crypto-only)
        and are limited per day (`422 card_limit_exceeded`); repeated declines pause card purchases for 24 hours
        (`422 card_locked`).

        **Crypto.** The response embeds a `payment` object that is
        shaped exactly like a merchant invoice (`payment_options` per network with address, amount,
        URI, QR payload, `rate_locked_until`) - except the receiving addresses belong to
        **CoinVello's operator wallets** (configured by staff in the admin panel). This is the one
        place where CoinVello itself receives funds: as payment for its service.

        Also returns `checkout_url`, a hosted page on pay.coinvello.com where the purchase can be
        completed in a browser. Status lifecycle mirrors invoices
        (`new -> pending -> confirming -> paid | underpaid | overpaid | expired | cancelled`).
        Credits are added when the purchase reaches `paid` (or `overpaid`); `credits.added` fires.

        Pass `pay_asset` + `pay_chain` to receive a single payment option, or omit both to receive one
        option per network the operator wallets support.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreditPurchaseCreateRequest' }
            examples:
              crypto:
                value:
                  bundle_id: bnd_growth_15000
                  pay_asset: usdc
                  pay_chain: base
              card:
                value:
                  bundle_id: bnd_growth_15000
                  payment_method: pm_7Qa2Kd9LmPx4Rt
      responses:
        '201':
          description: Credit purchase created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditPurchase' }
              examples:
                purchase: { $ref: '#/components/examples/CreditPurchaseNew' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/CardDeclined' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    get:
      tags: [Credits]
      operationId: listCreditPurchases
      summary: List credit purchases
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/InvoiceStatus' }
      responses:
        '200':
          description: Purchases
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CreditPurchase' }

  /credits/purchases/{purchase_id}:
    parameters:
      - name: purchase_id
        in: path
        required: true
        schema: { type: string, pattern: '^cpu_[A-Za-z0-9]+$' }
        example: cpu_6Rt8Yu3Kp
    get:
      tags: [Credits]
      operationId: getCreditPurchase
      summary: Retrieve a credit purchase
      responses:
        '200':
          description: Purchase
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditPurchase' }
        '404': { $ref: '#/components/responses/NotFound' }

  /credits/purchases/{purchase_id}/cancel:
    parameters:
      - name: purchase_id
        in: path
        required: true
        schema: { type: string, pattern: '^cpu_[A-Za-z0-9]+$' }
    post:
      tags: [Credits]
      operationId: cancelCreditPurchase
      summary: Cancel an unpaid credit purchase
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditPurchase' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /credits/ledger:
    get:
      tags: [Credits]
      operationId: listCreditLedger
      summary: List credit usage ledger
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: type
          in: query
          schema: { type: string, enum: [debit, credit] }
        - name: reason
          in: query
          schema: { $ref: '#/components/schemas/CreditLedgerReason' }
        - $ref: '#/components/parameters/CreatedGte'
        - $ref: '#/components/parameters/CreatedLte'
      responses:
        '200':
          description: Ledger entries, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CreditLedgerEntry' }

  /credits/auto_topup:
    put:
      tags: [Credits]
      operationId: setCreditsAutoTopup
      summary: Configure automatic top-up
      description: |
        When the balance falls below `trigger_below`, the `bundle_id` bundle is bought with the saved card
        (`payment_method`, default: the default card). Enabling requires a saved card
        (`422 payment_method_required`). At most one automatic charge runs per 10 minutes, and `monthly_limit`
        (USD, optional) caps automatic charges per calendar month. After 3 consecutive declines automatic top-up
        switches itself off and `credits.auto_topup.disabled` fires. Crypto cannot be pulled, so automatic
        top-up is card-only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutoTopup' }
      responses:
        '200':
          description: Updated balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditsBalance' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /credits/payment_methods:
    get:
      tags: [Credits]
      operationId: listPaymentMethods
      summary: List saved cards
      description: Cards saved for buying credits in the current mode (test mode uses the processor's sandbox). CoinVello stores only the brand, last four digits and expiry.
      responses:
        '200':
          description: Saved cards
          content:
            application/json:
              schema:
                type: object
                required: [object, data, has_more, next_cursor, card_payments_available]
                properties:
                  object: { type: string, const: list }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaymentMethod' }
                  has_more: { type: boolean }
                  next_cursor: { type: [string, 'null'] }
                  card_payments_available: { type: boolean, description: False when card payments are not configured for this mode. }
                  card_form:
                    oneOf:
                      - $ref: '#/components/schemas/CardFormConfig'
                      - type: 'null'
                    description: Public settings for Square's Web Payments SDK in this mode (null when card payments are off).
    post:
      tags: [Credits]
      operationId: createPaymentMethod
      summary: Save a card (dashboard only)
      description: |
        Saves a card tokenized in the browser by Square's Web Payments SDK (`card_form` from the list response).
        Pass the token as `source_id` and, when the SDK's buyer verification ran (3-D Secure), its
        `verification_token`. Requires a dashboard session with a fresh 2FA step-up (`403 step_up_required`);
        API keys cannot add cards. At most 3 cards per mode (`422 payment_method_limit`). The first card becomes
        the default.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id]
              properties:
                source_id: { type: string, description: Card token (`cnon:...`) from the Web Payments SDK. }
                verification_token: { type: string, description: "Buyer verification token from the SDK, when present." }
      responses:
        '201':
          description: Saved card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMethod' }
        '402': { $ref: '#/components/responses/CardDeclined' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /credits/payment_methods/{payment_method_id}:
    parameters:
      - name: payment_method_id
        in: path
        required: true
        schema: { type: string, pattern: '^pm_[A-Za-z0-9]+$' }
    delete:
      tags: [Credits]
      operationId: deletePaymentMethod
      summary: Remove a saved card (dashboard only)
      description: Disables the card at Square. Removing the card that automatic top-up uses switches automatic top-up off.
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMethod' }
        '404': { $ref: '#/components/responses/NotFound' }

  /credits/payment_methods/{payment_method_id}/default:
    parameters:
      - name: payment_method_id
        in: path
        required: true
        schema: { type: string, pattern: '^pm_[A-Za-z0-9]+$' }
    post:
      tags: [Credits]
      operationId: setDefaultPaymentMethod
      summary: Make a saved card the default (dashboard only)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMethod' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Rates
  /receivers:
    get:
      tags: [Pay as you go]
      operationId: listReceivers
      summary: List receivers
      description: Receivers of this account (pay-as-you-go). One per wallet and chain, created automatically while `billing_plan` is `pay_as_you_go`; kept (and still swept) after switching back to `prepaid`.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: chain
          in: query
          schema: { $ref: '#/components/schemas/Chain' }
        - name: wallet_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReceiverStatus' }
      responses:
        '200':
          description: A page of receivers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Receiver' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /receivers/{receiver_id}:
    get:
      tags: [Pay as you go]
      operationId: getReceiver
      summary: Retrieve a receiver
      parameters:
        - $ref: '#/components/parameters/ReceiverId'
      responses:
        '200':
          description: The receiver
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receiver' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /receivers/{receiver_id}/sweep_transaction:
    post:
      tags: [Pay as you go]
      operationId: prepareReceiverSweep
      summary: Prepare a sweep for the merchant to sign
      description: |
        Returns an unsigned transaction that sweeps the receiver now (on EVM and Tron it also deploys the
        receiver if it is not deployed yet). Sign and broadcast it with any wallet; the signer pays the network
        fee, and the split is the same as when CoinVello sweeps. Use it when you do not want to wait for
        CoinVello's sweeper. CoinVello records the result as a `Sweep` with `initiated_by: merchant` once it
        confirms.
      parameters:
        - $ref: '#/components/parameters/ReceiverId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from]
              properties:
                from: { type: string, description: The address that will sign and pay the network fee. }
                assets:
                  type: array
                  items: { $ref: '#/components/schemas/AssetId' }
                  description: Assets to sweep. Defaults to every allowlisted asset with a balance (one transaction on EVM and Tron; one per token on Solana).
      responses:
        '200':
          description: Transactions to sign, in order
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: sweep_transaction }
                  receiver_id: { type: string }
                  transactions:
                    type: array
                    items: { $ref: '#/components/schemas/UnsignedTransaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }
  /sweeps:
    get:
      tags: [Pay as you go]
      operationId: listSweeps
      summary: List sweeps
      description: Every confirmed or failed sweep of this account's receivers, whoever triggered it, newest first.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CreatedGte'
        - $ref: '#/components/parameters/CreatedLte'
        - name: receiver_id
          in: query
          schema: { type: string }
        - name: chain
          in: query
          schema: { $ref: '#/components/schemas/Chain' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/SweepStatus' }
      responses:
        '200':
          description: A page of sweeps
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Sweep' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /sweeps/{sweep_id}:
    get:
      tags: [Pay as you go]
      operationId: getSweep
      summary: Retrieve a sweep
      parameters:
        - $ref: '#/components/parameters/SweepId'
      responses:
        '200':
          description: The sweep
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sweep' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ---------------------------------------------------------------- Records (bookkeeping, tax)
  /records:
    get:
      tags: [Records]
      operationId: listRecords
      summary: List accounting records
      description: |
        The account's book of record: one immutable row for every movement of value CoinVello observed on-chain
        or billed - payments received, reversals, refunds sent, fees (prepaid credits or the on-chain share),
        credit purchases, conversions and off-ramp payouts - each valued in the reporting currency at the moment
        it happened, with the rate and its source. Newest first. Records are never edited; a correction is a new
        record with `reverses_record_id`. Design: docs/10-records-and-tax.md.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/RecordType' }
        - name: asset
          in: query
          description: Records whose received, sent or fee leg is this asset.
          schema: { $ref: '#/components/schemas/AssetId' }
        - name: chain
          in: query
          schema: { $ref: '#/components/schemas/Chain' }
        - name: invoice_id
          in: query
          schema: { type: string }
        - name: order_id
          in: query
          schema: { type: string }
        - name: tx_hash
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/OccurredGte'
        - $ref: '#/components/parameters/OccurredLte'
        - $ref: '#/components/parameters/ReportingCurrency'
        - $ref: '#/components/parameters/IncludeSimulated'
      responses:
        '200':
          description: A page of records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AccountingRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /records/summary:
    get:
      tags: [Records]
      operationId: getRecordsSummary
      summary: Totals for a period
      description: |
        Sales, market value received, refunds, fees and net received over `occurred_at` in the given timezone
        and currency, optionally grouped. Definitions: docs/10-records-and-tax.md §5. With a test key,
        simulated rows count only when `include_simulated` is true.
      parameters:
        - name: period_start
          in: query
          required: true
          description: Inclusive, interpreted in `timezone`. A date (`2026-01-01`) or a date-time.
          schema: { type: string, example: "2026-01-01" }
        - name: period_end
          in: query
          required: true
          description: Exclusive.
          schema: { type: string, example: "2027-01-01" }
        - $ref: '#/components/parameters/ReportingCurrency'
        - name: timezone
          in: query
          description: IANA zone used to bucket `occurred_at`. Default - the account's `records.timezone`.
          schema: { type: string, example: Europe/Berlin }
        - name: group_by
          in: query
          schema: { type: string, enum: [month, asset, chain, type, address] }
        - $ref: '#/components/parameters/IncludeSimulated'
      responses:
        '200':
          description: Totals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordsSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /records/{record_id}:
    get:
      tags: [Records]
      operationId: getRecord
      summary: Retrieve a record
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/ReportingCurrency'
      responses:
        '200':
          description: The record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountingRecord' }
              examples:
                payment: { $ref: '#/components/examples/RecordPaymentReceived' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /exports:
    post:
      tags: [Records]
      operationId: createExport
      summary: Export records or any dataset as CSV, Excel or JSON
      description: |
        Starts an export of one dataset (or `all`, the year-end package) for a period or for the entire history,
        in the given format, timezone and currency. Small exports finish inline and come back `ready`; larger
        ones are built in the background - poll `GET /exports/{id}` or listen for `export.ready`. Files are kept
        7 days (`download_expires_at`), then the export is `expired`; create it again any time. Limits: 20
        exports per hour, 2 running at a time (`429 rate_limited`). `422` when the preset does not fit the
        dataset or format (vendor presets are `records` + `csv` only). Formats, columns and presets:
        docs/10-records-and-tax.md §4.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportCreateRequest' }
            examples:
              quarterExcel:
                summary: Last quarter's records as an Excel workbook
                value: { dataset: records, format: xlsx, period: { start: "2026-07-01", end: "2026-10-01" }, timezone: America/New_York, currency: USD }
              everythingCsv:
                summary: Entire history, generic CSV
                value: { dataset: records, format: csv, period: null }
              koinly:
                summary: A tax year for Koinly
                value: { dataset: records, format: csv, preset: koinly, period: { start: "2026-01-01", end: "2027-01-01" } }
              yearEnd:
                summary: Year-end package (every dataset in one workbook)
                value: { dataset: all, format: xlsx, period: { start: "2026-01-01", end: "2027-01-01" }, metadata: { fiscal_year: "2026" } }
      responses:
        '201':
          description: Export created (possibly already `ready`)
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Export' }
              examples:
                ready: { $ref: '#/components/examples/ExportReady' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Records]
      operationId: listExports
      summary: List exports
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ExportStatus' }
        - name: dataset
          in: query
          schema: { $ref: '#/components/schemas/ExportDataset' }
      responses:
        '200':
          description: A page of exports, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Export' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /exports/{export_id}:
    get:
      tags: [Records]
      operationId: getExport
      summary: Retrieve an export
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: The export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Export' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Records]
      operationId: deleteExport
      summary: Delete an export and its file
      description: Removes the file before its 7 days are up. The records themselves are untouched.
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /exports/{export_id}/download:
    get:
      tags: [Records]
      operationId: downloadExport
      summary: Download the file
      description: |
        Redirects to the signed `download_url` while the export is `ready`. `409 export_not_ready` while it is
        `queued` or `processing`, `409 export_expired` once the file has been removed, `409 export_failed` after
        a failure. Clients that cannot follow redirects read `download_url` from the export object instead.
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: The file itself, when the server streams it directly instead of redirecting (the reference server does; production may for small files).
          content:
            text/csv: { schema: { type: string } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
            application/zip: { schema: { type: string, format: binary } }
            application/json: { schema: { type: object, additionalProperties: true } }
        '302':
          description: Redirect to the file
          headers:
            Location:
              description: Signed URL of the file; valid until `download_expires_at`.
              schema: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /rates:
    get:
      tags: [Rates]
      operationId: listRates
      summary: Current indicative rates
      description: Mid-market rates aggregated from multiple sources, refreshed every ~10 seconds. Indicative only; use a quote + lock for binding pricing.
      parameters:
        - name: base
          in: query
          description: Fiat currency (ISO 4217) or asset id to quote against.
          schema: { type: string, default: USD }
          example: USD
        - name: assets
          in: query
          description: Comma-separated asset ids. Defaults to all supported assets.
          schema: { type: string }
          example: "btc:bitcoin,eth:ethereum,usdt:tron"
      responses:
        '200':
          description: Rates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatesResponse' }
              example:
                object: rates
                base: USD
                rates:
                  - asset: "btc:bitcoin"
                    rate: "67350.12"
                    source: aggregate
                  - asset: "eth:ethereum"
                    rate: "2510.44"
                    source: aggregate
                  - asset: "usdt:tron"
                    rate: "0.9998"
                    source: aggregate
                as_of: "2026-10-21T10:00:09Z"

  /rates/display:
    get:
      tags: [Rates]
      operationId: getDisplayRates
      summary: Fiat display rates for payer-facing UIs
      description: |
        **No authentication**, CORS-open, cacheable (`Cache-Control: public, max-age=300`). Fiat-to-fiat
        conversion rates for showing prices in the payer's currency on the hosted checkout, the widget and
        the pricing page. Indicative only - invoices are always settled at the crypto rate locked on the
        invoice in its own currency. Currencies: USD, EUR, GBP, CAD, AUD, JPY, CHF, SGD, AED, BRL, MXN, ZAR, INR, PLN, SEK, NOK, DKK, CZK, NZD, HKD, KRW, TRY, ILS, THB, PHP, IDR, MYR, VND, NGN, ARS.
        Values are decimal strings (units of each currency per 1 unit of `base`). Refreshed every 5 minutes.
      security: []
      parameters:
        - name: base
          in: query
          description: Base currency (any from the list). Default USD.
          schema: { type: string, enum: [USD, EUR, GBP, CAD, AUD, JPY, CHF, SGD, AED, BRL, MXN, ZAR, INR, PLN, SEK, NOK, DKK, CZK, NZD, HKD, KRW, TRY, ILS, THB, PHP, IDR, MYR, VND, NGN, ARS], default: USD }
      responses:
        '200':
          description: Display rates
          headers:
            Access-Control-Allow-Origin: { schema: { type: string, const: "*" } }
            Cache-Control: { schema: { type: string, const: "public, max-age=300" } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisplayRates' }
              example:
                object: display_rates
                base: USD
                rates: { EUR: "0.9195", GBP: "0.7752", JPY: "151.52" }
                as_of: "2026-10-21T10:00:00Z"
                source: open.er-api.com
        '400': { $ref: '#/components/responses/BadRequest' }

  /rates/quotes:
    post:
      tags: [Rates]
      operationId: createRateQuote
      summary: Create a rate quote
      description: |
        A quote freezes a rate for a short window (`expires_at`, typically 30 seconds). Quotes are
        free. To hold the rate for the lifetime of an invoice, lock it with `POST /rates/locks` or
        pass `"rate_lock": true` when creating the invoice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, amount]
              properties:
                from:
                  type: string
                  description: Source currency - fiat code or asset id.
                  example: USD
                to:
                  type: string
                  description: Target currency - fiat code or asset id.
                  example: "btc:bitcoin"
                amount:
                  $ref: '#/components/schemas/DecimalString'
                side:
                  type: string
                  enum: [from, to]
                  default: from
                  description: Which side `amount` refers to.
      responses:
        '201':
          description: Quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateQuote' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /rates/locks:
    post:
      tags: [Rates]
      operationId: createRateLock
      summary: Lock a quoted rate
      description: |
        Converts a quote into a binding lock for `duration_seconds` (60-3600). Locks are free
        (included in the per-payment fee). Pass the returned `id` as
        `rate_lock_id` when creating an invoice; the invoice's payment amounts will use the
        locked rate until the lock expires.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id]
              properties:
                quote_id: { type: string, pattern: '^rq_[A-Za-z0-9]+$' }
                duration_seconds: { type: integer, minimum: 60, maximum: 3600, default: 900 }
      responses:
        '201':
          description: Rate lock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateLock' }
        '402': { $ref: '#/components/responses/InsufficientCredits' }
        '409':
          description: Quote expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /rates/locks/{rate_lock_id}:
    parameters:
      - name: rate_lock_id
        in: path
        required: true
        schema: { type: string, pattern: '^rl_[A-Za-z0-9]+$' }
    get:
      tags: [Rates]
      operationId: getRateLock
      summary: Retrieve a rate lock
      responses:
        '200':
          description: Rate lock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateLock' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Conversions
  /conversions/quotes:
    post:
      tags: [Conversions]
      operationId: createConversionQuote
      summary: Quote a conversion
      description: |
        Quotes a swap of one asset into another through a connected liquidity route
        (on-chain DEX aggregator or a partner exchange account the merchant connected).
        CoinVello never takes custody: the swap is executed by a transaction *you* sign.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversionQuoteRequest' }
            example:
              from_asset: "eth:ethereum"
              to_asset: "usdc:ethereum"
              amount: "0.5"
              from_wallet_id: wal_evm_4Fg7Kp
              destination_address: "0x8ba1f109551bD432803012645Ac136ddd64DBA72"
              slippage_bps: 50
      responses:
        '201':
          description: Conversion quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversionQuote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /conversions:
    post:
      tags: [Conversions]
      operationId: createConversion
      summary: Create a conversion from a quote
      description: |
        Accepts a quote and returns the conversion in `awaiting_signature` with
        `unsigned_transactions` for you to sign (EIP-1559 tx for EVM, PSBT for BTC,
        serialized message for Solana, raw tx for Tron). Then either:

        1. Sign and broadcast yourself, and `POST /conversions/{id}/submit` with `tx_hash`, or
        2. Sign and `POST /conversions/{id}/submit` with `signed_transaction` and CoinVello broadcasts.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id]
              properties:
                quote_id: { type: string, pattern: '^cq_[A-Za-z0-9]+$' }
                metadata: { $ref: '#/components/schemas/Metadata' }
      responses:
        '201':
          description: Conversion awaiting signature
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversion' }
              examples:
                awaiting: { $ref: '#/components/examples/ConversionAwaitingSignature' }
        '402': { $ref: '#/components/responses/InsufficientCredits' }
        '409':
          description: Quote expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      tags: [Conversions]
      operationId: listConversions
      summary: List conversions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ConversionStatus' }
      responses:
        '200':
          description: Conversions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Conversion' }

  /conversions/{conversion_id}:
    parameters:
      - $ref: '#/components/parameters/ConversionId'
    get:
      tags: [Conversions]
      operationId: getConversion
      summary: Retrieve a conversion
      responses:
        '200':
          description: Conversion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversion' }
        '404': { $ref: '#/components/responses/NotFound' }

  /conversions/{conversion_id}/submit:
    parameters:
      - $ref: '#/components/parameters/ConversionId'
    post:
      tags: [Conversions]
      operationId: submitConversion
      summary: Submit signed transaction(s) or tx hash
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignedSubmission' }
      responses:
        '200':
          description: Conversion now submitted/pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversion' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /conversions/{conversion_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ConversionId'
    post:
      tags: [Conversions]
      operationId: cancelConversion
      summary: Cancel a conversion
      description: Only while `awaiting_signature`. Once a transaction is broadcast it cannot be cancelled.
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversion' }
        '409': { $ref: '#/components/responses/InvalidState' }

  # ---------------------------------------------------------------- Off-ramp
  /offramp/providers:
    get:
      tags: [Off-ramp]
      operationId: listOfframpProviders
      summary: List supported off-ramp partners
      security: []
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: list }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OfframpProvider' }

  /offramp/accounts:
    post:
      tags: [Off-ramp]
      operationId: createOfframpAccount
      summary: Connect a partner account
      description: |
        Connects the merchant's **own** account at a partner (exchange / payout provider).
        Two connection modes:

        * `oauth` - response contains `authorize_url`; redirect the merchant there. The account
          becomes `active` after the callback.
        * `api_key` - supply partner API credentials (encrypted at rest; never returned). Grant
          the key *trade* and *withdraw-to-whitelisted-bank* permissions only.

        Fiat lands in the merchant's bank account registered **at the partner**. CoinVello
        never touches fiat.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfframpAccountCreateRequest' }
      responses:
        '201':
          description: Connected (or pending OAuth)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfframpAccount' }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [Off-ramp]
      operationId: listOfframpAccounts
      summary: List connected partner accounts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OfframpAccount' }

  /offramp/accounts/{account_id}:
    parameters:
      - $ref: '#/components/parameters/OfframpAccountId'
    get:
      tags: [Off-ramp]
      operationId: getOfframpAccount
      summary: Retrieve a connected account
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfframpAccount' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Off-ramp]
      operationId: disconnectOfframpAccount
      summary: Disconnect a partner account
      responses:
        '200':
          description: Disconnected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }

  /offramp/quotes:
    post:
      tags: [Off-ramp]
      operationId: createOfframpQuote
      summary: Quote a fiat payout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, asset, amount, fiat_currency]
              properties:
                account_id: { type: string }
                asset: { $ref: '#/components/schemas/AssetId' }
                amount: { $ref: '#/components/schemas/DecimalString' }
                fiat_currency: { $ref: '#/components/schemas/FiatCurrency' }
                destination_id:
                  type: string
                  description: Partner-side bank destination id (from `OfframpAccount.destinations`). Defaults to the account's default destination.
      responses:
        '201':
          description: Quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfframpQuote' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /offramp/payouts:
    post:
      tags: [Off-ramp]
      operationId: createOfframpPayout
      summary: Create a payout from a quote
      description: |
        Creates the payout in `awaiting_deposit`. CoinVello obtains a deposit address from the
        partner and prepares an `unsigned_transaction` from your wallet to it. Sign it and
        `POST /offramp/payouts/{id}/submit`. The partner converts and pays fiat to your bank.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id, from_wallet_id]
              properties:
                quote_id: { type: string, pattern: '^oq_[A-Za-z0-9]+$' }
                from_wallet_id: { type: string, pattern: '^wal_[A-Za-z0-9]+$' }
                metadata: { $ref: '#/components/schemas/Metadata' }
      responses:
        '201':
          description: Payout awaiting deposit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfframpPayout' }
        '402': { $ref: '#/components/responses/InsufficientCredits' }
        '409':
          description: Quote expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      tags: [Off-ramp]
      operationId: listOfframpPayouts
      summary: List payouts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OfframpPayoutStatus' }
      responses:
        '200':
          description: Payouts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OfframpPayout' }

  /offramp/payouts/{payout_id}:
    parameters:
      - $ref: '#/components/parameters/OfframpPayoutId'
    get:
      tags: [Off-ramp]
      operationId: getOfframpPayout
      summary: Retrieve a payout
      responses:
        '200':
          description: Payout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfframpPayout' }
        '404': { $ref: '#/components/responses/NotFound' }

  /offramp/payouts/{payout_id}/submit:
    parameters:
      - $ref: '#/components/parameters/OfframpPayoutId'
    post:
      tags: [Off-ramp]
      operationId: submitOfframpPayout
      summary: Submit the signed deposit transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignedSubmission' }
      responses:
        '200':
          description: Payout progressing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfframpPayout' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /offramp/payouts/{payout_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/OfframpPayoutId'
    post:
      tags: [Off-ramp]
      operationId: cancelOfframpPayout
      summary: Cancel a payout
      description: Only while `awaiting_deposit`.
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfframpPayout' }
        '409': { $ref: '#/components/responses/InvalidState' }

  # ---------------------------------------------------------------- Checkout Sessions
  /checkout-sessions:
    post:
      tags: [Checkout Sessions]
      operationId: createCheckoutSession
      summary: Create a hosted checkout session
      description: |
        Creates an invoice **and** a hosted payment page at `https://pay.coinvello.com/c/{id}`.
        Redirect the customer to `url`. The page lets them pick an asset, shows the QR / EIP-681
        link, offers MetaMask / WalletConnect / Phantom / TronLink pay buttons, and redirects to
        `success_url` on `paid`/`confirming` (configurable via `redirect_on`).

        The path `/checkout_sessions` is accepted as an alias.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutSessionCreateRequest' }
            example:
              amount: "129.00"
              currency: EUR
              accepted_assets: ["btc:bitcoin", "eth:ethereum", "usdt:tron", "usdc:polygon"]
              order_id: "SHOP-8812"
              success_url: "https://shop.example.com/thanks?order=8812"
              cancel_url: "https://shop.example.com/cart"
              customer: { email: "buyer@example.com" }
              line_items:
                - name: "Mechanical keyboard"
                  quantity: 1
                  unit_amount: "129.00"
              branding: { theme: auto }
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSession' }
              examples:
                session: { $ref: '#/components/examples/CheckoutSessionOpen' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { $ref: '#/components/responses/InsufficientCredits' }
    get:
      tags: [Checkout Sessions]
      operationId: listCheckoutSessions
      summary: List checkout sessions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CheckoutSessionStatus' }
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CheckoutSession' }

  /checkout-sessions/{checkout_session_id}:
    parameters:
      - $ref: '#/components/parameters/CheckoutSessionId'
    get:
      tags: [Checkout Sessions]
      operationId: getCheckoutSession
      summary: Retrieve a checkout session
      parameters:
        - name: expand
          in: query
          description: Set to `invoice` to embed the full invoice object.
          schema: { type: string, enum: [invoice] }
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSession' }
        '404': { $ref: '#/components/responses/NotFound' }

  /checkout-sessions/{checkout_session_id}/public:
    parameters:
      - $ref: '#/components/parameters/CheckoutSessionId'
    get:
      tags: [Checkout Sessions]
      operationId: getPublicCheckoutSession
      summary: Public (payer-facing) view of a checkout session
      description: |
        **No authentication.** CORS-open (`Access-Control-Allow-Origin: *`). This is what the
        hosted page on pay.coinvello.com and the embeddable widget read; the session id is the
        only capability needed, which is why ids are unguessable.

        Returns a `PublicCheckoutSession`: a redacted projection of the session + invoice that
        contains only what a payer must see. It never includes API keys, `metadata`, `customer`,
        wallet ids beyond `wallet_id` on options, or anything about the merchant account.
        Credit purchases (`purpose: credits`) are served from the same endpoint using the purchase id.

        Each payment option carries the canonical fields of `PaymentOption` **plus convenience
        aliases** used by the checkout SDK: `uri` (= `payment_uri`), `chain_id` (= `network_id`),
        `token_contract` (= `contract_address`) and `rate_locked_until`.
      security: []
      responses:
        '200':
          description: Public session
          headers:
            Access-Control-Allow-Origin: { schema: { type: string, const: "*" } }
            Cache-Control: { schema: { type: string, const: "no-store" } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicCheckoutSession' }
              examples:
                public: { $ref: '#/components/examples/PublicCheckoutSessionConfirming' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /checkout-sessions/{checkout_session_id}/events:
    parameters:
      - $ref: '#/components/parameters/CheckoutSessionId'
    get:
      tags: [Checkout Sessions]
      operationId: streamPublicCheckoutSession
      summary: Live status stream (Server-Sent Events)
      description: |
        **No authentication.** CORS-open. Returns `text/event-stream` and keeps the connection open
        until the session reaches a terminal state (`paid`, `overpaid`, `expired`, `cancelled`)
        plus a short grace period, or the client disconnects.

        Events:
        * `event: status` - sent immediately on connect and on **every** change; `data` is the full
          `PublicCheckoutSession` JSON (same body as `/public`). `id:` is a monotonically increasing
          sequence; clients may send `Last-Event-ID` to resume.
        * `event: heartbeat` - every 15 seconds; `data` is `{"ts":"<RFC3339>"}`. Lets proxies and
          clients detect dead connections.

        ```
        event: status
        id: 3
        data: {"id":"cs_5TgH8kLp2Q","object":"checkout_session.public","status":"confirming",...}

        event: heartbeat
        data: {"ts":"2026-10-21T10:04:27Z"}
        ```

        **Polling fallback.** If `EventSource` is unavailable or the stream fails, poll
        `GET /checkout-sessions/{id}/public` every 5 s while non-terminal, backing off
        exponentially to 60 s on errors; keep a slow 30 s poll even while SSE is connected as a
        safety net. The hosted checkout does exactly this. Status changes are also pushed to the
        merchant through webhooks; the stream is a UX channel, never proof of payment.
      security: []
      responses:
        '200':
          description: Event stream
          headers:
            Access-Control-Allow-Origin: { schema: { type: string, const: "*" } }
            Cache-Control: { schema: { type: string, const: "no-cache" } }
            X-Accel-Buffering: { schema: { type: string, const: "no" } }
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames. `status` events carry a `PublicCheckoutSession`; `heartbeat` events carry `{"ts"}`.
              example: |
                event: status
                id: 1
                data: {"id":"cs_5TgH8kLp2Q","object":"checkout_session.public","purpose":"payment","status":"pending","amount":"129.00","currency":"EUR","payment_options":[],"payments":[],"paid":null,"expires_at":"2026-10-21T10:30:00Z"}

                event: heartbeat
                data: {"ts":"2026-10-21T10:00:15Z"}
        '404': { $ref: '#/components/responses/NotFound' }

  /checkout-sessions/{checkout_session_id}/expire:
    parameters:
      - $ref: '#/components/parameters/CheckoutSessionId'
    post:
      tags: [Checkout Sessions]
      operationId: expireCheckoutSession
      summary: Expire a checkout session
      responses:
        '200':
          description: Expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSession' }
        '409': { $ref: '#/components/responses/InvalidState' }

  # ---------------------------------------------------------------- Refunds
  /refunds:
    post:
      tags: [Refunds]
      operationId: createRefund
      summary: Request a refund
      description: |
        Creates a refund request against a paid (or underpaid/overpaid/late) payment. Because
        CoinVello holds no funds, the refund is executed by **you**:

        1. The refund is created in `requested`, then `awaiting_signature` once CoinVello has
           prepared an `unsigned_transaction` from the receiving wallet to the customer's
           `destination_address` (for xpub wallets this is a PSBT spending the invoice's UTXO).
        2. Sign it with your wallet and `POST /refunds/{id}/submit`.
        3. CoinVello tracks confirmations and emits `refund.completed`.

        If the customer has not yet provided a destination, create the refund without one; the
        invoice becomes `refund_requested` and the customer is asked for an address on the
        hosted invoice page (`refund_claim_url`). You can also pass `amount` to issue a partial
        refund (e.g. returning an overpayment).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundCreateRequest' }
            example:
              payment_id: pay_7Hq2kLm9Rt
              amount: "0.00074000"
              destination_address: "bc1qar0srrr7xfkvy5l643lydnw9re59gtzzwf5mdq"
              reason: requested_by_customer
      responses:
        '201':
          description: Refund created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
              examples:
                awaiting: { $ref: '#/components/examples/RefundAwaitingSignature' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/InvalidState' }
    get:
      tags: [Refunds]
      operationId: listRefunds
      summary: List refunds
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: invoice_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RefundStatus' }
      responses:
        '200':
          description: Refunds
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Refund' }

  /refunds/{refund_id}:
    parameters:
      - $ref: '#/components/parameters/RefundId'
    get:
      tags: [Refunds]
      operationId: getRefund
      summary: Retrieve a refund
      responses:
        '200':
          description: Refund
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '404': { $ref: '#/components/responses/NotFound' }

  /refunds/{refund_id}/submit:
    parameters:
      - $ref: '#/components/parameters/RefundId'
    post:
      tags: [Refunds]
      operationId: submitRefund
      summary: Submit the merchant-signed refund transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignedSubmission' }
      responses:
        '200':
          description: Refund processing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /refunds/{refund_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/RefundId'
    post:
      tags: [Refunds]
      operationId: cancelRefund
      summary: Cancel a refund request
      description: Only while `requested` or `awaiting_signature`.
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '409': { $ref: '#/components/responses/InvalidState' }

  # ---------------------------------------------------------------- Events
  /events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events
      description: Events are retained for 90 days. Use this to reconcile missed webhooks.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: type
          in: query
          description: Exact type, or a prefix with wildcard (`invoice.*`).
          schema: { type: string }
          example: "invoice.*"
        - name: related_object_id
          in: query
          description: Return events whose `data.object.id` matches.
          schema: { type: string }
        - $ref: '#/components/parameters/CreatedGte'
        - $ref: '#/components/parameters/CreatedLte'
      responses:
        '200':
          description: Events, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Event' }

  /events/{event_id}:
    parameters:
      - name: event_id
        in: path
        required: true
        schema: { type: string, pattern: '^evt_[A-Za-z0-9]+$' }
    get:
      tags: [Events]
      operationId: getEvent
      summary: Retrieve an event
      responses:
        '200':
          description: Event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
              examples:
                invoicePaid: { $ref: '#/components/examples/EventInvoicePaid' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{event_id}/resend:
    parameters:
      - name: event_id
        in: path
        required: true
        schema: { type: string, pattern: '^evt_[A-Za-z0-9]+$' }
    post:
      tags: [Events, Webhooks]
      operationId: resendEvent
      summary: Re-deliver one event
      description: "Creates a fresh delivery of an existing event to `webhook_id`, or to every enabled endpoint subscribed to its type when omitted. Same event id, `replayed: true`."
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                webhook_id: { type: string, pattern: '^whe_[A-Za-z0-9]+$' }
      responses:
        '200':
          description: Deliveries created
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: event_resend }
                  event_id: { type: string }
                  deliveries:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookDelivery' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Assets
  /health:
    get:
      tags: [Assets]
      operationId: getHealth
      summary: API and database health
      description: Public liveness check for uptime monitors. 200 when the API answers and the database responds.
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  version: { type: string }
                  database: { type: string, enum: [pg, pglite] }
                  invoices: { type: integer }

  /health/watchers:
    get:
      tags: [Assets]
      operationId: getWatcherHealth
      summary: Chain watcher health (for uptime monitors)
      description: |
        Every chain watcher records a heartbeat after each successful polling round. This returns
        `503` with `ok: false` when any watcher has not completed a round within `stale_after_seconds`
        (default 300), or when no watcher is running at all, so an uptime monitor can alert before
        payments go undetected. Live-mode watchers only by default; `mode=all` includes test mode.
        Block times do not matter: a round counts even when the chain produced no new block.
      security: []
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [live, all], default: live }
      responses:
        '200':
          description: All watchers healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatcherHealth' }
        '503':
          description: A watcher is stale or none is running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatcherHealth' }

  /assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: List supported chains and assets
      description: |
        Lists the assets of one mode. With an API key the key's mode applies; without one, the optional
        `CoinVello-Livemode: true|false` header picks the mode (default live). A token appears only in the modes where
        it has a contract: several tokens (for example `usdt:base`, `dai:ethereum`) have no official testnet
        deployment, so they are live-only. Wallets and invoices accept only the assets listed for their mode.
      security: []
      parameters:
        - name: CoinVello-Livemode
          in: header
          required: false
          description: Mode to list when no API key is sent.
          schema: { type: string, enum: ["true", "false"] }
      responses:
        '200':
          description: Supported assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: list }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Asset' }
              example:
                object: list
                data:
                  - id: "btc:bitcoin"
                    object: asset
                    symbol: BTC
                    name: Bitcoin
                    chain: bitcoin
                    kind: native
                    decimals: 8
                    required_confirmations: 1
                    min_amount: "0.00005"
                    testnet: testnet4
                  - id: "usdt:tron"
                    object: asset
                    symbol: USDT
                    name: Tether USD (TRC-20)
                    chain: tron
                    kind: token
                    contract_address: "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"
                    decimals: 6
                    required_confirmations: 19
                    min_amount: "1"
                    testnet: nile

  # ---------------------------------------------------------------- Testing
  /test/simulate_payment:
    post:
      tags: [Testing]
      operationId: simulatePayment
      summary: Simulate an on-chain payment (test mode only)
      description: |
        Creates a synthetic payment for a test-mode invoice and drives it through the normal
        state machine, firing real webhooks. Returns `403 test_mode_only` with a live key.

        Use `confirmations` to control the resulting state: `0` leaves the invoice in `pending`
        (payment `detected`); `>= required_confirmations` moves it to `paid`
        (or `underpaid`/`overpaid` depending on `amount`). Call again with the same
        `tx_hash` and more confirmations to step through `confirming`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulatePaymentRequest' }
            example:
              invoice_id: inv_9XyZ12AbC3
              asset: "usdt:tron"
              confirmations: 20
      responses:
        '200':
          description: Simulated payment and resulting invoice
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { $ref: '#/components/schemas/Payment' }
                  invoice: { $ref: '#/components/schemas/Invoice' }
        '403':
          description: Live key used
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  type: invalid_request_error
                  code: test_mode_only
                  message: "This endpoint is only available with a test API key (cv_test_...)."
                  request_id: req_1a2b3c
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /test/simulate_sweep:
    post:
      tags: [Testing]
      operationId: simulateSweep
      summary: Simulate a sweep of a receiver (test mode only)
      description: |
        Records a synthetic sweep of a test-mode receiver's unswept balance, allocates it to the paid invoices
        it covers and fires `sweep.confirmed` (and `receiver.deployed` the first time). Use it to build and test
        pay-as-you-go accounting without waiting for the sweeper. Returns `403 test_mode_only` with a live key
        and `409 nothing_to_sweep` when the receiver has no unswept balance.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulateSweepRequest' }
            example:
              receiver_id: rcv_base_4Fk9Lq2M
      responses:
        '200':
          description: The simulated sweep
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sweep' }
        '403':
          description: Live key used
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }

  # ================================================================ ACCOUNT & AUTH (dashboard sessions, 2FA)
  /auth/signup:
    post:
      tags: [Account & Auth]
      operationId: authSignup
      summary: Create a merchant account
      description: |
        Email + password only - no identity or business verification (see docs/05-compliance.md). The
        response starts a session, returns the account's first **test** API key (also viewable later under Settings -> API keys) and, outside
        production, registers test-mode wallets for every chain so invoices can be created immediately.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 12 }
                business_name: { type: string, maxLength: 200 }
      responses:
        '201':
          description: Account created, session started
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SessionResponse'
                  - type: object
                    properties:
                      merchant:
                        type: object
                        properties:
                          id: { type: string }
                          email: { type: string }
                          business_name: { type: [string, 'null'] }
                      test_api_key: { type: string, description: "First test key (`cv_test_...`). Shown once." }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/auth/login:
    post:
      tags: [Admin]
      operationId: adminAuthLogin
      summary: Staff login (always followed by a 2FA challenge)
      description: Same contract as `/auth/login`, but for staff accounts. Staff must have TOTP (or WebAuthn) enrolled; the response is always `mfa_required` and the session cookie `cv_admin_session` is set by `POST /auth/mfa/verify`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: MFA required (or session for accounts the policy exempts)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionResponse'
                  - $ref: '#/components/schemas/MfaRequiredResponse'
        '401':
          description: Bad credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/auth/password/forgot:
    post:
      tags: [Admin]
      operationId: adminAuthPasswordForgot
      summary: Request a password reset link (staff)
      description: Same contract and rate limits as `POST /auth/password/forgot`, for staff accounts; the link opens the operator admin and is completed with `POST /auth/password/reset`. TOTP stays mandatory after the reset.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '200':
          description: Accepted (identical response for unknown emails)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api-keys:
    get:
      tags: [Account & Auth]
      operationId: listApiKeys
      summary: List API keys (dashboard, step-up required)
      security: [{ SessionAuth: [] }]
      responses:
        '200':
          description: Active keys, each with its full `key` when one is stored (keys created from 2026-10-29 on)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ApiKey' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
    post:
      tags: [Account & Auth]
      operationId: createApiKey
      summary: Create an API key (dashboard, step-up required)
      description: Up to 20 active keys per mode. Pass `scopes` to create a restricted key (`cv_test_rk_` / `cv_live_rk_`).
      security: [{ SessionAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                livemode: { type: boolean, default: false }
                name: { type: string, maxLength: 100 }
                scopes:
                  type: array
                  items: { type: string }
                  description: "Omit for a full-access key."
      responses:
        '201':
          description: Key created, with its full `key`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
        '403': { $ref: '#/components/responses/StepUpRequired' }

  /api-keys/{api_key_id}:
    parameters:
      - name: api_key_id
        in: path
        required: true
        schema: { type: string, pattern: '^key_[A-Za-z0-9]+$' }
    delete:
      tags: [Account & Auth]
      operationId: revokeApiKey
      summary: Revoke an API key (dashboard, step-up required)
      security: [{ SessionAuth: [] }]
      responses:
        '200':
          description: Revoked key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/login:
    post:
      tags: [Account & Auth]
      operationId: authLogin
      summary: Log in with email and password
      description: |
        Starts a dashboard session. If the account has 2FA enabled (or is a staff account, where
        it is mandatory) the response is `mfa_required: true` with a short-lived `mfa_token`
        (5 minutes) to complete with `POST /auth/mfa/verify`. Otherwise a session is returned
        and the `cv_session` cookie is set.

        After 5 failed attempts the account is locked for 15 minutes (`423 account_locked`).
        Trusted devices (`remember_device` on verify) skip the 2FA prompt for 30 days.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 12 }
      responses:
        '200':
          description: Session created or MFA required
          headers:
            Set-Cookie:
              description: "`cv_session=...; HttpOnly; Secure; SameSite=Lax` (only when a session is created)."
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionResponse'
                  - $ref: '#/components/schemas/MfaRequiredResponse'
              examples:
                session:
                  value:
                    object: session
                    id: ses_7Kd2Lm9Qp
                    account_id: mer_8Pq2Rs6Tu
                    mfa_verified: false
                    step_up_valid_until: null
                    expires_at: "2026-10-21T22:00:00Z"
                mfaRequired:
                  value:
                    mfa_required: true
                    mfa_token: "mfa_eyJhbGciOi..."
                    methods: [totp, email]
                    preferred_method: totp
                    expires_at: "2026-10-21T10:05:00Z"
        '401':
          description: Bad credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error: { type: authentication_error, code: invalid_credentials, message: "Email or password is incorrect.", request_id: req_1 }
        '423':
          description: Account temporarily locked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error: { type: authentication_error, code: account_locked, message: "Too many failed attempts. Try again in 15 minutes.", request_id: req_1, details: { unlock_at: "2026-10-21T10:15:00Z" } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [Account & Auth]
      operationId: authLogout
      summary: End the current session
      security: [{ SessionAuth: [] }, { AdminSession: [] }]
      responses:
        '204': { description: Session revoked }

  /team:
    get:
      tags: [Account & Auth]
      operationId: getTeam
      summary: The account owner and team members
      description: |
        Team members (sub-accounts) sign in with their own email, password and two-factor authentication (required) and
        act on this account within their role. `admin`: everything except acting on the owner; manages the team.
        `developer`: invoices, checkout, webhooks, API keys, test tools and exports; no wallets, billing, plan or team.
        `viewer`: read-only, plus their own security settings and exports. Writes outside a role answer `403 role_insufficient`.
      security: [{ SessionAuth: [] }]
      responses:
        '200':
          description: Team
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: team }
                  owner: { type: object, properties: { email: { type: string }, role: { type: string, const: owner } } }
                  members: { type: array, items: { $ref: '#/components/schemas/TeamMember' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /team/members:
    post:
      tags: [Account & Auth]
      operationId: inviteTeamMember
      summary: Invite a team member
      description: |
        Owner and admins only, with a fresh second factor. The invitee gets an email with a single-use link (72 h) to choose
        a password, then enrols 2FA on first sign-in. The link goes only to that inbox: it is how the invitee proves the
        address is theirs (a development server without mail also returns it as `set_password_url`). Emails are unique
        across all CoinVello accounts and team members, and @coinvello.com addresses are reserved (`email_reserved`).
      security: [{ SessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [admin, developer, viewer] }
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TeamMember'
                  - type: object
                    properties:
                      set_password_url: { type: string, format: uri, description: Development servers without mail only. }
                      expires_in: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/InvalidState' }
  /team/members/{id}:
    patch:
      tags: [Account & Auth]
      operationId: updateTeamMember
      summary: Change a member's role or disable it
      description: Owner and admins only, with a fresh second factor; not on yourself. Ends the member's sessions so the change applies at once.
      security: [{ SessionAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^mbr_[A-Za-z0-9]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [admin, developer, viewer] }
                status: { type: string, enum: [active, disabled] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Account & Auth]
      operationId: removeTeamMember
      summary: Remove a team member
      description: Owner and admins only, with a fresh second factor; not yourself. Signs the member out everywhere at once. Its entries in the activity log stay.
      security: [{ SessionAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^mbr_[A-Za-z0-9]+$' } }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema: { type: object, properties: { id: { type: string }, object: { type: string, const: team_member }, deleted: { type: boolean } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /team/members/{id}/resend:
    post:
      tags: [Account & Auth]
      operationId: resendTeamInvite
      summary: Send a new invite link
      description: For a member that has not set a password yet; older links stop working.
      security: [{ SessionAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^mbr_[A-Za-z0-9]+$' } }
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TeamMember'
                  - type: object
                    properties:
                      set_password_url: { type: string, format: uri, description: Development servers without mail only. }
                      expires_in: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/InvalidState' }
  /account/activity:
    get:
      tags: [Account & Auth]
      operationId: listAccountActivity
      summary: Activity log
      description: |
        Owner and admins. Sign-ins (including failed ones), sign-outs, password and 2FA changes, team changes, every change
        made from the dashboard, and API-key changes to keys, wallets, webhooks and account settings. Append-only: there is
        no way to edit or delete an entry, through the API or otherwise. Newest first.
      security: [{ SessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: action, in: query, description: 'Prefix, e.g. login.', schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string, enum: [success, failure] } }
      responses:
        '200':
          description: Activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: list }
                  data: { type: array, items: { $ref: '#/components/schemas/Activity' } }
                  has_more: { type: boolean }
                  next_cursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/email/verify:
    post:
      tags: [Account & Auth]
      operationId: authEmailVerify
      summary: Confirm an email address
      description: Consumes the single-use token from the confirmation email (72 h) and marks the merchant's address verified. Rate limited per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, pattern: '^evf_[A-Za-z0-9_-]{20,100}$' }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVerification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/email/resend:
    post:
      tags: [Account & Auth]
      operationId: authEmailResend
      summary: Send a new confirmation email
      description: For the signed-in merchant whose address is not verified yet; supersedes older links. At most 5 per hour.
      security: [{ SessionAuth: [] }]
      responses:
        '200':
          description: Sent (or already verified)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVerification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/password/forgot:
    post:
      tags: [Account & Auth]
      operationId: authPasswordForgot
      summary: Request a password reset link (merchant)
      description: |
        Emails a single-use reset link to the merchant account with this email, valid for 30 minutes.
        The response is the same whether or not an account exists (no account enumeration). Requesting
        a new link invalidates earlier unused ones.

        Rate limits (independent of whether the email is registered): 5 requests per IP and 3 per email
        address per hour (`429 rate_limited`).

        A reset never touches 2FA: the next sign-in still asks for the second factor (TOTP, email code
        or recovery code). Operators use `POST /admin/auth/password/forgot`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '200':
          description: Accepted (identical response for unknown emails)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/password/reset:
    post:
      tags: [Account & Auth]
      operationId: authPasswordReset
      summary: Set a new password with a reset token
      description: |
        Completes a reset started with `POST /auth/password/forgot` (merchants) or
        `POST /admin/auth/password/forgot` (operators). On success the token is burned, the password is
        replaced, every session and trusted device of the account is revoked, pending sign-in challenges
        are cancelled and the owner is emailed. No session is created: sign in again with the new
        password, and the second factor is still required if 2FA is enabled.

        Rate limit: 10 attempts per IP per hour (`429 rate_limited`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string, maxLength: 200, description: "`pwr_...` from the emailed link." }
                new_password: { type: string, format: password, minLength: 12, maxLength: 256 }
      responses:
        '200':
          description: Password changed; all sessions revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetResult' }
        '400':
          description: Invalid password, or the token is unknown, used or expired (`reset_token_invalid`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error: { type: invalid_request_error, code: reset_token_invalid, message: "This reset link is invalid or has expired. Request a new one.", param: token, request_id: req_1 }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/mfa/verify:
    post:
      tags: [Account & Auth]
      operationId: authMfaVerify
      summary: Complete a 2FA challenge (login or step-up)
      description: |
        Used in two situations:
        * **Login**: pass the `mfa_token` from `/auth/login`. On success a session is created.
        * **Step-up**: with an existing session, omit `mfa_token`. On success the session gains a
          `step_up_valid_until` 5 minutes in the future, which is required for sensitive actions
          (changing wallets/xpubs, webhook endpoints, API keys, disabling 2FA).

        `method` is `totp`, `email`, `webauthn` or `recovery_code`. For `webauthn`, `code` is the
        JSON-serialised assertion from `navigator.credentials.get()` (options from
        `POST /auth/mfa/webauthn/assertion-options`).
      security: [{}, { SessionAuth: [] }, { AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, code]
              properties:
                mfa_token: { type: string, description: From `/auth/login`. Omit for step-up. }
                method: { $ref: '#/components/schemas/MfaMethod' }
                code: { type: string, description: "6-digit TOTP/email code, recovery code, or WebAuthn assertion JSON." }
                remember_device:
                  type: boolean
                  default: false
                  description: Login only. Sets a signed `cv_trusted_device` cookie (30 days) so this browser skips 2FA at login. Step-up is never skipped.
      responses:
        '200':
          description: Verified
          headers:
            Set-Cookie:
              description: "`cv_session` (login) and optionally `cv_trusted_device`."
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401':
          description: Wrong or expired code / token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error: { type: authentication_error, code: mfa_code_invalid, message: "The code is incorrect or has expired.", request_id: req_1, details: { attempts_remaining: 3 } }
        '423':
          description: Locked after 5 failed codes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/mfa/status:
    get:
      tags: [Account & Auth]
      operationId: authMfaStatus
      summary: 2FA status for the current account
      security: [{ SessionAuth: [] }, { AdminSession: [] }]
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaStatus' }
              example:
                object: mfa_status
                enabled: true
                required: false
                methods:
                  - { method: totp, enabled: true, enrolled_at: "2026-10-01T09:00:00Z", label: null }
                  - { method: email, enabled: true, enrolled_at: "2026-10-01T09:02:00Z", label: "j***@example.com" }
                  - { method: webauthn, enabled: false, enrolled_at: null, label: null }
                preferred_method: totp
                recovery_codes_remaining: 8
                trusted_devices: 2
                step_up_valid_until: null

  /auth/mfa/totp/enroll:
    post:
      tags: [Account & Auth]
      operationId: authTotpEnroll
      summary: Start TOTP enrolment
      description: Returns a new secret (RFC 6238, SHA-1, 6 digits, 30-second step), an `otpauth://` URI and an inline SVG QR code. The secret is pending until confirmed with `POST /auth/mfa/totp/confirm`. Re-enrolling while TOTP is active requires step-up.
      security: [{ SessionAuth: [] }, { AdminSession: [] }]
      responses:
        '200':
          description: Pending enrolment
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: totp_enrollment }
                  secret: { type: string, description: Base32 secret for manual entry. }
                  otpauth_uri: { type: string, example: "otpauth://totp/CoinVello:merchant@example.com?secret=JBSWY3DPEHPK3PXP&issuer=CoinVello&algorithm=SHA1&digits=6&period=30" }
                  qr_svg: { type: string, description: Inline SVG of the otpauth URI. }
                  expires_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/StepUpRequired' }

  /auth/mfa/totp/confirm:
    post:
      tags: [Account & Auth]
      operationId: authTotpConfirm
      summary: Confirm TOTP enrolment with a code
      description: On first 2FA enrolment the response includes the 10 recovery codes - this is the only time they are shown in plaintext.
      security: [{ SessionAuth: [] }, { AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: TOTP enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { $ref: '#/components/schemas/MfaStatus' }
                  recovery_codes:
                    type: [array, 'null']
                    items: { type: string }
                    description: Present only when 2FA was just enabled for the first time.
        '401':
          description: Code invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/mfa/email/enable:
    post:
      tags: [Account & Auth]
      operationId: authEmailOtpEnable
      summary: Enable email one-time codes
      description: "Sends a confirmation code to the account email; enabling completes when it is verified via `POST /auth/mfa/verify` with method `email`. Email OTP provides weaker assurance than TOTP or WebAuthn (see docs/security.md)."
      security: [{ SessionAuth: [] }, { AdminSession: [] }]
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailCodeSent' }
        '403': { $ref: '#/components/responses/StepUpRequired' }

  /auth/mfa/email/send-code:
    post:
      tags: [Account & Auth]
      operationId: authEmailOtpSend
      summary: Send a 6-digit email code
      description: For login (pass `mfa_token`) or step-up (session). Codes are 6 digits, expire after 10 minutes, and are single-use. Rate limited to 1 send per 60 s and 5 per hour per account.
      security: [{}, { SessionAuth: [] }, { AdminSession: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mfa_token: { type: string }
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailCodeSent' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/mfa/webauthn/register-options:
    post:
      tags: [Account & Auth]
      operationId: authWebauthnRegisterOptions
      summary: Get WebAuthn registration options (passkeys)
      security: [{ SessionAuth: [] }, { AdminSession: [] }]
      responses:
        '200':
          description: PublicKeyCredentialCreationOptions (JSON, base64url-encoded binary fields)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  challenge_id: { type: string }
                  publicKey: { type: object, additionalProperties: true }
        '403': { $ref: '#/components/responses/StepUpRequired' }

  /auth/mfa/webauthn/register:
    post:
      tags: [Account & Auth]
      operationId: authWebauthnRegister
      summary: Register a passkey
      security: [{ SessionAuth: [] }, { AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, credential]
              properties:
                challenge_id: { type: string }
                credential: { type: object, additionalProperties: true, description: Serialised `PublicKeyCredential` from `navigator.credentials.create()`. }
                label: { type: string, maxLength: 60, example: "MacBook Touch ID" }
      responses:
        '200':
          description: Passkey registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaStatus' }

  /auth/mfa/webauthn/assertion-options:
    post:
      tags: [Account & Auth]
      operationId: authWebauthnAssertionOptions
      summary: Get WebAuthn assertion options for login/step-up
      security: [{}, { SessionAuth: [] }, { AdminSession: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mfa_token: { type: string }
      responses:
        '200':
          description: PublicKeyCredentialRequestOptions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /auth/mfa/recovery-codes:
    get:
      tags: [Account & Auth]
      operationId: authRecoveryCodesStatus
      summary: Recovery codes status
      description: Codes themselves are never returned here (they are hashed at rest); only the count remaining.
      security: [{ SessionAuth: [] }, { AdminSession: [] }]
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: recovery_codes }
                  total: { type: integer, const: 10 }
                  remaining: { type: integer }
                  generated_at: { type: [string, 'null'], format: date-time }
    post:
      tags: [Account & Auth]
      operationId: authRecoveryCodesRegenerate
      summary: Regenerate recovery codes
      description: Invalidates all existing codes and returns 10 new single-use codes (shown once). Requires step-up.
      security: [{ SessionAuth: [] }, { AdminSession: [] }]
      responses:
        '200':
          description: New codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: recovery_codes }
                  codes:
                    type: array
                    minItems: 10
                    maxItems: 10
                    items: { type: string, example: "k7f2-9dq3-x1m8" }
                  generated_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/StepUpRequired' }

  /auth/mfa/{method}:
    parameters:
      - name: method
        in: path
        required: true
        schema: { $ref: '#/components/schemas/MfaMethod' }
    delete:
      tags: [Account & Auth]
      operationId: authMfaDisable
      summary: Disable a 2FA method
      description: |
        Requires a **fresh code** in the body (not just a valid step-up window) to prevent a
        hijacked session from removing 2FA. Removing the last method disables 2FA entirely and
        wipes recovery codes and trusted devices. Staff accounts cannot remove their last method.
      security: [{ SessionAuth: [] }, { AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: A current code from any enabled method (or a recovery code). }
                code_method: { $ref: '#/components/schemas/MfaMethod' }
      responses:
        '200':
          description: Updated status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaStatus' }
        '401':
          description: Code invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Cannot remove the last method on an account where 2FA is required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/sessions:
    get:
      tags: [Account & Auth]
      operationId: authListSessions
      summary: List active sessions and trusted devices
      security: [{ SessionAuth: [] }, { AdminSession: [] }]
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: list }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        current: { type: boolean }
                        ip: { type: string }
                        user_agent: { type: string }
                        trusted_device: { type: boolean }
                        created_at: { type: string, format: date-time }
                        last_seen_at: { type: string, format: date-time }
                        expires_at: { type: string, format: date-time }
    delete:
      tags: [Account & Auth]
      operationId: authRevokeAllSessions
      summary: Revoke every other session and trusted device
      security: [{ SessionAuth: [] }, { AdminSession: [] }]
      responses:
        '204': { description: Revoked }

  /account:
    get:
      tags: [Account & Auth]
      operationId: getAccount
      summary: The signed-in merchant account
      description: Email, business name, status and payer-UI defaults of the account. No identity data exists (docs/05-compliance.md). Dashboard session or API key.
      security: [{ SessionAuth: [] }, { AdminSession: [] }, { ApiKeyAuth: [] }]
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Account & Auth]
      operationId: updateAccount
      summary: Update the account profile and payer-UI defaults
      description: |
        `business_name` is shown on hosted checkout pages. `locale` (BCP-47) and `display_currency` are
        hints every checkout session of this merchant carries (`PublicCheckoutSession.locale_hints`) so the
        page can pre-select the payer's language and the currency used for indicative price display; they
        never change what is charged. Email and password changes are not part of this release.
      security: [{ SessionAuth: [] }, { AdminSession: [] }, { ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                business_name: { type: [string, 'null'], maxLength: 200 }
                locale: { type: [string, 'null'], example: "de-CH", description: "BCP-47 tag, or null to clear." }
                display_currency: { type: [string, 'null'], enum: [USD, EUR, GBP, CAD, AUD, JPY, CHF, SGD, AED, BRL, MXN, ZAR, INR, PLN, SEK, NOK, DKK, CZK, NZD, HKD, KRW, TRY, ILS, THB, PHP, IDR, MYR, VND, NGN, ARS, 'null'], description: "Default display currency for payers, or null to clear." }
                billing_plan:
                  $ref: '#/components/schemas/BillingPlan'
                  description: |
                    Switch between prepaid credits and pay as you go. Applies to invoices created afterwards; open
                    invoices keep the addresses they were issued with. Switching to `pay_as_you_go` creates a receiver
                    for every wallet on a supported chain. With a dashboard session it needs a recent 2FA step-up,
                    since it changes where payers send money (`403 step_up_required`). `422 pay_as_you_go_unavailable`
                    if the plan is not open to the account (it is open to every account at the moment).
                auto_switch_to_pay_as_you_go:
                  type: boolean
                  description: |
                    Switch to pay as you go automatically when the credits run out (see `Account`; default true).
                    Turning it back on with a dashboard session needs a recent 2FA step-up, like switching the plan.
                records:
                  type: object
                  description: Records settings (reporting currency, fiscal year start, timezone), see `Account.records`. Omitted fields keep their value.
                  properties:
                    reporting_currency: { $ref: '#/components/schemas/FiatCurrency' }
                    fiscal_year_start: { type: string, pattern: '^(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$', example: "04-06" }
                    timezone: { type: string, example: Europe/London }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ================================================================ ADMIN (staff only)
  /admin/operator-wallets:
    post:
      tags: [Admin]
      operationId: adminCreateOperatorWallet
      summary: Add an operator wallet
      description: |
        Registers a CoinVello-controlled wallet that receives credit purchases. xpub wallets (BTC) derive a
        fresh address per purchase; address wallets (EVM/Solana/Tron) are reused with amount tagging. `priority`
        picks the wallet when several serve the same asset (lowest wins). An operator wallet accepts every
        asset on its chain in its mode (native coin and every token); `assets` in requests is ignored and
        responses list the full set.

        Pass `chains` (EVM chains) instead of `chain` to register one address on several chains as a group
        sharing `group_id`; the response is then a list envelope. The activation delay applies to the whole group. Non-EVM chains in `chains` return
        `422 chains_not_compatible`.

        Only `owner` or `finance` staff can create a wallet (`403 insufficient_scope` otherwise), with a fresh
        second factor (session step-up within 5 minutes, or `CoinVello-MFA-Code` with a `cv_admin_` key;
        otherwise `403 step_up_required`). That step-up is the approval: the wallet is created `active`, with
        `approved_by` set to the creator and `active_from` one activation delay (1 hour by default) away.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminReason'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorWalletCreateRequest' }
            examples:
              xpub:
                value:
                  chain: bitcoin
                  assets: ["btc:bitcoin"]
                  xpub: "zpub6s1fB2d..."
                  derivation_path: "m/84'/0'/0'"
                  address_type: p2wpkh
                  label: "Ops cold BTC #1"
                  enabled: true
                  priority: 10
              evm:
                value:
                  chain: polygon
                  assets: ["usdc:polygon", "usdt:polygon"]
                  address: "0xOperatorPolygon0000000000000000000000001"
                  label: "Ops Polygon stables"
                  enabled: true
                  priority: 20
      responses:
        '201':
          description: Created (one wallet, or the list for a `chains` group)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OperatorWallet'
                  - allOf:
                      - $ref: '#/components/schemas/ListResponse'
                      - type: object
                        properties:
                          group_id: { type: string }
                          data:
                            type: array
                            items: { $ref: '#/components/schemas/OperatorWallet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Admin]
      operationId: adminListOperatorWallets
      summary: List operator wallets
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: chain
          in: query
          schema: { $ref: '#/components/schemas/Chain' }
        - name: enabled
          in: query
          schema: { type: boolean }
        - name: group_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Operator wallets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OperatorWallet' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/operator-wallets/{operator_wallet_id}:
    parameters:
      - name: operator_wallet_id
        in: path
        required: true
        schema: { type: string, pattern: '^opw_[A-Za-z0-9]+$' }
    get:
      tags: [Admin]
      operationId: adminGetOperatorWallet
      summary: Retrieve an operator wallet
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      responses:
        '200':
          description: Operator wallet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorWallet' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin]
      operationId: adminUpdateOperatorWallet
      summary: Update an operator wallet
      description: Key material (`xpub`/`address`) is immutable; create a new wallet and disable the old one instead.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminReason'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 100 }
                assets:
                  type: array
                  items: { $ref: '#/components/schemas/AssetId' }
                enabled: { type: boolean }
                priority: { type: integer, minimum: 0, maximum: 1000 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorWallet' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      operationId: adminDeleteOperatorWallet
      summary: Retire an operator wallet
      description: Soft-delete. Open purchases pointing at it keep being monitored.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminReason'
      responses:
        '200':
          description: Retired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/operator-wallets/{operator_wallet_id}/chains:
    parameters:
      - name: operator_wallet_id
        in: path
        required: true
        schema: { type: string, pattern: '^opw_[A-Za-z0-9]+$' }
    post:
      tags: [Admin]
      operationId: adminAddOperatorWalletChains
      summary: Extend an operator address wallet to more chains
      description: |
        Same contract as `POST /wallets/{id}/chains` for operator wallets: siblings copy label, priority,
        and enabled (every asset on each chain is accepted; `assets` is ignored), join the source's group (assigned if missing), and are
        created `active` with the activation delay. Owner/finance staff only; requires a fresh second factor (step-up, or `CoinVello-MFA-Code` with an admin
        key). Audit-logged with the group id.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminReason'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chains]
              properties:
                chains:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/Chain' }
                assets:
                  type: array
                  items: { $ref: '#/components/schemas/AssetId' }
      responses:
        '200':
          description: The sibling wallets created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      group_id: { type: string }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/OperatorWallet' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /admin/operator-wallets/{operator_wallet_id}/approve:
    parameters:
      - name: operator_wallet_id
        in: path
        required: true
        schema: { type: string, pattern: '^opw_[A-Za-z0-9]+$' }
    post:
      tags: [Admin]
      operationId: adminApproveOperatorWallet
      summary: Approve a pending operator wallet (2FA step-up, legacy)
      description: |
        New wallets are created `active`, so this only applies to wallets created `pending_approval` before
        approval was folded into creation. Self-service approval (docs/01-architecture.md §3a): any `owner` or `finance` staff member,
        including the creator, after a **fresh second factor** - a session step-up (`POST /auth/mfa/verify`)
        within the last 5 minutes, or, for `cv_admin_` keys, a current TOTP code in the `CoinVello-MFA-Code`
        header; otherwise `403 step_up_required`. The wallet becomes `active` with `active_from`
        `OPERATOR_WALLET_ACTIVATION_DELAY_SECONDS` (default 1 hour, 0 allowed) in the future and receives
        nothing before that - the delay is the remaining safety net. For a multi-chain group every pending
        member is approved together. Audit-logged (with the group id).
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminReason'
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorWallet' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /admin/credit-bundles:
    post:
      tags: [Admin]
      operationId: adminCreateCreditBundle
      summary: Create a credit bundle
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminReason'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreditBundleWriteRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditBundle' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Admin]
      operationId: adminListCreditBundles
      summary: List credit bundles (including disabled)
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Bundles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CreditBundle' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/credit-bundles/{bundle_id}:
    parameters:
      - name: bundle_id
        in: path
        required: true
        schema: { type: string, pattern: '^bnd_[A-Za-z0-9_]+$' }
    get:
      tags: [Admin]
      operationId: adminGetCreditBundle
      summary: Retrieve a credit bundle
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      responses:
        '200':
          description: Bundle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditBundle' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin]
      operationId: adminUpdateCreditBundle
      summary: Update a credit bundle
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminReason'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreditBundleWriteRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditBundle' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      operationId: adminDeleteCreditBundle
      summary: Disable a credit bundle
      description: "Bundles are never hard-deleted (ledger history references them); this sets enabled to false."
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminReason'
      responses:
        '200':
          description: Disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditBundle' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/merchants:
    get:
      tags: [Admin]
      operationId: adminListMerchants
      summary: List merchants
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { type: string, enum: [active, suspended, closed] }
        - name: email
          in: query
          schema: { type: string }
        - name: query
          in: query
          description: Free-text search over id, email, business name.
          schema: { type: string }
        - name: has_paid
          in: query
          description: 'Only merchants with at least one paid or overpaid payment invoice in the chosen mode.'
          schema: { type: string, enum: ['true', 'false'] }
        - name: livemode
          in: query
          description: 'Mode for `has_paid` (default from the CoinVello-Livemode header, else live).'
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Merchants
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminMerchant' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/merchants/{merchant_id}:
    parameters:
      - name: merchant_id
        in: path
        required: true
        schema: { type: string, pattern: '^mer_[A-Za-z0-9]+$' }
    get:
      tags: [Admin]
      operationId: adminGetMerchant
      summary: Retrieve a merchant
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      responses:
        '200':
          description: Merchant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMerchant' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/merchants/{merchant_id}/suspend:
    parameters:
      - name: merchant_id
        in: path
        required: true
        schema: { type: string, pattern: '^mer_[A-Za-z0-9]+$' }
    post:
      tags: [Admin]
      operationId: adminSuspendMerchant
      summary: Suspend (or unsuspend) a merchant
      description: Suspended merchants cannot create invoices, checkout sessions or purchases; existing invoices keep being monitored and webhooks keep firing so customers are not stranded.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminReason'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspended]
              properties:
                suspended: { type: boolean }
                reason: { type: string, enum: [abuse, sanctions_screening, chargeback_fraud, terms_violation, merchant_request, other] }
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Updated merchant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMerchant' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/credit-ledger:
    get:
      tags: [Admin]
      operationId: adminListCreditLedger
      summary: List the global credit ledger
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: merchant_id
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, enum: [debit, credit] }
        - name: reason
          in: query
          schema: { $ref: '#/components/schemas/CreditLedgerReason' }
        - $ref: '#/components/parameters/CreatedGte'
        - $ref: '#/components/parameters/CreatedLte'
      responses:
        '200':
          description: Ledger entries across all merchants
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/CreditLedgerEntry'
                            - type: object
                              properties:
                                merchant_id: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: adminCreateLedgerAdjustment
      summary: Post a manual credit adjustment
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AdminReason'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchant_id, type, amount]
              properties:
                merchant_id: { type: string }
                type: { type: string, enum: [debit, credit] }
                amount: { type: integer, minimum: 1 }
                reason: { type: string, enum: [adjustment, promo, bonus, refund_of_fee], default: adjustment }
                description: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Ledger entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditLedgerEntry' }

  /admin/purchases:
    get:
      tags: [Admin]
      operationId: adminListCreditPurchases
      summary: List credit purchases across merchants
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: merchant_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CreditPurchaseStatus' }
        - name: method
          in: query
          schema: { type: string, enum: [crypto, card] }
        - name: operator_wallet_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/CreatedGte'
        - $ref: '#/components/parameters/CreatedLte'
      responses:
        '200':
          description: Purchases
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/CreditPurchase'
                            - type: object
                              properties:
                                merchant_id: { type: string }
                                operator_wallet_id: { type: [string, 'null'] }
                                processor_transaction_id: { type: [string, 'null'], description: Square payment id for card purchases. }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/purchases/{purchase_id}/refund:
    parameters:
      - name: purchase_id
        in: path
        required: true
        schema: { type: string, pattern: '^cpu_[A-Za-z0-9]+$' }
    post:
      tags: [Admin]
      operationId: adminRefundCreditPurchase
      summary: Refund a card purchase in full (2FA step-up)
      description: |
        Refunds the Square payment in full and reverses the credits it added (`purchase_reversal`; the balance
        may go negative). Requires a fresh second factor like operator-wallet approval. Audit-logged.
        `credits.purchase.refunded` fires.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminReason'
      responses:
        '200':
          description: Refunded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditPurchase' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /admin/purchases/{purchase_id}/dispute:
    parameters:
      - name: purchase_id
        in: path
        required: true
        schema: { type: string, pattern: '^cpu_[A-Za-z0-9]+$' }
    post:
      tags: [Admin]
      operationId: adminDisputeCreditPurchase
      summary: Record a chargeback on a card purchase (2FA step-up)
      description: |
        Square reports chargebacks automatically (its `dispute.created` notification does the same thing); this
        records one by hand, for example after a bank contacts CoinVello directly. Reverses the purchase's
        credits, removes every saved card for that merchant and mode, and switches automatic top-up off.
        Audit-logged.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminReason'
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditPurchase' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /admin/merchants/{id}/stats:
    get:
      tags: [Admin]
      operationId: adminMerchantStats
      summary: Lifetime figures for a merchant
      description: Volume, invoices, fees, credit purchases and account facts, separately for live and test mode.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^mer_[A-Za-z0-9]+$' } }
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: merchant_stats }
                  merchant_id: { type: string }
                  account: { type: object, properties: { plan: { type: string }, auto_switch_to_pay_as_you_go: { type: boolean }, email_verified: { type: boolean }, two_factor: { type: boolean } } }
                  live:
                    type: object
                    properties:
                      volume_usd: { type: string, description: 'USD value of paid and overpaid invoices, valued when paid.' }
                      invoices_paid: { type: integer }
                      invoices_total: { type: integer }
                      invoices_expired: { type: integer }
                      average_order_usd: { type: string }
                      first_paid_at: { type: [string, 'null'], format: date-time }
                      last_paid_at: { type: [string, 'null'], format: date-time }
                      by_asset: { type: array, items: { type: object, properties: { asset: { type: string }, invoices: { type: integer }, volume_usd: { type: string } } } }
                      fees:
                        type: object
                        properties:
                          payg_swept_usd: { type: string }
                          payg_unswept_usd: { type: string }
                          credits_consumed: { type: integer }
                          credits_consumed_nominal_usd: { type: string, description: 'Credits consumed at their nominal $0.01 each (what was actually paid per credit depends on the bundle).' }
                          total_usd: { type: string }
                      credit_purchases: { type: object, properties: { count: { type: integer }, credits: { type: integer }, paid_usd: { type: string } } }
                      wallets: { type: integer }
                      receivers: { type: integer }
                      sweeps: { type: integer }
                  test:
                    type: object
                    properties:
                      volume_usd: { type: string, description: 'USD value of paid and overpaid invoices, valued when paid.' }
                      invoices_paid: { type: integer }
                      invoices_total: { type: integer }
                      invoices_expired: { type: integer }
                      average_order_usd: { type: string }
                      first_paid_at: { type: [string, 'null'], format: date-time }
                      last_paid_at: { type: [string, 'null'], format: date-time }
                      by_asset: { type: array, items: { type: object, properties: { asset: { type: string }, invoices: { type: integer }, volume_usd: { type: string } } } }
                      fees:
                        type: object
                        properties:
                          payg_swept_usd: { type: string }
                          payg_unswept_usd: { type: string }
                          credits_consumed: { type: integer }
                          credits_consumed_nominal_usd: { type: string, description: 'Credits consumed at their nominal $0.01 each (what was actually paid per credit depends on the bundle).' }
                          total_usd: { type: string }
                      credit_purchases: { type: object, properties: { count: { type: integer }, credits: { type: integer }, paid_usd: { type: string } } }
                      wallets: { type: integer }
                      receivers: { type: integer }
                      sweeps: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/merchants/{id}/activity:
    get:
      tags: [Admin]
      operationId: adminListMerchantActivity
      summary: A merchant's activity log
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string, enum: [success, failure] } }
      responses:
        '200':
          description: Activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: list }
                  data: { type: array, items: { $ref: '#/components/schemas/Activity' } }
                  has_more: { type: boolean }
                  next_cursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/merchants/{id}/team:
    get:
      tags: [Admin]
      operationId: adminGetMerchantTeam
      summary: A merchant's team
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Team
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: team }
                  owner: { type: object, properties: { email: { type: string }, role: { type: string } } }
                  members: { type: array, items: { $ref: '#/components/schemas/TeamMember' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/invoices/{id}:
    get:
      tags: [Admin]
      operationId: adminGetInvoice
      summary: Any invoice, with its payments
      description: An invoice of any merchant in either mode (same object as `GET /invoices/{id}`), plus `merchant_id` and its `payments`.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^inv_[A-Za-z0-9]+$' } }
      responses:
        '200':
          description: Invoice
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Invoice'
                  - type: object
                    properties:
                      merchant_id: { type: string }
                      payments: { type: array, items: { $ref: '#/components/schemas/Payment' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/merchants/create:
    post:
      tags: [Admin]
      operationId: adminCreateMerchant
      summary: Create a merchant account (team or hand onboarding)
      description: |
        Creates a merchant account without a usable password and returns a single-use link (72 h) for the invitee to
        choose one; the link is also emailed to them. This is the only way to create accounts on the reserved
        coinvello.com domain, which public signup refuses (`email_reserved`).
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminReason'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                business_name: { type: string, maxLength: 120 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: merchant_invite }
                  merchant: { $ref: '#/components/schemas/AdminMerchant' }
                  set_password_url: { type: string, format: uri }
                  expires_in: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/InvalidState' }
  /admin/merchants/delete:
    post:
      tags: [Admin]
      operationId: adminDeleteMerchants
      summary: Delete merchant accounts in bulk
      description: |
        Accounts with only test-mode activity are erased with all their data. Accounts with any live-mode invoice,
        payment, credit purchase, ledger entry, sweep or record are closed instead (API keys revoked, webhooks
        disabled, sessions ended) and their data kept for the books. Each account is written to the audit log.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminReason'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchant_ids]
              properties:
                merchant_ids: { type: array, minItems: 1, maxItems: 200, items: { type: string, pattern: '^mer_[A-Za-z0-9]+$' } }
      responses:
        '200':
          description: Outcome per merchant
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: merchant_deletion }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        result: { type: string, enum: [deleted, closed, not_found] }
                  deleted: { type: integer }
                  closed: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/merchants/{id}/invoices:
    get:
      tags: [Admin]
      operationId: adminListMerchantInvoices
      summary: A merchant's invoices
      description: The merchant's payment invoices, newest first (same objects as `GET /invoices`; each carries `livemode`).
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: status, in: query, schema: { type: string } }
        - { name: paid, in: query, description: 'Only paid and overpaid invoices (overrides `status`).', schema: { type: string, enum: ['true', 'false'] } }
        - { name: query, in: query, description: 'Search: exact invoice id or payment tx hash, or part of the order id, description or customer email.', schema: { type: string, maxLength: 200 } }
        - { name: livemode, in: query, description: '`any` for both modes; default from the CoinVello-Livemode header, else live.', schema: { type: string, enum: ['true', 'false', 'any'] } }
      responses:
        '200':
          description: Invoices
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: list }
                  data: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
                  has_more: { type: boolean }
                  next_cursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/payg-fees:
    get:
      tags: [Admin]
      operationId: adminPaygFeeSummary
      summary: Pay-as-you-go fee revenue
      description: |
        Operator view of pay-as-you-go revenue across all merchants. `collected_usd` is the fee share of confirmed,
        non-simulated sweeps confirmed since `since`, valued when swept (fees whose destination was `forfeited` are
        reported separately). `accrued_unswept_usd` is the fee owed by paid pay-as-you-go invoices that no sweep has
        collected yet, at any age. `network_fees_usd` is the gas CoinVello paid for the sweeps it initiated.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - { name: since, in: query, description: 'Start of the window (default 30 days ago).', schema: { type: string, format: date-time } }
        - { name: livemode, in: query, description: 'Mode to report on (default from the CoinVello-Livemode header, else live).', schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: payg_fee_summary }
                  livemode: { type: boolean }
                  since: { type: string, format: date-time }
                  collected_usd: { type: string, examples: ['1.53'] }
                  sweeps: { type: integer }
                  network_fees_usd: { type: string, examples: ['0.04'] }
                  forfeited_usd: { type: string, examples: ['0.00'] }
                  accrued_unswept_usd: { type: string, examples: ['0.00'] }
                  invoices_awaiting_sweep: { type: integer }
                  by_chain:
                    type: array
                    items:
                      type: object
                      properties:
                        chain: { $ref: '#/components/schemas/Chain' }
                        collected_usd: { type: string }
                        sweeps: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/watchers:
    get:
      tags: [Admin]
      operationId: adminListWatchers
      summary: Chain watcher checkpoints
      description: Last scanned block per (chain, mode, watcher) and any pending rescan request. Lag = chain tip minus `last_block`.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      responses:
        '200':
          description: Checkpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: list }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        object: { type: string, const: watcher_checkpoint }
                        chain: { $ref: '#/components/schemas/Chain' }
                        livemode: { type: boolean }
                        watcher: { type: string }
                        last_block: { type: integer }
                        last_block_hash: { type: [string, 'null'] }
                        state: { type: object, additionalProperties: true }
                        updated_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/watchers/{chain}/rescan:
    parameters:
      - name: chain
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Chain' }
    post:
      tags: [Admin]
      operationId: adminRescanWatcher
      summary: Rescan a chain from a block (backfill)
      description: |
        Rewinds the watcher checkpoint so the next poll scans forward from `from_block`. Used to pick up a
        payment that arrived while the watcher was down or before a detection fix. Observations are
        idempotent, so rescanning already-seen blocks is safe. Mode comes from `livemode` or the
        `CoinVello-Livemode` header (default live). Audit-logged.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminReason'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_block]
              properties:
                from_block: { type: integer, minimum: 0 }
                livemode: { type: boolean }
      responses:
        '200':
          description: Rescan scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: watcher_rescan }
                  chain: { $ref: '#/components/schemas/Chain' }
                  livemode: { type: boolean }
                  watcher: { type: string }
                  from_block: { type: integer }
                  note: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/access-blocks:
    get:
      tags: [Admin]
      operationId: adminListAccessBlocks
      summary: List API access blocks
      description: |
        Blocks by IP address, merchant account or Support Desk email, newest first. The injection guard adds IP and
        merchant blocks automatically (`source: auto`) after repeated requests carrying injection payloads
        (`suspicious_input`); staff can add their own. While a block is active, matching API requests get
        `403 access_temporarily_blocked` with `Retry-After` (`403 access_blocked` for a permanent block), a blocked IP is also refused by every page of the website,
        and a blocked email cannot open Support Desk tickets (`403 email_blocked`).
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          description: "`active` lists only blocks in force now."
          schema: { type: string, enum: [active] }
        - name: subject
          in: query
          description: An IP address, merchant id, email address or `@domain`.
          schema: { type: string }
        - name: type
          in: query
          description: "Only these kinds, comma-separated: `ip`, `merchant`, `email` (the Support Desk's Blocked tab asks for `ip,email`)."
          schema: { type: string, pattern: '^(ip|merchant|email)(,(ip|merchant|email))*$' }
      responses:
        '200':
          description: Access blocks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AccessBlock' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: adminCreateAccessBlock
      summary: Block an IP address, a merchant or a Support Desk email
      description: |
        For `minutes` (default 1440, at most 90 days), or until lifted with `permanent: true`. Give exactly one of:
        - `ip`: all API access, the Support Desk forms and every page of the website.
        - `merchant_id`: all API and dashboard access of the account (API keys and sessions).
        - `email`: an address (`name@example.com`) or a whole domain (`@example.com`) can no longer open Support Desk
          tickets or ask for ticket links (`403 email_blocked`). @coinvello.com addresses are refused.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminReason'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ip: { type: string, maxLength: 64 }
                merchant_id: { type: string, pattern: '^mer_[A-Za-z0-9]+$' }
                email: { type: string, maxLength: 254, description: "An address, or a whole domain written as `@example.com` or `*@example.com`; a domain block also covers its subdomains." }
                minutes: { type: integer, minimum: 1, maximum: 129600 }
                permanent: { type: boolean, description: "Block until lifted, instead of `minutes`." }
                note: { type: string, maxLength: 500 }
      responses:
        '201':
          description: The new block
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessBlock' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/access-blocks/{id}/lift:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^abb_[A-Za-z0-9]+$' }
    post:
      tags: [Admin]
      operationId: adminLiftAccessBlock
      summary: Lift an access block
      description: Ends the block at once and clears the subject's strikes. Lifting an already lifted block returns it unchanged.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminReason'
      responses:
        '200':
          description: The lifted block
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessBlock' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/audit-log:
    get:
      tags: [Admin]
      operationId: adminListAuditLog
      summary: List the staff audit log
      description: Append-only record of every admin write (and approval), newest first.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: staff_id
          in: query
          schema: { type: string }
        - name: action
          in: query
          description: Exact action or prefix with wildcard (`operator_wallet.*`).
          schema: { type: string }
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AuditLogEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Support Desk
  /support/captcha:
    get:
      tags: [Support]
      operationId: getSupportCaptcha
      summary: Get a proof-of-work challenge
      description: |
        Self-hosted challenge for guest forms, valid 10 minutes and once. Find the integer `number` in
        `[0, maxnumber]` for which `hex(SHA-256(salt + number))` equals `challenge`, then send
        `{ algorithm, challenge, salt, signature, number }` as `captcha`. No cookies, no third party.
      security: []
      responses:
        '200':
          description: A challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportCaptcha' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /support/guest/tickets:
    post:
      tags: [Support]
      operationId: createGuestSupportTicket
      summary: Open a ticket without signing in
      description: |
        For people who cannot sign in (lost password or 2FA, no account yet, a payer with a question). Needs a
        solved `captcha`. The private link to the ticket is emailed to `email` and never returned here, so only
        the owner of the address can read replies. When `email` belongs to a CoinVello account the ticket also
        shows in that account's Support Desk. Limited to a few tickets per hour per address and per IP. Addresses and
        domains staff have blocked get `403 email_blocked`; blocked IP addresses get `403 access_temporarily_blocked`.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, subject, body, captcha]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                subject: { type: string, minLength: 1, maxLength: 200 }
                category: { $ref: '#/components/schemas/SupportTicketCategory' }
                body: { type: string, minLength: 1, maxLength: 10000 }
                invoice_ids: { $ref: '#/components/schemas/SupportInvoiceIds' }
                captcha: { $ref: '#/components/schemas/SupportCaptchaSolution' }
      responses:
        '201':
          description: Ticket opened; the link is on its way to the email address
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: support_ticket_receipt }
                  number: { type: integer, examples: [1042] }
                  email: { type: string }
                  status: { $ref: '#/components/schemas/SupportTicketStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /site/blocked-ips:
    get:
      tags: [Admin]
      operationId: siteBlockedIps
      summary: IP addresses the website refuses
      description: |
        For the CoinVello website only: it sends `CoinVello-Dashboard-Key` (the shared DASHBOARD_PROXY_SECRET) and
        caches the answer for a minute, then refuses these addresses on every page. Any other caller gets
        `403 website_only`.
      security: []
      parameters:
        - name: CoinVello-Dashboard-Key
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The IP addresses blocked right now
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: list }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        ip: { type: string }
                        expires_at: { type: [string, 'null'], format: date-time, description: '`null` for a permanent block.' }
                  has_more: { type: boolean }
                  next_cursor: { type: 'null' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /support/guest/links:
    post:
      tags: [Support]
      operationId: resendGuestSupportLinks
      summary: Email the links to my tickets again
      description: Sends the private links of the most recent tickets opened with this email. Same answer whether or not any exist, except for addresses staff have blocked (`403 email_blocked`).
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, captcha]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                captcha: { $ref: '#/components/schemas/SupportCaptchaSolution' }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: support_links_request }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /support/guest/ticket:
    get:
      tags: [Support]
      operationId: getGuestSupportTicket
      summary: Read a ticket from its private link
      description: The first read also confirms the requester's email address (the link only ever went there). Links of a blocked email or domain answer `403 email_blocked`, and a ticket not confirmed yet is then deleted.
      security: []
      parameters:
        - $ref: '#/components/parameters/SupportTicketToken'
      responses:
        '200':
          description: The ticket and its conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /support/guest/ticket/messages:
    post:
      tags: [Support]
      operationId: replyGuestSupportTicket
      summary: Reply to a ticket from its private link
      description: Reopens a ticket that was waiting on the customer or resolved.
      security: []
      parameters:
        - $ref: '#/components/parameters/SupportTicketToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        '201':
          description: The updated ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /support/tickets:
    get:
      tags: [Support]
      operationId: listSupportTickets
      summary: List the account's tickets
      description: |
        Newest first, without messages. The owner and admins see every ticket of the account (including guest
        tickets opened with the account's email or a member's email); developers and viewers see their own.
      security: [{ SessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/SupportTicketStatus' }
      responses:
        '200':
          description: Tickets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SupportTicket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Support]
      operationId: createSupportTicket
      summary: Open a ticket
      description: |
        The ticket is tied to the signed-in person's email. Every `invoice_ids` entry must be an invoice of this
        account (test or live), otherwise `422 invoice_not_found` lists the unknown ones.
      security: [{ SessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, body]
              properties:
                subject: { type: string, minLength: 1, maxLength: 200 }
                category: { $ref: '#/components/schemas/SupportTicketCategory' }
                body: { type: string, minLength: 1, maxLength: 10000 }
                invoice_ids: { $ref: '#/components/schemas/SupportInvoiceIds' }
      responses:
        '201':
          description: Opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /support/tickets/{id}:
    get:
      tags: [Support]
      operationId: getSupportTicket
      summary: Read a ticket and its conversation
      security: [{ SessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SupportTicketId'
      responses:
        '200':
          description: The ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
        '404': { $ref: '#/components/responses/NotFound' }
  /support/tickets/{id}/messages:
    post:
      tags: [Support]
      operationId: replySupportTicket
      summary: Reply to a ticket
      description: Reopens a ticket that was waiting on the customer or resolved.
      security: [{ SessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SupportTicketId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        '201':
          description: The updated ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /support/agents/{id}/avatar:
    get:
      tags: [Support]
      operationId: getSupportAgentAvatar
      summary: An agent's profile picture
      description: PNG, JPEG, WebP or GIF as uploaded. Cached for a day; the `v` query parameter changes with each upload.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^stf_[A-Za-z0-9]+$' } }
        - { name: v, in: query, schema: { type: integer } }
      responses:
        '200':
          description: The image
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/support/tickets:
    get:
      tags: [Admin]
      operationId: adminListSupportTickets
      summary: The support queue
      description: Most recent activity first. Filter by status, assignee and free text (ticket number, email, subject, invoice or merchant id).
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { type: string, enum: [open, waiting_on_customer, resolved, all], default: open }
        - name: assigned
          in: query
          description: "`me`, `none` or a staff id."
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Tickets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminSupportTicket' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/support/counts:
    get:
      tags: [Admin]
      operationId: adminSupportCounts
      summary: Ticket counts for the queue tabs
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: support_counts }
                  open: { type: integer }
                  waiting_on_customer: { type: integer }
                  resolved: { type: integer }
                  unassigned_open: { type: integer }
                  mine_open: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/support/tickets/{id}:
    get:
      tags: [Admin]
      operationId: adminGetSupportTicket
      summary: A ticket with internal notes, the requester's account and the invoices it names
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/SupportTicketId'
      responses:
        '200':
          description: The ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSupportTicket' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin]
      operationId: adminUpdateSupportTicket
      summary: Change a ticket's status or assignee
      description: Marking a ticket `resolved` emails the requester. Status changes appear in the conversation.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/SupportTicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: '#/components/schemas/SupportTicketStatus' }
                assigned_staff_id: { type: [string, 'null'], pattern: '^stf_[A-Za-z0-9]+$' }
      responses:
        '200':
          description: The updated ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSupportTicket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      operationId: adminDeleteSupportTicket
      summary: Delete a ticket and its whole conversation
      description: |
        Support desk admins only (`403 support_admin_only` for other agents). The ticket and every message are removed
        for good and the requester's link stops working; the audit log keeps the number, subject and requester. Nothing is
        emailed. Guest tickets whose emailed link is not opened within 24 hours are deleted automatically, and until
        then they are not listed here.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/SupportTicketId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/support/tickets/{id}/messages:
    post:
      tags: [Admin]
      operationId: adminReplySupportTicket
      summary: Reply to a ticket, or add an internal note
      description: |
        A reply is emailed to the requester, signed with the agent's visible name; an `internal` note is seen by
        agents only. `status` sets the ticket's status in the same step (typically `waiting_on_customer` or
        `resolved`). An unassigned ticket is assigned to the agent who replies.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/SupportTicketId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
                internal: { type: boolean, default: false }
                status: { $ref: '#/components/schemas/SupportTicketStatus' }
      responses:
        '201':
          description: The updated ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSupportTicket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/support/agents:
    get:
      tags: [Admin]
      operationId: adminListSupportAgents
      summary: Everyone who can answer tickets
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      responses:
        '200':
          description: Agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: list }
                  data: { type: array, items: { $ref: '#/components/schemas/SupportAgent' } }
                  has_more: { type: boolean }
                  next_cursor: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: adminCreateSupportAgent
      summary: Add a support agent
      description: |
        Support desk admins only. The address must be on the CoinVello domain (`@coinvello.com`). Creates a staff
        account limited to the Support Desk and emails a single-use link (72 h) to choose a password; the agent
        sets up an authenticator app on first sign-in. The link is also returned (`set_password_url`).
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                display_name: { type: string, minLength: 1, maxLength: 60 }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SupportAgent'
                  - type: object
                    properties:
                      set_password_url: { type: string, format: uri }
                      expires_in: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/InvalidState' }
  /admin/support/agents/{id}:
    patch:
      tags: [Admin]
      operationId: adminUpdateSupportAgent
      summary: Turn an agent's access off or on
      description: Support desk admins only, for agents added from the Support Desk. Turning access off ends the agent's sessions.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^stf_[A-Za-z0-9]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                active: { type: boolean }
                display_name: { type: string, minLength: 1, maxLength: 60 }
      responses:
        '200':
          description: The agent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAgent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/support/agents/{id}/resend:
    post:
      tags: [Admin]
      operationId: adminResendSupportAgentInvite
      summary: Send an agent a new set-password link
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      parameters:
