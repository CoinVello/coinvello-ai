                allOf:
                  - $ref: '#/components/schemas/SupportAgent'
                  - type: object
                    properties:
                      set_password_url: { type: string, format: uri }
                      expires_in: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/support/profile:
    get:
      tags: [Admin]
      operationId: adminGetSupportProfile
      summary: The signed-in staff member's support profile
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      responses:
