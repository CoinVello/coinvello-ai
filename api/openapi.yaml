        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventExport' }
      responses:
        '200': { description: Acknowledged }

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: "cv_live_... | cv_test_..."
      description: |
        Secret API key from the dashboard (**Settings -> API keys**, shown after a second-factor check).
        Test keys (`cv_test_`) only see test-mode objects and testnets. Restricted keys
        (`cv_live_rk_` / `cv_test_rk_`) carry per-resource scopes (e.g. `invoices:write`).
        Never embed secret keys in browsers or mobile apps - use Checkout Sessions instead.
    AdminAuth:
      type: http
      scheme: bearer
      bearerFormat: "cv_admin_..."
      description: |
        Staff only. Either an admin API key (`Authorization: Bearer cv_admin_...`, issued per staff
        member, IP-allowlisted, scoped) or the dashboard session cookie `cv_admin_session` after a
        completed 2FA (TOTP or WebAuthn) challenge. Every request additionally requires the
        `CoinVello-Admin-Reason` header (free text, written to the audit log) for mutating calls.
        Sensitive writes (operator wallet create/approve) need a fresh second factor: a session step-up
        within 5 minutes, or the `CoinVello-MFA-Code` header (current TOTP code) with an admin key.
    SessionAuth:
      type: apiKey
      in: cookie
      name: cv_session
      description: |
        Merchant dashboard session cookie (HttpOnly, Secure, SameSite=Lax), obtained from `/auth/login`
        (+ `/auth/mfa/verify`). Mutating requests also need the `X-CSRF-Token` header (value from the
        session response). Session requests to merchant endpoints select the mode with the
        `CoinVello-Livemode: true|false` header (default test). Not for integrations - use API keys.
    AdminSession:
      type: apiKey
      in: cookie
      name: cv_admin_session
      description: Staff dashboard session (2FA enforced). Mutating requests also need the `X-CSRF-Token` header.

  headers:
    RequestId:
      description: Unique id of this request; include it when contacting support.
      schema: { type: string }
      example: req_8sD9fK2lMn
    IdempotencyReplayed:
      description: "`true` when this response was replayed from a previous request with the same `Idempotency-Key`."
      schema: { type: boolean }
    RateLimitLimit:
      description: Requests allowed in the current window.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema: { type: integer }
    RateLimitReset:
      description: Unix timestamp (seconds) when the window resets.
      schema: { type: integer }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Any unique string (UUIDv4 recommended, max 255 chars). Repeating a request with the
        same key and same body within 24 hours returns the original response with
        `Idempotency-Replayed: true`. Same key with a different body returns `409 idempotency_key_reused`.
      schema: { type: string, maxLength: 255 }
      example: 7f0c0a4e-6b7e-4e21-9f9c-2b2a0d7a2a51
    SupportTicketId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^tkt_[A-Za-z0-9]+$' }
    SupportTicketToken:
      name: CoinVello-Ticket-Token
      in: header
      required: true
      description: The private ticket token from the link emailed to the requester (`stk_...`).
      schema: { type: string, pattern: '^stk_[A-Za-z0-9_-]{20,100}$' }
    Limit:
      name: limit
      in: query
      description: Page size, 1-100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous response's `next_cursor`.
      schema: { type: string }
    CreatedGte:
      name: created_gte
      in: query
      description: Only objects created at or after this time.
      schema: { type: string, format: date-time }
    CreatedLte:
      name: created_lte
      in: query
      description: Only objects created at or before this time.
      schema: { type: string, format: date-time }
    InvoiceId:
      name: invoice_id
      in: path
      required: true
      schema: { type: string, pattern: '^inv_[A-Za-z0-9]+$' }
      example: inv_9XyZ12AbC3
    WalletId:
      name: wallet_id
      in: path
      required: true
      schema: { type: string, pattern: '^wal_[A-Za-z0-9]+$' }
      example: wal_btc_7Lm3Qp
    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema: { type: string, pattern: '^whe_[A-Za-z0-9]+$' }
      example: whe_2JxK9vL3mQ
    ConversionId:
      name: conversion_id
      in: path
      required: true
      schema: { type: string, pattern: '^cnv_[A-Za-z0-9]+$' }
    OfframpAccountId:
      name: account_id
      in: path
      required: true
      schema: { type: string, pattern: '^ofa_[A-Za-z0-9]+$' }
    OfframpPayoutId:
      name: payout_id
      in: path
      required: true
      schema: { type: string, pattern: '^ofp_[A-Za-z0-9]+$' }
    CheckoutSessionId:
      name: checkout_session_id
      in: path
      required: true
      schema: { type: string, pattern: '^cs_[A-Za-z0-9]+$' }
      example: cs_5TgH8kLp2Q
    ReceiverId:
      name: receiver_id
      in: path
      required: true
      schema: { type: string, pattern: '^rcv_[A-Za-z0-9_]+$' }
      example: rcv_base_4Fk9Lq2M
    SweepId:
      name: sweep_id
      in: path
      required: true
      schema: { type: string, pattern: '^swp_[A-Za-z0-9]+$' }
      example: swp_8Jd3Kq7Ws2
    RefundId:
      name: refund_id
      in: path
      required: true
      schema: { type: string, pattern: '^rf_[A-Za-z0-9]+$' }
    RecordId:
      name: record_id
      in: path
      required: true
      schema: { type: string, pattern: '^rec_[A-Za-z0-9]+$' }
    ExportId:
      name: export_id
      in: path
      required: true
      schema: { type: string, pattern: '^exp_[A-Za-z0-9]+$' }
    OccurredGte:
      name: occurred_gte
      in: query
      description: Only records that occurred (block time) at or after this time.
      schema: { type: string, format: date-time }
    OccurredLte:
      name: occurred_lte
      in: query
      description: Only records that occurred at or before this time.
      schema: { type: string, format: date-time }
    ReportingCurrency:
      name: currency
      in: query
      description: Re-value `value` into this currency from `value_usd` at the historical rate of `occurred_at`. Default - the account's `records.reporting_currency`.
      schema: { $ref: '#/components/schemas/FiatCurrency' }
    IncludeSimulated:
      name: include_simulated
      in: query
      description: Test mode only - include rows created by `/test/simulate_*`. Ignored with a live key.
      schema: { type: boolean, default: false }
    AdminReason:
      name: CoinVello-Admin-Reason
      in: header
      required: true
      description: Free-text justification recorded in the staff audit log.
      schema: { type: string, maxLength: 500 }
      example: "Rotating ops BTC wallet after quarterly key ceremony"

  responses:
    BadRequest:
      description: Malformed request or missing parameter
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              type: invalid_request_error
              code: parameter_missing
              message: "amount is required."
              param: amount
              request_id: req_8sD9fK2lMn
              doc_url: "https://github.com/CoinVello/coinvello-ai/blob/main/api/docs/errors.md"
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              type: authentication_error
              code: api_key_invalid
              message: "Invalid API key provided."
              request_id: req_8sD9fK2lMn
    Forbidden:
      description: Key lacks permission for this resource (e.g. merchant key on `/admin`, restricted key missing scope)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              type: permission_error
              code: admin_only
              message: "This endpoint requires staff credentials (cv_admin_ key or 2FA session)."
              request_id: req_8sD9fK2lMn
    StepUpRequired:
      description: Sensitive action - a recent 2FA verification is required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              type: authentication_error
              code: step_up_required
              message: "Re-authenticate with your second factor to perform this action."
              request_id: req_8sD9fK2lMn
              details: { methods: [totp, email], step_up_window_seconds: 300 }
    InsufficientCredits:
      description: Not enough processing credits
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              type: credits_error
              code: insufficient_credits
              message: "This invoice needs 12 credits and 3 are available. Buy credits at https://coinvello.com/app/credits, or switch to pay as you go."
              request_id: req_8sD9fK2lMn
              details: { available: 3, required: 12, bundles_url: "https://api.coinvello.com/v1/credits/bundles" }
    CardDeclined:
      description: The card was declined. A `failed` purchase is recorded; `details.purchase_id` names it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              type: card_error
              code: card_declined
              message: "This transaction has been declined."
              request_id: req_8sD9fK2lMn
              details: { purchase_id: cpu_6Rt8Yu3KpLm2Qa, decline_code: "2" }
    NotFound:
      description: No such object (or it belongs to the other mode)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              type: invalid_request_error
              code: resource_missing
              message: "No such invoice: inv_doesnotexist"
              param: invoice_id
              request_id: req_8sD9fK2lMn
    IdempotencyConflict:
      description: Idempotency key reused with a different payload, or original request still in flight
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              type: idempotency_error
              code: idempotency_key_reused
              message: "Idempotency-Key was used with a different request body."
              request_id: req_8sD9fK2lMn
    InvalidState:
      description: The object is not in a state that allows this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              type: invalid_request_error
              code: invalid_state
              message: "Invoice inv_9XyZ12AbC3 is paid and cannot be cancelled."
              request_id: req_8sD9fK2lMn
    UnprocessableEntity:
      description: Request was well-formed but semantically invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              type: invalid_request_error
              code: asset_not_enabled
              message: "No enabled wallet accepts usdt:tron. Register one at POST /wallets."
              param: accepted_assets[1]
              request_id: req_8sD9fK2lMn
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              type: rate_limit_error
              code: rate_limited
              message: "Too many requests. Retry after 2 seconds."
              request_id: req_8sD9fK2lMn

  schemas:
    # ------------------------------------------------------------ primitives
    DecimalString:
      type: string
      pattern: '^-?\d+(\.\d+)?$'
      description: Decimal number encoded as a string to avoid float precision loss.
      example: "0.00125000"
    FiatCurrency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: ISO 4217 code. Supported for pricing - USD, EUR, GBP, CAD, AUD, CHF, JPY, SEK, NOK, DKK, PLN, CZK, BRL, MXN, INR, SGD, HKD, NZD, ZAR, TRY, AED.
      example: USD
    Chain:
      type: string
      enum: [bitcoin, ethereum, base, arbitrum, optimism, polygon, bnb, avalanche, robinhood, solana, tron]
      description: Supported blockchain networks. In test mode these map to signet (or testnet4), sepolia, base-sepolia, arbitrum-sepolia, optimism-sepolia, amoy, bnb-testnet, fuji, robinhood-testnet (chain id 46630), devnet, nile respectively. `robinhood` is Robinhood Chain (chain id 4663, an Arbitrum Orbit L2 with ETH as gas); its assets are `eth:robinhood` and `usdg:robinhood` (Paxos Global Dollar).
    AssetId:
      type: string
      pattern: '^[a-z0-9]+:[a-z0-9]+$'
      description: "`<asset>:<chain>` identifier, e.g. `btc:bitcoin`, `usdt:tron`, `usdc:polygon`."
      example: "usdt:tron"
    Metadata:
      type: object
      description: Up to 50 key-value pairs of your own data. Keys max 40 chars, values max 500 chars (strings only). Returned on the object and in webhooks.
      additionalProperties: { type: string, maxLength: 500 }
      maxProperties: 50
      example: { order_id: "10042", customer_ref: "cus_88" }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { $ref: '#/components/schemas/DecimalString' }
        currency:
          type: string
          description: Fiat ISO code or asset id.
          example: USD
    ListResponse:
      type: object
      required: [object, data, has_more]
      properties:
        object: { type: string, const: list }
        data: { type: array, items: {} }
        has_more: { type: boolean }
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` to fetch the next page. `null` when `has_more` is false.
    DeletedResponse:
      type: object
      required: [id, object, deleted]
      properties:
        id: { type: string }
        object: { type: string }
        deleted: { type: boolean, const: true }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message, request_id]
          properties:
            type:
              type: string
              enum: [invalid_request_error, authentication_error, permission_error, idempotency_error, rate_limit_error, credits_error, card_error, chain_error, partner_error, api_error]
            code:
              type: string
              description: Machine-readable code. See docs/errors.md for the full list.
              example: parameter_missing
            message: { type: string, description: "Human-readable, safe to log, not meant for end users." }
            param: { type: string, description: "The offending request parameter (JSON path), when applicable." }
            request_id: { type: string }
            doc_url: { type: string, format: uri }
            details:
              type: object
              description: Additional structured context for some codes.
              additionalProperties: true

    # ------------------------------------------------------------ assets
    Asset:
      type: object
      properties:
        id: { $ref: '#/components/schemas/AssetId' }
        object: { type: string, const: asset }
        symbol: { type: string, example: USDT }
        name: { type: string }
        chain: { $ref: '#/components/schemas/Chain' }
        kind: { type: string, enum: [native, token] }
        contract_address: { type: [string, 'null'] }
        decimals: { type: integer }
        required_confirmations: { type: integer, description: Default confirmations for `paid`. Overridable per invoice. }
        min_amount: { $ref: '#/components/schemas/DecimalString' }
        testnet: { type: string, description: Name of the test network used in test mode. }
        wallet_type: { type: string, enum: [xpub, address], description: Which wallet type is required to accept this asset. }
        status:
          type: string
          enum: [live, coming_soon]
          description: "`coming_soon` assets are listed for discovery but cannot be accepted on invoices, registered on wallets or used for credit purchases yet (`422 asset_coming_soon`)."
        faucet_url: { type: [string, 'null'], format: uri, description: "Test mode only - where to get testnet coins for this asset." }

    # ------------------------------------------------------------ invoices
    InvoiceStatus:
      type: string
      enum: [new, pending, confirming, paid, underpaid, overpaid, expired, cancelled, refund_requested]
      description: |
        * `new` - created, no payment seen
        * `pending` - a payment was detected but is insufficient or has 0 confirmations
        * `confirming` - sufficient amount seen, waiting for required confirmations
        * `paid` - confirmed; fulfil the order
        * `underpaid` - confirmed total below amount (minus `underpayment_tolerance`)
        * `overpaid` - confirmed total above amount (plus `overpayment_tolerance`)
        * `expired` - `expires_at` passed without sufficient payment
        * `cancelled` - merchant cancelled
        * `refund_requested` - a refund is pending for this invoice
    InvoiceCreateRequest:
      type: object
      required: [amount, currency]
      properties:
        amount:
          $ref: '#/components/schemas/DecimalString'
        currency:
          type: string
          description: Fiat ISO 4217 code (`USD`) **or** an asset id (`btc:bitcoin`) to price directly in crypto.
          example: USD
        accepted_assets:
          type: array
          items: { $ref: '#/components/schemas/AssetId' }
          description: Assets the customer may pay with. Each needs an enabled wallet (verification is optional). Defaults to all eligible.
        order_id:
          type: string
          maxLength: 128
          description: Your reference for this order. Indexed; searchable with `GET /invoices?order_id=`.
        description: { type: string, maxLength: 500 }
        customer:
          $ref: '#/components/schemas/Customer'
        success_url: { type: string, format: uri, description: Where the hosted invoice page sends the customer after payment. }
        cancel_url: { type: string, format: uri }
        expires_in:
          type: integer
          minimum: 300
          maximum: 86400
          default: 1800
          description: Seconds until the invoice expires. Rates are held for this period when `rate_lock` is true.
        rate_lock:
          type: boolean
          default: true
          description: Hold the crypto amounts fixed until `expires_at`. When false, amounts are recomputed every 60 seconds and the hosted page refreshes.
        rate_lock_id:
          type: string
          description: Use a previously created rate lock (`POST /rates/locks`) instead of locking at creation.
        required_confirmations:
          type: object
          description: Override per asset id. Defaults from `GET /assets`.
          additionalProperties: { type: integer, minimum: 0, maximum: 100 }
          example: { "btc:bitcoin": 2, "usdt:tron": 19 }
        underpayment_tolerance:
          $ref: '#/components/schemas/DecimalString'
          description: Fraction (e.g. `"0.01"` = 1%) of the amount that may be missing and still count as `paid`. Default from account settings (0.5%).
        overpayment_tolerance:
          $ref: '#/components/schemas/DecimalString'
          description: Fraction above which the invoice is marked `overpaid` instead of `paid`. Default 2%.
        payment_options_mode:
          type: string
          enum: [all, single]
          default: all
          description: "`all` derives an address per asset upfront; `single` defers derivation until the customer picks an asset on the hosted page (saves address gap on xpub wallets)."
        tax:
          $ref: '#/components/schemas/InvoiceTax'
          description: Tax portion of the sale (included in `amount`), kept on the invoice and its records for bookkeeping exports. Plugins fill it from the order. Checkout sessions accept it too.
        metadata: { $ref: '#/components/schemas/Metadata' }
    Customer:
      type: object
      properties:
        email: { type: string, format: email }
        name: { type: string, maxLength: 200 }
        reference: { type: string, maxLength: 128, description: Your customer id. }
    Invoice:
      type: object
      required: [id, object, livemode, status, amount, currency, payment_options, expires_at, created_at]
      properties:
        id: { type: string, example: inv_9XyZ12AbC3 }
        object: { type: string, const: invoice }
        livemode: { type: boolean }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        amount: { $ref: '#/components/schemas/DecimalString' }
        currency: { type: string, example: USD }
        pricing:
          type: string
          enum: [fiat, crypto]
          description: Whether `currency` is a fiat code or an asset id.
        accepted_assets:
          type: array
          items: { $ref: '#/components/schemas/AssetId' }
        payment_options:
          type: array
          items: { $ref: '#/components/schemas/PaymentOption' }
        paid:
          oneOf:
            - $ref: '#/components/schemas/InvoicePaidSummary'
            - type: 'null'
        order_id: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        customer: { $ref: '#/components/schemas/Customer' }
        success_url: { type: [string, 'null'], format: uri }
        cancel_url: { type: [string, 'null'], format: uri }
        hosted_url:
          type: string
          format: uri
          description: Hosted invoice page the customer can pay from.
          example: "https://pay.coinvello.com/i/inv_9XyZ12AbC3"
        refund_claim_url:
          type: [string, 'null']
          format: uri
          description: Page where a customer can submit a refund address (set when `refund_requested`, `underpaid`, `overpaid` or paid after expiry).
        rate_lock:
          $ref: '#/components/schemas/RateLockSummary'
        required_confirmations:
          type: object
          additionalProperties: { type: integer }
        underpayment_tolerance: { $ref: '#/components/schemas/DecimalString' }
        overpayment_tolerance: { $ref: '#/components/schemas/DecimalString' }
        checkout_session_id: { type: [string, 'null'] }
        tax:
          oneOf:
            - $ref: '#/components/schemas/InvoiceTax'
            - type: 'null'
          description: The tax portion of the sale as supplied at creation; copied to the invoice's records.
        fee:
          type: [object, 'null']
          description: |
            CoinVello's fee for this invoice, set once confirmed (null before confirmation; in test mode credits
            are not consumed but pay-as-you-go fees are shown). `plan` says how it is paid:
            * `prepaid` - `credits` consumed from the balance (`ledger_entry_id`)
            * `pay_as_you_go` - `amount` of `asset` (`bps` of what was received) taken on-chain by the receiver's
              next sweep; `sweep_id` is set once that sweep confirms
          properties:
            plan: { $ref: '#/components/schemas/BillingPlan' }
            credits: { type: [integer, 'null'], description: "Prepaid: clamp(round(fiat_value_usd x 30 bps / $0.01), 2, 2000). Null on pay as you go." }
            bps: { type: integer, example: 30, description: "30 (nominal) on prepaid; the receiver's `fee_bps` (40) on pay as you go." }
            fiat_value_usd: { $ref: '#/components/schemas/DecimalString' }
            ledger_entry_id: { type: [string, 'null'] }
            amount:
              oneOf:
                - $ref: '#/components/schemas/DecimalString'
                - type: 'null'
              description: "Pay as you go: the fee in `asset` units, `floor(received x bps / 10000)` at the asset's precision. The receiver computes the real split per sweep, over the whole balance, so allocations may differ from this by rounding."
            asset:
              oneOf:
                - $ref: '#/components/schemas/AssetId'
                - type: 'null'
            receiver_id: { type: [string, 'null'] }
            sweep_id: { type: [string, 'null'], description: "The sweep that collected this fee, once confirmed." }
        metadata: { $ref: '#/components/schemas/Metadata' }
        expires_at: { type: string, format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InvoicePaidSummary:
      type: object
      description: Aggregated received amounts. Present once any payment is detected.
      properties:
        asset: { type: [string, 'null'], description: Asset the customer paid with (first detected payment). }
        amount_received: { $ref: '#/components/schemas/DecimalString' }
        amount_received_fiat: { $ref: '#/components/schemas/DecimalString' }
        amount_due: { $ref: '#/components/schemas/DecimalString' }
        amount_remaining: { $ref: '#/components/schemas/DecimalString' }
        confirmations: { type: integer }
        required_confirmations: { type: integer }
        payment_ids:
          type: array
          items: { type: string }
    PaymentOption:
      type: object
      required: [asset, chain, address, amount, payment_uri, qr_payload]
      properties:
        asset: { $ref: '#/components/schemas/AssetId' }
        symbol: { type: string, example: BTC }
        chain: { $ref: '#/components/schemas/Chain' }
        network_id:
          type: [string, 'null']
          description: EVM chain id (decimal) where applicable, e.g. `"137"` for Polygon.
        wallet_id: { type: string }
        receiver_id:
          type: [string, 'null']
          description: "Set on pay as you go: `address` is then this receiver's address, which splits each payment between the wallet and CoinVello's fee address."
        address:
          type: string
          description: Merchant-owned receiving address. Derived from the xpub (BTC) or the registered address, or on pay as you go the merchant's receiver.
        derivation_path:
          type: [string, 'null']
          description: Full path of the derived address (xpub wallets only), e.g. `m/84'/0'/0'/0/17`.
        contract_address: { type: [string, 'null'], description: Token contract (ERC-20 / TRC-20 / SPL mint). }
        decimals: { type: integer }
        amount:
          $ref: '#/components/schemas/DecimalString'
          description: Exact amount in the asset's units the customer must send.
        amount_minor:
          type: string
          description: "`amount` in base units (satoshi / wei / sun / lamports) as an integer string."
        rate:
          $ref: '#/components/schemas/DecimalString'
          description: Invoice currency per 1 unit of asset at lock time.
        payment_uri:
          type: string
          description: |
            Wallet deep link:
            * BTC - BIP-21 `bitcoin:<addr>?amount=<amt>&label=...`
            * EVM native - EIP-681 `ethereum:<addr>@<chainId>?value=<wei>`
            * EVM token - EIP-681 `ethereum:<contract>@<chainId>/transfer?address=<addr>&uint256=<minor>`
            * Solana - Solana Pay `solana:<addr>?amount=<amt>&spl-token=<mint>&reference=<ref>&label=...`
            * Tron - `tron:<addr>?amount=<amt>&token=<contract>`
        qr_payload:
          type: string
          description: String to encode in a QR code. Usually equals `payment_uri`; for Tron it is the bare address because most Tron wallets do not parse URIs.
        memo:
          type: [string, 'null']
          description: Memo / reference the customer must include where the chain supports it (Solana `reference` key).
        required_confirmations: { type: integer }
        min_confirmations_for_pending: { type: integer, default: 0 }
        status:
          type: string
          enum: [available, selected, paid, unavailable]
    RateLockSummary:
      type: object
      properties:
        id: { type: [string, 'null'] }
        locked: { type: boolean }
        locked_until: { type: [string, 'null'], format: date-time }
        rates:
          type: object
          description: Asset id -> rate in invoice currency.
          additionalProperties: { $ref: '#/components/schemas/DecimalString' }

    # ------------------------------------------------------------ payments
    PaymentStatus:
      type: string
      enum: [detected, confirming, confirmed, failed]
      description: "`detected` (0 conf, in mempool) -> `confirming` (1..n-1) -> `confirmed` (>= required). `failed` when the tx was reorged out, replaced (RBF), or reverted."
    Payment:
      type: object
      required: [id, object, livemode, invoice_id, asset, chain, tx_hash, amount, status, confirmations, created_at]
      properties:
        id: { type: string, example: pay_7Hq2kLm9Rt }
        object: { type: string, const: payment }
        livemode: { type: boolean }
        invoice_id: { type: string }
        asset: { $ref: '#/components/schemas/AssetId' }
        chain: { $ref: '#/components/schemas/Chain' }
        tx_hash: { type: string }
        tx_index: { type: [integer, 'null'], description: Output index (UTXO chains) or log index (token transfers). }
        from_address: { type: [string, 'null'] }
        to_address: { type: string }
        amount: { $ref: '#/components/schemas/DecimalString' }
        amount_minor: { type: string }
        amount_fiat:
          $ref: '#/components/schemas/DecimalString'
          description: Value in the invoice currency at the invoice rate.
        status: { $ref: '#/components/schemas/PaymentStatus' }
        confirmations: { type: integer }
        required_confirmations: { type: integer }
        block_height: { type: [integer, 'null'] }
        block_hash: { type: [string, 'null'] }
        fee_paid_by_sender: { type: [string, 'null'], description: "Network fee the sender paid, in native units, if known." }
        risk:
          type: object
          description: Optional compliance screening result if enabled on the account.
          properties:
            screened: { type: boolean }
            level: { type: string, enum: [low, medium, high, severe] }
            provider: { type: string }
        simulated: { type: boolean, description: True for payments created via `/test/simulate_payment`. }
        detected_at: { type: string, format: date-time }
        confirmed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ------------------------------------------------------------ wallets
    WalletStatus:
      type: string
      enum: [active, verified, archived, unverified]
      description: |
        * `active` - usable for invoices in live and test mode (the default for new wallets)
        * `verified` - active, and ownership was additionally proven with a signed message (optional)
        * `archived` - no longer offered on new invoices; still watched for late payments
        * `unverified` - legacy value from before verification became optional; treated as `active`
    WalletCreateRequest:
      type: object
      required: [type, label]
      description: Exactly one of `chain` or `chains` is required.
      properties:
        type: { type: string, enum: [xpub, address] }
        chain: { $ref: '#/components/schemas/Chain' }
        chains:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Chain' }
          description: "`type: address` only - register the same EVM address on each listed chain (ethereum, base, arbitrum, optimism, polygon, bnb, avalanche, robinhood) as one group."
        label: { type: string, maxLength: 100 }
        xpub:
          type: string
          description: Required when `type=xpub`. Account-level extended **public** key. Accepted prefixes - `xpub`,`ypub`,`zpub` (BTC), `tpub`,`upub`,`vpub` (testnets). Output descriptors (`wpkh([fp/84h/0h/0h]xpub.../0/*)`) are also accepted.
        derivation_path:
          type: string
          pattern: "^m(/\\d+'?)*$"
          description: Account path the xpub was exported at. Default inferred from prefix and `address_type` (`m/84'/0'/0'` for zpub/p2wpkh, `m/49'/0'/0'` for ypub, `m/44'/0'/0'` for xpub/p2pkh, `m/86'/0'/0'` for p2tr).
          example: "m/84'/0'/0'"
        address_type:
          type: string
          enum: [p2pkh, p2sh-p2wpkh, p2wpkh, p2tr]
          description: Address script type to derive. Default inferred from xpub prefix.
        start_index:
          type: integer
          minimum: 0
          default: 0
          description: First external (`/0/i`) index to use, if you have already used some addresses elsewhere.
        address:
          type: string
          description: "Required when `type=address`. EVM: 0x + 40 hex, EIP-55 checksum when mixed-case; not the zero address, a burn address, a precompile or a token contract. Tron: base58check `T...`. Solana: base58 32-byte public key. Invalid input returns `422 address_invalid` with `param: address`."
        assets:
          type: array
          items: { $ref: '#/components/schemas/AssetId' }
          description: Assets accepted at this wallet. For xpub wallets this is implied (native coin). For address wallets defaults to the chain's native asset only.
        enabled: { type: boolean, default: true }
        metadata: { $ref: '#/components/schemas/Metadata' }
    Wallet:
      type: object
      required: [id, object, livemode, type, chain, label, status, assets, enabled, created_at]
      properties:
        id: { type: string, example: wal_btc_7Lm3Qp }
        object: { type: string, const: wallet }
        livemode: { type: boolean }
        type: { type: string, enum: [xpub, address] }
        chain: { $ref: '#/components/schemas/Chain' }
        label: { type: string }
        status: { $ref: '#/components/schemas/WalletStatus' }
        group_id: { type: [string, 'null'], description: "Set when the wallet was created as part of a multi-chain group (`wgr_...`)." }
        group_chains:
          type: array
          items: { $ref: '#/components/schemas/Chain' }
          description: Chains already covered by this wallet's group (just its own chain when it has no group). Present on `GET /wallets/{id}`.
        assets:
          type: array
          items: { $ref: '#/components/schemas/AssetId' }
        enabled: { type: boolean }
        xpub:
          type: [string, 'null']
          description: Redacted after creation (`zpub6rFR...tZYs`). Full key never returned.
        fingerprint: { type: [string, 'null'], description: Master key fingerprint (8 hex chars) when derivable from a descriptor. }
        derivation_path: { type: [string, 'null'] }
        address_type: { type: [string, 'null'] }
        next_index: { type: [integer, 'null'], description: Next unused external address index. }
        address: { type: [string, 'null'] }
        first_address:
          type: [string, 'null']
          description: "xpub wallets: the first address CoinVello derives (`<derivation_path>/0/<start_index>`). Compare it with your wallet's first receive address before going live; a mismatch means the path or script type is wrong. Null for address wallets."
        verification:
          type: object
          description: Optional ownership proof. Never required for live mode.
          properties:
            status:
              type: string
              enum: [not_required, pending, verified, unverified]
              description: "`not_required` (default), `pending` (challenge issued), `verified`; `unverified` is a legacy value treated like `not_required`."
            signing_address: { type: [string, 'null'] }
            verified_at: { type: [string, 'null'], format: date-time }
        stats:
          type: object
          properties:
            invoices_count: { type: integer }
            received_total:
              type: object
              additionalProperties: { $ref: '#/components/schemas/DecimalString' }
        metadata: { $ref: '#/components/schemas/Metadata' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WalletVerificationChallenge:
      type: object
      required: [id, object, wallet_id, message, signing_address, scheme, expires_at]
      properties:
        id: { type: string, example: wvc_3kd9Fj2L }
        object: { type: string, const: wallet_verification_challenge }
        wallet_id: { type: string }
        message:
          type: string
          description: Exact UTF-8 text to sign.
          example: "CoinVello wallet verification\nWallet: wal_btc_7Lm3Qp\nAddress: bc1qw508d6qejxtdg4y5r3zarvary0c5xw7kv8f3t4\nNonce: 7f3a9c1e\nExpires: 2026-10-21T10:15:00Z"
        signing_address: { type: string }
        scheme:
          type: string
          enum: [bip137, eip191, ed25519, tip191]
        expires_at: { type: string, format: date-time }
    DerivedAddress:
      type: object
      properties:
        address: { type: string }
        derivation_path: { type: string }
        index: { type: integer }
        invoice_id: { type: [string, 'null'] }
        received_total: { $ref: '#/components/schemas/DecimalString' }
        created_at: { type: string, format: date-time }

    # ------------------------------------------------------------ webhooks
    EventType:
      type: string
      enum:
        - invoice.created
        - invoice.pending
        - invoice.confirming
        - invoice.paid
        - invoice.underpaid
        - invoice.overpaid
        - invoice.expired
        - invoice.cancelled
        - invoice.refund_requested
        - payment.detected
        - payment.confirmed
        - payment.failed
        - wallet.verified
        - conversion.completed
        - conversion.failed
        - offramp.completed
        - offramp.failed
        - refund.completed
        - refund.failed
        - credits.low
        - credits.added
        - credits.purchase.paid
        - credits.purchase.underpaid
        - credits.purchase.expired
        - credits.purchase.failed
        - credits.purchase.refunded
        - credits.auto_topup.disabled
        - checkout_session.completed
        - checkout_session.expired
        - receiver.deployed
        - sweep.confirmed
        - sweep.failed
        - export.ready
        - export.failed
    WebhookCreateRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          description: HTTPS required in live mode. `http://localhost` allowed in test mode.
        description: { type: string, maxLength: 200 }
        events:
          type: array
          minItems: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/EventType'
              - type: string
                const: "*"
          description: Event types to deliver, or `["*"]` for everything.
        api_version:
          type: string
          description: Version used to render payloads. Defaults to the account version.
        enabled: { type: boolean, default: true }
        metadata: { $ref: '#/components/schemas/Metadata' }
    Webhook:
      type: object
      required: [id, object, livemode, url, events, enabled, created_at]
      properties:
        id: { type: string, example: whe_2JxK9vL3mQ }
        object: { type: string, const: webhook }
        livemode: { type: boolean }
        url: { type: string, format: uri }
        description: { type: [string, 'null'] }
        events:
          type: array
          items: { type: string }
        enabled: { type: boolean }
        secret:
          type: string
          description: "`whsec_` + 64 hex chars. Only returned on create and rotate."
        previous_secret_expires_at:
          type: [string, 'null']
          format: date-time
          description: During a rotation grace period, when the old secret stops being used.
        api_version: { type: string }
        status:
          type: string
          enum: [active, degraded, disabled]
          description: "`degraded` after 3 consecutive failures; auto-`disabled` after 72 h of failures."
        last_delivery_at: { type: [string, 'null'], format: date-time }
        metadata: { $ref: '#/components/schemas/Metadata' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WebhookDelivery:
      type: object
      properties:
        id: { type: string, example: whd_4Hn7Pq2W }
        object: { type: string, const: webhook_delivery }
        webhook_id: { type: string }
        event_id: { type: string }
        event_type: { type: string }
        attempt: { type: integer }
        status: { type: string, enum: [pending, succeeded, failed, exhausted] }
        response_status: { type: [integer, 'null'] }
        response_body_excerpt: { type: [string, 'null'], maxLength: 512 }
        error: { type: [string, 'null'] }
        duration_ms: { type: [integer, 'null'] }
        next_retry_at: { type: [string, 'null'], format: date-time }
        replayed: { type: boolean, description: "True for re-deliveries created by `POST /events/{id}/resend` or `POST /webhooks/{id}/replay`. The event id is unchanged; dedupe on it." }
        created_at: { type: string, format: date-time }

    # ------------------------------------------------------------ credits
    WatcherHealth:
      type: object
      required: [ok, enabled, stale_after_seconds, checked_at, watchers]
      properties:
        ok: { type: boolean }
        enabled: { type: boolean, description: False when chain watching is switched off on this deployment (then `ok` is true). }
        stale_after_seconds: { type: integer }
        checked_at: { type: string, format: date-time }
        watchers:
          type: array
          items:
            type: object
            properties:
              chain: { $ref: '#/components/schemas/Chain' }
              mode: { type: string, enum: [live, test] }
              last_round_at: { type: [string, 'null'], format: date-time }
              seconds_since: { type: [integer, 'null'] }
              ok: { type: boolean }
    CreditsBalance:
      type: object
      properties:
        object: { type: string, const: credits_balance }
        livemode: { type: boolean }
        balance: { type: integer, minimum: 0, description: "Credits the account holds (`available` + `reserved`). Never negative." }
        available: { type: integer, minimum: 0, description: "Credits free to spend: `balance` minus `reserved`. A new invoice paid with credits needs its estimated fee available." }
        reserved: { type: integer, minimum: 0, description: "Estimated fees of open invoices that are paid with credits. Released when the invoice is paid (the actual fee is charged instead), expires or is cancelled." }
        expiring_soon:
          type: object
          description: Purchased credits that expire within 30 days.
          properties:
            credits: { type: integer }
            before: { type: string, format: date-time }
        low_balance_threshold: { type: integer }
        estimated_payments_remaining: { type: integer, description: "available / trailing-30-day average credits per confirmed payment." }
        estimated_invoices_remaining: { type: integer, deprecated: true, description: Alias of `estimated_payments_remaining`. }
        auto_topup: { $ref: '#/components/schemas/AutoTopup' }
        updated_at: { type: string, format: date-time }
    AutoTopup:
      type: object
      properties:
        enabled: { type: boolean }
        bundle_id: { type: string }
        trigger_below: { type: integer, minimum: 0 }
        payment_method: { type: [string, 'null'], description: "Saved card (`pm_` id) to charge. Defaults to the default card." }
        monthly_limit:
          oneOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
          description: Maximum USD charged automatically per calendar month (UTC). Null means only the daily card limit applies.
        spent_this_month: { type: string, readOnly: true, description: USD charged automatically so far this month. }
        consecutive_failures: { type: integer, readOnly: true }
        last_attempt_at: { type: [string, 'null'], format: date-time, readOnly: true }
        disabled_reason:
          type: [string, 'null']
          readOnly: true
          enum: [card_declined, payment_method_removed, disputed, null]
          description: Why automatic top-up switched itself off, if it did.
    PaymentMethod:
      type: object
      required: [id, object, livemode, type, brand, last4, is_default, created_at]
      properties:
        id: { type: string, example: pm_7Qa2Kd9LmPx4Rt }
        object: { type: string, const: payment_method }
        livemode: { type: boolean }
        type: { type: string, const: card }
        brand: { type: string, example: Visa }
        last4: { type: string, pattern: '^[0-9]{4}$', example: "1111" }
        exp: { type: [string, 'null'], description: "Expiry as MM/YY when the processor reports it.", example: "12/29" }
        is_default: { type: boolean }
        status: { type: string, enum: [active, removed] }
        created_at: { type: string, format: date-time }
    CardFormConfig:
      type: object
      required: [provider, environment, application_id, location_id, script_url]
      description: Public values for Square's Web Payments SDK. None of them is secret.
      properties:
        provider: { type: string, const: square }
        environment: { type: string, enum: [sandbox, production] }
        application_id: { type: string, example: sandbox-sq0idb-xxxxxxxx }
        location_id: { type: string }
        script_url: { type: string, format: uri, example: "https://sandbox.web.squarecdn.com/v1/square.js" }
    CreditBundle:
      type: object
      properties:
        id: { type: string, example: bnd_growth_15000 }
        object: { type: string, const: credit_bundle }
        name: { type: string }
        description: { type: [string, 'null'] }
        credits: { type: integer, description: "Credits in the bundle (for `monthly` bundles - the monthly grant)." }
        bonus_credits: { type: integer }
        monthly: { type: boolean, description: "Always false: the monthly free grant was retired (accounts that do not want to prepay use pay as you go)." }
        price:
          $ref: '#/components/schemas/Money'
          description: Always USD. List price before any stablecoin discount.
        price_per_credit: { type: [string, 'null'], description: "USD per credit as a decimal string (null for free)." }
        effective_rate_bps: { type: integer, description: "Effective processing rate in basis points at the 30 bps nominal consumption rule (price_per_credit / $0.01 x 30)." }
        stablecoin_discount_bps: { type: integer, description: "Discount when paid in USDC/USDT/DAI (300 = 3%)." }
        expires_after_months: { type: [integer, 'null'], description: Purchased credits expire this many months after purchase (24). }
        contact_sales: { type: boolean, description: Enterprise - price is negotiated; `POST /credits/purchases` returns 409 for this bundle. }
        crypto_prices:
          type: array
          description: Indicative crypto equivalents for every asset the operator wallets currently accept.
          items:
            type: object
            properties:
              asset: { $ref: '#/components/schemas/AssetId' }
              amount: { $ref: '#/components/schemas/DecimalString' }
              rate: { $ref: '#/components/schemas/DecimalString', description: USD per 1 unit of asset. }
              discount_applied: { type: boolean, description: True when the stablecoin discount is included in `amount`. }
        rates_as_of: { type: string, format: date-time }
        card_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Price when paid by card (the list price), or null when this bundle cannot be bought by card in this mode.
        enabled: { type: boolean }
    CreditPurchaseCreateRequest:
      type: object
      required: [bundle_id]
      properties:
        bundle_id: { type: string, example: bnd_growth_15000 }
        pay_asset:
          type: string
          description: Asset symbol to pay with (lowercase, e.g. `usdt`). Requires `pay_chain`. Omit to get every supported option.
          example: usdt
        pay_chain:
          $ref: '#/components/schemas/Chain'
        payment_method:
          type: string
          pattern: '^pm_[A-Za-z0-9]+$'
          description: Pay with this saved card instead of crypto. Cannot be combined with `pay_asset`/`pay_chain`.
        source_id:
          type: string
          description: |
            Pay with a card just entered in the dashboard checkout: the one-time token (`cnon:...`) from Square's
            Web Payments SDK. Dashboard sessions only (`403 session_required` with an API key).
        verification_token: { type: string, description: "Buyer verification token from the SDK, when present (with `source_id`)." }
        save_card:
          type: boolean
          default: false
          description: With `source_id`, save the card after a successful charge. Needs a fresh 2FA step-up (`403 step_up_required`).
        expires_in: { type: integer, minimum: 600, maximum: 86400, default: 3600 }
        metadata: { $ref: '#/components/schemas/Metadata' }
    CreditPurchaseStatus:
      type: string
      enum: [new, pending, confirming, paid, underpaid, overpaid, expired, cancelled, failed, refunded, disputed]
      description: |
        Crypto purchases follow the invoice lifecycle. Card purchases are `paid`, `pending` (held by the
        processor for review), `failed` (declined), `refunded` (refunded or voided; credits reversed) or
        `disputed` (charged back; credits reversed).
    CreditPurchasePayment:
      type: object
      description: Invoice-shaped payment object for a credit purchase. Receiving addresses belong to CoinVello's operator wallets.
      required: [status, amount, currency, payment_options, expires_at]
      properties:
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        amount: { $ref: '#/components/schemas/DecimalString', description: USD price of the bundle. }
        currency: { type: string, const: USD }
        payment_options:
          type: array
          items: { $ref: '#/components/schemas/PaymentOption' }
        rate_locked_until: { type: string, format: date-time }
        paid:
          oneOf:
            - $ref: '#/components/schemas/InvoicePaidSummary'
            - type: 'null'
        payment_ids:
          type: array
          items: { type: string }
        expires_at: { type: string, format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
    CreditPurchase:
      type: object
      required: [id, object, livemode, status, method, bundle_id, credits, price, payment, checkout_url, created_at]
      properties:
        id: { type: string, example: cpu_6Rt8Yu3Kp }
        object: { type: string, const: credit_purchase }
        livemode: { type: boolean }
        status:
          $ref: '#/components/schemas/CreditPurchaseStatus'
          description: Credits are added at `paid` or `overpaid` (pro-rata at `underpaid`).
        method: { type: string, enum: [crypto, card] }
        card:
          type: [object, 'null']
          description: Card purchases only.
          properties:
            payment_method: { type: [string, 'null'], description: "`pm_` id that was charged; null for a card entered at checkout and not saved." }
            brand: { type: string }
            last4: { type: string }
            auto_topup: { type: boolean, description: True when automatic top-up made this charge. }
        failure:
          type: [object, 'null']
          description: Why a card purchase failed (`card_declined`, `processing_error`), with the processor's message.
          properties:
            code: { type: string }
            message: { type: string }
        bundle_id: { type: string }
        credits: { type: integer, description: "Credits that will be (or were) added, including bonus." }
        price: { $ref: '#/components/schemas/Money', description: Amount actually charged after discounts. }
        list_price: { $ref: '#/components/schemas/Money' }
        discount:
          type: [object, 'null']
          properties:
            type: { type: string, enum: [stablecoin, promo, tier_lock] }
            bps: { type: integer }
        payment:
          oneOf:
            - $ref: '#/components/schemas/CreditPurchasePayment'
            - type: 'null'
          description: Crypto payment details; null for card purchases.
        checkout_url:
          type: [string, 'null']
          format: uri
          description: Hosted purchase page (crypto only).
          example: "https://pay.coinvello.com/credits/cpu_6Rt8Yu3Kp"
        credits_added_at: { type: [string, 'null'], format: date-time }
        ledger_entry_id: { type: [string, 'null'] }
        metadata: { $ref: '#/components/schemas/Metadata' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreditLedgerReason:
      type: string
      enum: [invoice_fee, checkout_fee, conversion_fee, offramp_fee, screening_fee, overage_surcharge, purchase, purchase_reversal, free_monthly_grant, bonus, promo, adjustment, refund_of_fee, reorg_reversal, expiry]
    CreditLedgerEntry:
      type: object
      properties:
        id: { type: string, example: led_9Ks2Lm4Np }
        object: { type: string, const: credit_ledger_entry }
        livemode: { type: boolean }
        type: { type: string, enum: [debit, credit] }
        reason: { $ref: '#/components/schemas/CreditLedgerReason' }
        amount: { type: integer, description: Always positive; sign given by `type`. }
        balance_after: { type: integer }
        related_object:
          type: object
          properties:
            id: { type: string }
            object: { type: string }
        description: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    # ------------------------------------------------------------ rates
    DisplayRates:
      type: object
      required: [object, base, rates, as_of]
      properties:
        object: { type: string, const: display_rates }
        base: { type: string, enum: [USD, EUR, GBP, CAD, AUD, JPY, CHF, SGD, AED, BRL, MXN, ZAR, INR, PLN, SEK, NOK, DKK, CZK, NZD, HKD, KRW, TRY, ILS, THB, PHP, IDR, MYR, VND, NGN, ARS] }
        rates:
          type: object
          description: Currency code -> units per 1 `base`, as decimal strings. The base itself is omitted.
          additionalProperties: { $ref: '#/components/schemas/DecimalString' }
        as_of: { type: string, format: date-time }
        source: { type: string, description: "Where the rates came from (`open.er-api.com`, `frankfurter.app (ECB)`, `static`)." }
    RatesResponse:
      type: object
      properties:
        object: { type: string, const: rates }
        base: { type: string }
        rates:
          type: array
          items:
            type: object
            properties:
              asset: { $ref: '#/components/schemas/AssetId' }
              rate: { $ref: '#/components/schemas/DecimalString' }
              source: { type: string }
        as_of: { type: string, format: date-time }
    RateQuote:
      type: object
      properties:
        id: { type: string, example: rq_3Df8Gh1Jk }
        object: { type: string, const: rate_quote }
        from: { type: string }
        to: { type: string }
        from_amount: { $ref: '#/components/schemas/DecimalString' }
        to_amount: { $ref: '#/components/schemas/DecimalString' }
        rate: { $ref: '#/components/schemas/DecimalString', description: Units of `to` per 1 unit of `from`. }
        spread_bps: { type: integer, description: "Spread applied over mid-market, in basis points." }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    RateLock:
      type: object
      properties:
        id: { type: string, example: rl_7Kp2Qw9Er }
        object: { type: string, const: rate_lock }
        livemode: { type: boolean }
        quote_id: { type: string }
        from: { type: string }
        to: { type: string }
        rate: { $ref: '#/components/schemas/DecimalString' }
        status: { type: string, enum: [active, used, expired] }
        invoice_id: { type: [string, 'null'] }
        locked_until: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    # ------------------------------------------------------------ conversions
    ConversionStatus:
      type: string
      enum: [awaiting_signature, submitted, pending, completed, failed, expired, cancelled]
    ConversionQuoteRequest:
      type: object
      required: [from_asset, to_asset, amount, from_wallet_id]
      properties:
        from_asset: { $ref: '#/components/schemas/AssetId' }
        to_asset: { $ref: '#/components/schemas/AssetId' }
        amount: { $ref: '#/components/schemas/DecimalString' }
        side: { type: string, enum: [from, to], default: from }
        from_wallet_id: { type: string, description: Wallet (address type) that holds the source funds and will sign. }
        destination_address:
          type: string
          description: Where the converted asset is delivered. Defaults to the source address for same-chain swaps; required for cross-chain routes.
        slippage_bps: { type: integer, minimum: 1, maximum: 500, default: 50 }
        route_preference:
          type: string
          enum: [best_price, fastest, dex_only, partner_only]
          default: best_price
    ConversionQuote:
      type: object
      properties:
        id: { type: string, example: cq_8Hj3Kl5Mn }
        object: { type: string, const: conversion_quote }
        from_asset: { $ref: '#/components/schemas/AssetId' }
        to_asset: { $ref: '#/components/schemas/AssetId' }
        from_amount: { $ref: '#/components/schemas/DecimalString' }
        to_amount: { $ref: '#/components/schemas/DecimalString' }
        to_amount_min: { $ref: '#/components/schemas/DecimalString', description: Guaranteed minimum after slippage. }
        rate: { $ref: '#/components/schemas/DecimalString' }
        route:
          type: object
          properties:
            type: { type: string, enum: [dex, partner, bridge] }
            provider: { type: string, example: "1inch" }
            steps:
              type: array
              items:
                type: object
                properties:
                  protocol: { type: string }
                  from_asset: { type: string }
                  to_asset: { type: string }
                  share_bps: { type: integer }
        estimated_network_fee: { $ref: '#/components/schemas/Money' }
        credits_required: { type: integer }
        requires_approval:
          type: boolean
          description: True when an ERC-20 `approve` transaction must be signed first (becomes the first unsigned transaction).
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    UnsignedTransaction:
      type: object
      required: [chain, format, payload]
      properties:
        step: { type: integer, description: 1-based execution order. }
        purpose: { type: string, enum: [approve, swap, deposit, refund, bridge, sweep] }
        chain: { $ref: '#/components/schemas/Chain' }
        format:
          type: string
          enum: [eip1559, legacy, psbt_base64, solana_message_base64, tron_raw_hex]
        from: { type: string }
        payload:
          type: object
          description: |
            Chain-specific unsigned transaction.
            * `eip1559` - `{ chainId, from, to, value, data, nonce, gas, maxFeePerGas, maxPriorityFeePerGas }` (hex strings)
            * `psbt_base64` - `{ psbt }` with all inputs/outputs populated; sign with your wallet and finalize
            * `solana_message_base64` - `{ message, recent_blockhash }`
            * `tron_raw_hex` - `{ raw_data_hex, txID }`
          additionalProperties: true
        human_readable:
          type: object
          description: Plain-language summary to show the signer.
          properties:
            summary: { type: string, example: "Swap 0.5 ETH for at least 1,247.11 USDC via 1inch" }
            to_label: { type: string }
        expires_at: { type: [string, 'null'], format: date-time }
    SignedSubmission:
      type: object
      description: Provide either `signed_transactions` (CoinVello broadcasts) or `tx_hashes` (you broadcast).
      properties:
        signed_transactions:
          type: array
          items:
            type: object
            required: [step, signed]
            properties:
              step: { type: integer }
              signed: { type: string, description: "Signed raw tx - 0x-hex (EVM/Tron), base64 finalized PSBT or raw tx hex (BTC), base64 (Solana)." }
        tx_hashes:
          type: array
          items:
            type: object
            required: [step, tx_hash]
            properties:
              step: { type: integer }
              tx_hash: { type: string }
      example:
        signed_transactions:
          - step: 1
            signed: "0x02f8b1018203e8..."
    Conversion:
      type: object
      properties:
        id: { type: string, example: cnv_2Lk9Mn4Pq }
        object: { type: string, const: conversion }
        livemode: { type: boolean }
        status: { $ref: '#/components/schemas/ConversionStatus' }
        quote_id: { type: string }
        from_asset: { $ref: '#/components/schemas/AssetId' }
        to_asset: { $ref: '#/components/schemas/AssetId' }
        from_amount: { $ref: '#/components/schemas/DecimalString' }
        to_amount_expected: { $ref: '#/components/schemas/DecimalString' }
        to_amount_min: { $ref: '#/components/schemas/DecimalString' }
        to_amount_received: { type: [string, 'null'] }
        from_wallet_id: { type: string }
        destination_address: { type: string }
        route: { type: object, additionalProperties: true }
        unsigned_transactions:
          type: array
          items: { $ref: '#/components/schemas/UnsignedTransaction' }
        transactions:
          type: array
          description: Broadcast transactions and their status.
          items:
            type: object
            properties:
              step: { type: integer }
              tx_hash: { type: string }
              status: { type: string, enum: [pending, confirmed, failed] }
              confirmations: { type: integer }
        credits_charged: { type: integer }
        failure_reason: { type: [string, 'null'] }
        metadata: { $ref: '#/components/schemas/Metadata' }
        signature_deadline: { type: string, format: date-time, description: Unsigned transactions are invalid after this. }
        completed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ------------------------------------------------------------ offramp
    OfframpProvider:
      type: object
      properties:
        id: { type: string, example: kraken }
        object: { type: string, const: offramp_provider }
        name: { type: string }
        connection_modes:
          type: array
          items: { type: string, enum: [oauth, api_key] }
        supported_assets:
          type: array
          items: { $ref: '#/components/schemas/AssetId' }
        supported_fiat:
          type: array
          items: { $ref: '#/components/schemas/FiatCurrency' }
        regions: { type: array, items: { type: string } }
        settlement_time: { type: string, example: "1-2 business days (SEPA), same day (Faster Payments)" }
    OfframpAccountCreateRequest:
      type: object
      required: [provider, connection_mode]
      properties:
        provider: { type: string }
        connection_mode: { type: string, enum: [oauth, api_key] }
        label: { type: string, maxLength: 100 }
        redirect_url: { type: string, format: uri, description: OAuth - where to return the merchant after authorisation. }
        credentials:
          type: object
          description: API-key mode. Write-only; encrypted with a per-account KMS key.
          properties:
            api_key: { type: string }
            api_secret: { type: string }
            passphrase: { type: string }
        metadata: { $ref: '#/components/schemas/Metadata' }
    OfframpAccount:
      type: object
      properties:
        id: { type: string, example: ofa_5Gh7Jk9Lm }
        object: { type: string, const: offramp_account }
        livemode: { type: boolean }
        provider: { type: string }
        connection_mode: { type: string, enum: [oauth, api_key] }
        label: { type: [string, 'null'] }
        status: { type: string, enum: [pending_authorization, active, revoked, error] }
        authorize_url: { type: [string, 'null'], format: uri, description: Present while `pending_authorization` (OAuth). }
        partner_account_ref: { type: [string, 'null'], description: Masked partner account identifier. }
        destinations:
          type: array
          description: Bank destinations registered at the partner (read from the partner, never stored in full).
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string, example: "Business EUR account ****4421" }
              currency: { $ref: '#/components/schemas/FiatCurrency' }
              default: { type: boolean }
        capabilities:
          type: array
          items: { type: string, enum: [quote, payout, purchase_credits] }
        last_error: { type: [string, 'null'] }
        metadata: { $ref: '#/components/schemas/Metadata' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OfframpQuote:
      type: object
      properties:
        id: { type: string, example: oq_8Jk2Lm6Np }
        object: { type: string, const: offramp_quote }
        account_id: { type: string }
        asset: { $ref: '#/components/schemas/AssetId' }
        amount: { $ref: '#/components/schemas/DecimalString' }
        fiat_currency: { $ref: '#/components/schemas/FiatCurrency' }
        fiat_amount_gross: { $ref: '#/components/schemas/DecimalString' }
        partner_fee: { $ref: '#/components/schemas/Money' }
        fiat_amount_net: { $ref: '#/components/schemas/DecimalString' }
        rate: { $ref: '#/components/schemas/DecimalString' }
        destination_id: { type: string }
        credits_required: { type: integer }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    OfframpPayoutStatus:
      type: string
      enum: [awaiting_deposit, deposit_pending, deposit_confirmed, converting, payout_initiated, completed, failed, cancelled, expired]
    OfframpPayout:
      type: object
      properties:
        id: { type: string, example: ofp_3Mn7Pq1Rs }
        object: { type: string, const: offramp_payout }
        livemode: { type: boolean }
        status: { $ref: '#/components/schemas/OfframpPayoutStatus' }
        account_id: { type: string }
        quote_id: { type: string }
        from_wallet_id: { type: string }
        asset: { $ref: '#/components/schemas/AssetId' }
        amount: { $ref: '#/components/schemas/DecimalString' }
        fiat_currency: { $ref: '#/components/schemas/FiatCurrency' }
        fiat_amount_expected: { $ref: '#/components/schemas/DecimalString' }
        fiat_amount_paid: { type: [string, 'null'] }
        deposit_address: { type: string, description: Partner-controlled deposit address. }
        deposit_memo: { type: [string, 'null'] }
        unsigned_transaction: { $ref: '#/components/schemas/UnsignedTransaction' }
        deposit_tx_hash: { type: [string, 'null'] }
        partner_reference: { type: [string, 'null'] }
        destination:
          type: object
          properties:
            id: { type: string }
            label: { type: string }
        credits_charged: { type: integer }
        failure_reason: { type: [string, 'null'] }
        metadata: { $ref: '#/components/schemas/Metadata' }
        deposit_deadline: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ------------------------------------------------------------ checkout sessions
    CheckoutSessionStatus:
      type: string
      enum: [open, complete, expired]
    CheckoutSessionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/InvoiceCreateRequest'
        - type: object
          required: [success_url]
          properties:
            line_items:
              type: array
              items:
                type: object
                required: [name, quantity, unit_amount]
                properties:
                  name: { type: string, maxLength: 200 }
                  description: { type: string, maxLength: 500 }
                  quantity: { type: integer, minimum: 1 }
                  unit_amount: { $ref: '#/components/schemas/DecimalString' }
                  image_url: { type: string, format: uri }
            redirect_on:
              type: string
              enum: [confirming, paid]
              default: confirming
              description: When the hosted page redirects to `success_url`. Fulfil on the webhook, never on the redirect.
            locale: { type: string, example: "en", description: BCP-47; `auto` uses the browser locale. }
            branding:
              type: object
              properties:
                theme: { type: string, enum: [light, dark, auto], default: auto }
                logo_url: { type: string, format: uri }
                primary_color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
                merchant_name: { type: string, maxLength: 100 }
            collect_email: { type: boolean, default: false }
            allow_asset_change: { type: boolean, default: true }
    CheckoutSession:
      type: object
      required: [id, object, livemode, status, url, invoice_id, expires_at, created_at]
      properties:
        id: { type: string, example: cs_5TgH8kLp2Q }
        object: { type: string, const: checkout_session }
        livemode: { type: boolean }
        status: { $ref: '#/components/schemas/CheckoutSessionStatus' }
        url:
          type: string
          format: uri
          example: "https://pay.coinvello.com/c/cs_5TgH8kLp2Q"
        invoice_id: { type: string }
        invoice:
          description: Present when `expand=invoice`.
          oneOf:
            - $ref: '#/components/schemas/Invoice'
            - type: 'null'
        invoice_status: { $ref: '#/components/schemas/InvoiceStatus' }
        amount: { $ref: '#/components/schemas/DecimalString' }
        currency: { type: string }
        order_id: { type: [string, 'null'] }
        success_url: { type: string, format: uri }
        cancel_url: { type: [string, 'null'], format: uri }
        redirect_on: { type: string, enum: [confirming, paid] }
        line_items: { type: array, items: { type: object, additionalProperties: true } }
        customer: { $ref: '#/components/schemas/Customer' }
        selected_asset: { type: [string, 'null'] }
        metadata: { $ref: '#/components/schemas/Metadata' }
        expires_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    PublicCheckoutSessionStatus:
      type: string
      enum: [pending, confirming, paid, underpaid, overpaid, expired, cancelled]
      description: Payer-facing status. An invoice in `new` is reported as `pending`; `refund_requested` is reported as the terminal state it came from.
    PublicPaymentOption:
      description: "`PaymentOption` plus SDK convenience aliases. Canonical names are authoritative; aliases always carry the same value."
      allOf:
        - $ref: '#/components/schemas/PaymentOption'
        - type: object
          required: [uri, chain_id, token_contract, rate_locked_until, decimals, amount_minor, rate]
          properties:
            uri: { type: string, description: "Alias of `payment_uri`." }
            chain_id: { type: [string, 'null'], description: "Alias of `network_id` (decimal EVM chain id as a string, null for non-EVM)." }
            token_contract: { type: [string, 'null'], description: "Alias of `contract_address`." }
            rate_locked_until: { type: string, format: date-time, description: Until when `amount` is guaranteed at `rate`. }
            explorer_url: { type: [string, 'null'], format: uri, description: Block explorer link for `address` on the right network. }
            qr_svg: { type: [string, 'null'], description: "Inline SVG QR code of `qr_payload`, for clients that cannot encode QR codes themselves (server-rendered pages). Null when rendering failed." }
    PublicPaymentRecord:
      type: object
      required: [id, chain, asset, tx_hash, amount, amount_minor, status, confirmations, required_confirmations, explorer_url, detected_at]
      properties:
        id: { type: string }
        chain: { $ref: '#/components/schemas/Chain' }
        asset: { $ref: '#/components/schemas/AssetId' }
        symbol: { type: string }
        tx_hash: { type: string }
        amount: { $ref: '#/components/schemas/DecimalString' }
        amount_minor: { type: string }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        confirmations: { type: integer }
        required_confirmations: { type: integer }
        explorer_url: { type: [string, 'null'], format: uri }
        detected_at: { type: string, format: date-time }
        confirmed_at: { type: [string, 'null'], format: date-time }
    AddressManifest:
      type: object
      description: |
        Merchant-signed attestation that the receiving addresses belong to the merchant. The
        merchant signs the canonical sorted JSON of `{merchant_id, issued_at, addresses}` with an
        ed25519 key that never leaves their browser/HSM; CoinVello stores the signature and
        publishes the verification key out of band (`pubkey_id` selects it). The hosted page
        re-verifies with WebCrypto and only labels an address "verified" when it matches.
      required: [alg, pubkey_id, signature, merchant_id, issued_at, addresses]
      properties:
        alg: { type: string, const: ed25519 }
        pubkey_id: { type: string, description: Identifier of the merchant verification key published by CoinVello. }
        signature: { type: string, description: Hex ed25519 signature over the canonical JSON. }
        merchant_id: { type: string }
        issued_at: { type: string, format: date-time }
        addresses:
          type: object
          description: "`<asset>:<chain>` -> address, exactly as signed."
          additionalProperties: { type: string }
        wallet_ids:
          type: object
          description: "`<asset>:<chain>` -> wallet id the address came from (informational, not signed)."
          additionalProperties: { type: string }
    PublicCheckoutSession:
      type: object
      required: [id, object, purpose, merchant, amount, currency, status, expires_at, payment_options, payments, paid, success_url, cancel_url]
      properties:
        id: { type: string, description: "`cs_...` for merchant checkouts, `cpu_...` for credit purchases." }
        object: { type: string, const: checkout_session.public }
        livemode: { type: boolean, description: "`false` for a test-mode session: payment options are on testnets (Sepolia, Nile, Solana devnet, ...)." }
        purpose:
          type: string
          enum: [payment, credits]
          description: "`payment` - a merchant sale (default). `credits` - a merchant buying CoinVello credits; `merchant` then describes CoinVello."
        merchant:
          type: object
          required: [name]
          properties:
            name: { type: string }
            logo_url: { type: [string, 'null'], format: uri }
        amount: { $ref: '#/components/schemas/DecimalString' }
        currency: { type: string, description: Fiat ISO 4217 code or asset id. }
        description: { type: [string, 'null'], description: "One line shown under the merchant name (`Order #10042`, `5,000 credits`)." }
        status: { $ref: '#/components/schemas/PublicCheckoutSessionStatus' }
        expires_at: { type: string, format: date-time }
        payment_options:
          type: array
          items: { $ref: '#/components/schemas/PublicPaymentOption' }
        paid:
          oneOf:
            - $ref: '#/components/schemas/InvoicePaidSummary'
            - type: 'null'
        payments:
          type: array
          items: { $ref: '#/components/schemas/PublicPaymentRecord' }
        success_url: { type: [string, 'null'], format: uri }
        cancel_url: { type: [string, 'null'], format: uri }
        redirect_on: { type: string, enum: [confirming, paid] }
        address_manifest:
          oneOf:
            - $ref: '#/components/schemas/AddressManifest'
            - type: 'null'
        balance_delta:
          type: [string, 'null']
          description: "Shortfall (negative) or excess (positive) in `currency` when `underpaid`/`overpaid`; null otherwise."
        display_rates:
          description: "Fiat display rates with `base` = the session's fiat currency, for showing the price in the payer's currency (indicative). Omitted when the invoice is priced in crypto."
          oneOf:
            - $ref: '#/components/schemas/DisplayRates'
            - type: 'null'
        locale_hints:
          description: Merchant defaults for the payer UI (from `PATCH /account`); null when the merchant set none.
          type: [object, 'null']
          properties:
            merchant_locale: { type: [string, 'null'], description: "BCP-47 tag to pre-select, e.g. `de-CH`." }
            suggested_currency: { type: [string, 'null'], description: "Display currency to pre-select." }
        branding:
          type: object
          properties:
            theme: { type: string, enum: [light, dark, auto] }
            primary_color: { type: [string, 'null'] }
        locale: { type: [string, 'null'] }
        updated_at: { type: string, format: date-time }

    # ------------------------------------------------------------ refunds
    RefundStatus:
      type: string
      enum: [requested, awaiting_destination, awaiting_signature, submitted, processing, completed, failed, cancelled]
    RefundCreateRequest:
      type: object
      properties:
        invoice_id: { type: string, description: Refund the invoice's payments. Either this or `payment_id` is required. }
        payment_id: { type: string, description: Refund a specific payment. }
        amount:
          $ref: '#/components/schemas/DecimalString'
          description: Amount in the paid asset. Defaults to the full received amount minus network fee (`deduct_network_fee`).
        destination_address:
          type: string
          description: Customer's address on the same chain. Omit to ask the customer via `refund_claim_url`.
        deduct_network_fee: { type: boolean, default: true, description: Subtract the network fee from the refund rather than paying it from change. }
        reason:
          type: string
          enum: [requested_by_customer, duplicate, overpayment, underpayment, late_payment, cancelled_order, fraudulent, other]
        note: { type: string, maxLength: 500 }
        metadata: { $ref: '#/components/schemas/Metadata' }
    Refund:
      type: object
      properties:
        id: { type: string, example: rf_6Pq3Rs8Tu }
        object: { type: string, const: refund }
        livemode: { type: boolean }
        status: { $ref: '#/components/schemas/RefundStatus' }
        invoice_id: { type: string }
        payment_id: { type: [string, 'null'] }
        wallet_id: { type: string, description: Merchant wallet that must sign. }
        asset: { $ref: '#/components/schemas/AssetId' }
        chain: { $ref: '#/components/schemas/Chain' }
        amount: { $ref: '#/components/schemas/DecimalString' }
        network_fee_estimate: { type: [string, 'null'] }
        destination_address: { type: [string, 'null'] }
        refund_claim_url: { type: [string, 'null'], format: uri }
        unsigned_transaction:
          oneOf:
            - $ref: '#/components/schemas/UnsignedTransaction'
            - type: 'null'
        tx_hash: { type: [string, 'null'] }
        confirmations: { type: integer }
        reason: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        failure_reason: { type: [string, 'null'] }
        credits_charged: { type: integer }
        metadata: { $ref: '#/components/schemas/Metadata' }
        signature_deadline: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ------------------------------------------------------------ records (bookkeeping, tax)
    RecordType:
      type: string
      enum: [payment_received, payment_reversed, refund_sent, fee_prepaid, fee_onchain, credit_purchase, credit_adjustment, conversion, offramp_payout]
      description: |
        * `payment_received` - a payment reached `confirmed` (invoice `paid`, `overpaid` or `underpaid`); `received` is the crypto
        * `payment_reversed` - a confirmed payment later failed (reorg, replacement); negates the record in `reverses_record_id`
        * `refund_sent` - a refund you signed completed; `sent` is the crypto, `fee` the network fee
        * `fee_prepaid` - credits consumed (invoice, checkout, conversion, off-ramp or screening fee, overage surcharge); `credits` set, `value` nominal
        * `fee_onchain` - a pay-as-you-go sweep confirmed; `sent` is CoinVello's fee share, `related.invoice_ids` the invoices it covered
        * `credit_purchase` - credits bought; `sent` is the crypto paid, or a fiat leg for a card
        * `credit_adjustment` - any other credit-ledger movement (bonus, promo, free grant, adjustment, reversal, expiry); `non_cash` unless a purchase reversal
        * `conversion` - a conversion completed; `sent` and `received` are the two legs
        * `offramp_payout` - an off-ramp payout completed; `sent` the crypto, `received` the fiat (`asset` is the ISO code)
    RecordLeg:
      type: object
      required: [asset, amount]
      properties:
        asset:
          type: string
          description: "Asset id (`usdc:polygon`), or an ISO 4217 code for a fiat leg (off-ramp payouts, card purchases)."
          example: "usdc:polygon"
        amount: { $ref: '#/components/schemas/DecimalString' }
        amount_minor: { type: [string, 'null'], description: Base units as an integer string; null for fiat legs. }
    RecordValue:
      type: object
      required: [currency, amount]
      description: A fiat valuation with the rate that produced it and where the rate came from, so every number can be reproduced.
      properties:
        currency: { $ref: '#/components/schemas/FiatCurrency' }
        amount: { $ref: '#/components/schemas/DecimalString' }
        rate:
          oneOf: [{ $ref: '#/components/schemas/DecimalString' }, { type: 'null' }]
          description: "`currency` per 1 unit of the valued leg's asset."
        rate_as_of: { type: [string, 'null'], format: date-time, description: When the rate was observed (block time for market values; lock time for contract values). }
        source:
          type: object
          properties:
            provider:
              type: string
              enum: [coinvello_oracle, invoice_rate_lock, credits_nominal, card_processor, offramp_partner, ecb_reference]
              description: "`coinvello_oracle` median of venues at `rate_as_of`; `invoice_rate_lock` the invoice's locked rate; `credits_nominal` $0.01 per credit; `card_processor` the card charge; `offramp_partner` the fiat the partner paid; `ecb_reference` ECB daily reference rate (fiat cross)."
            method: { type: [string, 'null'], example: median }
            venues: { type: array, items: { type: string }, example: [coinbase, kraken, binance] }
            snapshot_id: { type: [string, 'null'] }
    InvoiceTax:
      type: object
      required: [amount]
      description: The tax portion of a sale, as you computed it. In the invoice currency and included in `amount`; `jurisdiction` is a region code you choose (`DE`, `US-CA`, `GB`), never anything about the payer.
      properties:
        amount: { $ref: '#/components/schemas/DecimalString' }
        rate:
          oneOf: [{ $ref: '#/components/schemas/DecimalString' }, { type: 'null' }]
          description: Fraction, e.g. `"0.19"` for 19%.
        label: { type: [string, 'null'], maxLength: 60, example: "VAT 19%" }
        jurisdiction: { type: [string, 'null'], maxLength: 20, example: DE }
    RecordInvoiceSnapshot:
      type: object
      description: The invoice as it was when the record was written, so exports read without joins. No customer email or name is copied.
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        order_id: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        amount: { $ref: '#/components/schemas/DecimalString' }
        currency: { type: string }
        pricing: { type: string, enum: [fiat, crypto] }
        checkout_session_id: { type: [string, 'null'] }
        customer_reference: { type: [string, 'null'], description: "The invoice's `customer.reference` (your customer id)." }
    AccountingRecord:
      type: object
      required: [id, object, livemode, type, occurred_at, recorded_at, value, value_usd, flags, simulated]
      properties:
        id: { type: string, example: rec_3Kp9Qw2Xz7 }
        object: { type: string, const: record }
        livemode: { type: boolean }
        type: { $ref: '#/components/schemas/RecordType' }
        occurred_at: { type: string, format: date-time, description: Block time of the transaction (ledger time for credit movements). Reports and exports bucket by this. }
        recorded_at: { type: string, format: date-time, description: When CoinVello wrote the record. }
        description: { type: string }
        received:
          oneOf: [{ $ref: '#/components/schemas/RecordLeg' }, { type: 'null' }]
        sent:
          oneOf: [{ $ref: '#/components/schemas/RecordLeg' }, { type: 'null' }]
        fee:
          oneOf: [{ $ref: '#/components/schemas/RecordLeg' }, { type: 'null' }]
          description: Network fee you paid, if any (refunds, conversions, sweeps you triggered).
        chain:
          oneOf: [{ $ref: '#/components/schemas/Chain' }, { type: 'null' }]
        tx_hash: { type: [string, 'null'] }
        tx_index: { type: [integer, 'null'] }
        block_height: { type: [integer, 'null'] }
        from_address: { type: [string, 'null'] }
        to_address: { type: [string, 'null'] }
        derivation_path: { type: [string, 'null'] }
        explorer_url: { type: [string, 'null'], format: uri }
        contract_value:
          oneOf: [{ $ref: '#/components/schemas/RecordValue' }, { type: 'null' }]
          description: What the customer owed in the invoice currency at the locked rate (`payment.amount_fiat`), or a bundle's price. Null when no fiat amount was agreed.
        value:
          $ref: '#/components/schemas/RecordValue'
          description: Market value at `occurred_at` in the reporting currency (the account's `records.reporting_currency`, or `?currency=`).
        value_usd: { $ref: '#/components/schemas/DecimalString', description: "`value` in USD, so every export shares one column whatever the reporting currency." }
        tax:
          oneOf: [{ $ref: '#/components/schemas/InvoiceTax' }, { type: 'null' }]
        credits: { type: [integer, 'null'], description: "Credits moved, on `fee_prepaid`, `credit_purchase` and `credit_adjustment`." }
        invoice:
          oneOf: [{ $ref: '#/components/schemas/RecordInvoiceSnapshot' }, { type: 'null' }]
        related:
          type: object
          description: Ids of the objects behind the record (`payment_id`, `refund_id`, `sweep_id`, `invoice_ids`, `credit_purchase_id`, `ledger_entry_id`, `conversion_id`, `offramp_payout_id`, `event_id`).
          additionalProperties: true
        reverses_record_id: { type: [string, 'null'] }
        flags:
          type: array
          items: { type: string, enum: [overpaid, underpaid, late, reversal, non_cash, simulated, backfilled] }
          description: "`late` - paid after `expires_at`; `backfilled` - created from data that predates records (valued at the invoice's locked rate)."
        simulated: { type: boolean }
        metadata: { $ref: '#/components/schemas/Metadata' }
    RecordsTotals:
      type: object
      description: Definitions in docs/10-records-and-tax.md §5. Amounts in the summary's `currency`.
      properties:
        payments_count: { type: integer }
        invoices_paid: { type: integer }
        refunds_count: { type: integer }
        sales: { $ref: '#/components/schemas/DecimalString', description: "Sum of `contract_value` of payments received minus reversals (crypto-priced invoices contribute `value`)." }
        tax_collected: { $ref: '#/components/schemas/DecimalString' }
        received_market_value: { $ref: '#/components/schemas/DecimalString', description: "Sum of `value` of payments received minus reversals." }
        valuation_difference: { $ref: '#/components/schemas/DecimalString', description: "`received_market_value - sales`." }
        refunds: { $ref: '#/components/schemas/DecimalString' }
        fees_prepaid: { $ref: '#/components/schemas/DecimalString' }
        credits_consumed: { type: integer }
        fees_onchain: { $ref: '#/components/schemas/DecimalString' }
        network_fees: { $ref: '#/components/schemas/DecimalString' }
        credit_purchases: { $ref: '#/components/schemas/DecimalString' }
        net_received: { $ref: '#/components/schemas/DecimalString', description: "`received_market_value - refunds - fees_onchain - network_fees`." }
    RecordsSummary:
      allOf:
        - $ref: '#/components/schemas/RecordsTotals'
        - type: object
          required: [object, livemode, period, currency, timezone]
          properties:
            object: { type: string, const: records_summary }
            livemode: { type: boolean }
            period:
              type: object
              properties:
                start: { type: string, format: date-time }
                end: { type: string, format: date-time }
            currency: { $ref: '#/components/schemas/FiatCurrency' }
            timezone: { type: string, example: Europe/Berlin }
            group_by: { type: [string, 'null'], enum: [month, asset, chain, type, address, null] }
            groups:
              type: array
              description: One entry per group when `group_by` is set, with the same totals.
              items:
                allOf:
                  - $ref: '#/components/schemas/RecordsTotals'
                  - type: object
                    properties:
                      key: { type: string, description: "`2026-03`, an asset id, a chain, a record type or an address." }
    ExportDataset:
      type: string
      enum: [records, invoices, payments, refunds, sweeps, credit_ledger, credit_purchases, conversions, offramp_payouts, all]
      description: "`all` is the year-end package: every dataset plus a summary and a read-me (one workbook for `xlsx`, a zip for `csv` and `json`)."
    ExportFormat:
      type: string
      enum: [csv, xlsx, json]
      description: "CSV is RFC 4180, UTF-8 with BOM. XLSX keeps fiat values numeric and crypto amounts, hashes and ids as text. JSON is the API objects. docs/10-records-and-tax.md §4.2."
    ExportPreset:
      type: string
      enum: [generic, journal, quickbooks, xero, koinly, cointracker, coinledger]
      description: "Column layout for the `records` dataset: `generic` (every field), `journal` (double-entry rows), bank-feed CSVs for `quickbooks` and `xero`, and the universal import templates of `koinly`, `cointracker` and `coinledger`. Vendor presets are CSV only."
    ExportStatus:
      type: string
      enum: [queued, processing, ready, failed, expired]
    ExportPeriod:
      type: object
      required: [start, end]
      description: "`start` inclusive, `end` exclusive, interpreted in the export's timezone. A date (`2026-01-01`) or a date-time."
      properties:
        start: { type: string, example: "2026-01-01" }
        end: { type: string, example: "2027-01-01" }
    ExportCreateRequest:
      type: object
      required: [format]
      properties:
        dataset: { $ref: '#/components/schemas/ExportDataset', default: records }
        format: { $ref: '#/components/schemas/ExportFormat' }
        preset: { $ref: '#/components/schemas/ExportPreset', default: generic }
        period:
          oneOf: [{ $ref: '#/components/schemas/ExportPeriod' }, { type: 'null' }]
          description: Omit or pass `null` for the entire history.
        timezone: { type: string, description: IANA zone. Default - the account's `records.timezone`. }
        currency: { $ref: '#/components/schemas/FiatCurrency', description: Reporting currency for the value columns. Default - the account's `records.reporting_currency`. }
        include_simulated: { type: boolean, default: false, description: Test mode only - include rows from `/test/simulate_*`. }
        metadata: { $ref: '#/components/schemas/Metadata' }
    Export:
      type: object
      required: [id, object, livemode, status, dataset, format, preset, period, timezone, currency, created_at]
      properties:
        id: { type: string, example: exp_5Mn8Qr2Tv4 }
        object: { type: string, const: export }
        livemode: { type: boolean }
        status: { $ref: '#/components/schemas/ExportStatus' }
        dataset: { $ref: '#/components/schemas/ExportDataset' }
        format: { $ref: '#/components/schemas/ExportFormat' }
        preset: { $ref: '#/components/schemas/ExportPreset' }
        period:
          oneOf: [{ $ref: '#/components/schemas/ExportPeriod' }, { type: 'null' }]
          description: Null means the entire history.
        timezone: { type: string }
        currency: { $ref: '#/components/schemas/FiatCurrency' }
        include_simulated: { type: boolean }
        rows: { type: [integer, 'null'], description: "Rows written (records or objects), once known." }
        file:
          type: [object, 'null']
          description: Set when `ready`.
          properties:
            name: { type: string, example: coinvello_records_live_2026-07-01_2026-10-01.xlsx }
            content_type: { type: string, example: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet }
            bytes: { type: integer }
            sha256: { type: string }
        download_url: { type: [string, 'null'], format: uri, description: "Signed URL, valid until `download_expires_at`." }
        download_expires_at: { type: [string, 'null'], format: date-time }
        failure_reason: { type: [string, 'null'] }
        metadata: { $ref: '#/components/schemas/Metadata' }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    RecordsSettings:
      type: object
      description: How records are valued and bucketed for this account. Stored values never change; a new reporting currency re-values from `value_usd` at the historical rate.
      properties:
        reporting_currency: { $ref: '#/components/schemas/FiatCurrency', default: USD }
        fiscal_year_start: { type: string, pattern: '^(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$', default: "01-01", description: "`MM-DD` of the first day of the fiscal year." }
        timezone: { type: string, default: UTC, description: "IANA zone used to bucket `occurred_at` into days, months and fiscal years." }

    # ------------------------------------------------------------ events
    Event:
      type: object
      required: [id, object, type, livemode, api_version, created_at, data]
      properties:
        id: { type: string, example: evt_1Nz7Qw3Er9 }
        object: { type: string, const: event }
        type: { $ref: '#/components/schemas/EventType' }
        livemode: { type: boolean }
        api_version: { type: string, example: "2026-10-01" }
        created_at: { type: string, format: date-time }
        data:
          type: object
          required: [object]
          properties:
            object:
              description: The resource in its state at the time of the event.
              type: object
              additionalProperties: true
            previous_attributes:
              type: object
              description: For state changes - the attributes that changed and their old values.
              additionalProperties: true
        request:
          type: object
          description: The API request that triggered this event, if any.
          properties:
            id: { type: [string, 'null'] }
            idempotency_key: { type: [string, 'null'] }
        pending_webhooks: { type: integer }
    EventInvoice:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            type:
              type: string
              enum: [invoice.created, invoice.pending, invoice.confirming, invoice.paid, invoice.underpaid, invoice.overpaid, invoice.expired, invoice.cancelled, invoice.refund_requested]
            data:
              type: object
              properties:
                object: { $ref: '#/components/schemas/Invoice' }
                previous_attributes: { type: object, additionalProperties: true }
              additionalProperties: true
    EventPayment:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            type: { type: string, enum: [payment.detected, payment.confirmed, payment.failed] }
            data:
              type: object
              properties:
                object: { $ref: '#/components/schemas/Payment' }
                invoice_status: { $ref: '#/components/schemas/InvoiceStatus' }
                previous_attributes: { type: object, additionalProperties: true }
              additionalProperties: true
    EventConversion:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            type: { type: string, enum: [conversion.completed, conversion.failed] }
            data:
              type: object
              properties:
                object: { $ref: '#/components/schemas/Conversion' }
                previous_attributes: { type: object, additionalProperties: true }
              additionalProperties: true
    EventOfframpPayout:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            type: { type: string, enum: [offramp.completed, offramp.failed] }
            data:
              type: object
              properties:
                object: { $ref: '#/components/schemas/OfframpPayout' }
                previous_attributes: { type: object, additionalProperties: true }
              additionalProperties: true
    EventRefund:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            type: { type: string, enum: [refund.completed, refund.failed] }
            data:
              type: object
              properties:
                object: { $ref: '#/components/schemas/Refund' }
                previous_attributes: { type: object, additionalProperties: true }
              additionalProperties: true
    EventCreditsBalance:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            type: { type: string, enum: [credits.low] }
            data:
              type: object
              properties:
                object: { $ref: '#/components/schemas/CreditsBalance' }
                previous_attributes: { type: object, additionalProperties: true }
              additionalProperties: true
    EventCreditPurchase:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            type: { type: string, enum: [credits.purchase.paid, credits.purchase.underpaid, credits.purchase.expired, credits.purchase.failed, credits.purchase.refunded] }
            data:
              type: object
              properties:
                object: { $ref: '#/components/schemas/CreditPurchase' }
                previous_attributes: { type: object, additionalProperties: true }
              additionalProperties: true
    EventCreditsAdded:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            type: { type: string, enum: [credits.added] }
            data:
              type: object
              properties:
                object: { $ref: '#/components/schemas/CreditLedgerEntry' }
                balance: { $ref: '#/components/schemas/CreditsBalance' }
                previous_attributes: { type: object, additionalProperties: true }
              additionalProperties: true
    EventWallet:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            type: { type: string, enum: [wallet.verified] }
            data:
              type: object
              properties:
                object: { $ref: '#/components/schemas/Wallet' }
                previous_attributes: { type: object, additionalProperties: true }
              additionalProperties: true
    EventCheckoutSession:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            type: { type: string, enum: [checkout_session.completed, checkout_session.expired] }
            data:
              type: object
              properties:
                object: { $ref: '#/components/schemas/CheckoutSession' }
                previous_attributes: { type: object, additionalProperties: true }
              additionalProperties: true

    EventReceiver:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            type: { type: string, enum: [receiver.deployed] }
            data:
              type: object
              properties:
                object: { $ref: '#/components/schemas/Receiver' }
                previous_attributes: { type: object, additionalProperties: true }
              additionalProperties: true
    EventSweep:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            type: { type: string, enum: [sweep.confirmed, sweep.failed] }
            data:
              type: object
              properties:
                object: { $ref: '#/components/schemas/Sweep' }
                previous_attributes: { type: object, additionalProperties: true }
              additionalProperties: true
    EventExport:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            type: { type: string, enum: [export.ready, export.failed] }
            data:
              type: object
              properties:
                object: { $ref: '#/components/schemas/Export' }
                previous_attributes: { type: object, additionalProperties: true }
              additionalProperties: true
    # ------------------------------------------------------------ pay as you go
    BillingPlan:
      type: string
      enum: [prepaid, pay_as_you_go]
      description: "`prepaid` - fees are paid from processing credits. `pay_as_you_go` - on supported chains CoinVello takes `fee_bps` of each payment on-chain through the merchant's receiver; other chains keep using credits."
    PayAsYouGoSettings:
      type: object
      description: Read-only pay-as-you-go terms and per-chain availability.
      properties:
        available: { type: boolean, description: "Whether the account may switch to `pay_as_you_go` (true for every account at the moment)." }
        fee_bps: { type: integer, example: 40, description: "CoinVello's share of each payment in basis points, fixed in each receiver when it is created. A change applies only to receivers created after 30 days' notice." }
        chains:
          type: array
          items:
            type: object
            properties:
              chain: { $ref: '#/components/schemas/Chain' }
              status:
                type: string
                enum: [enabled, sweep_only, disabled, not_supported]
                description: |
                  * `enabled` - new invoices on this chain pay to receivers
                  * `sweep_only` - paused (network fees too high relative to fees); new invoices use credits, existing receivers are still swept
                  * `disabled` - not offered on this chain yet
                  * `not_supported` - the chain has no receiver contract (Bitcoin); always credits
    ReceiverStatus:
      type: string
      enum: [active, sweep_only, retired]
      description: |
        * `active` - new invoices on the wallet's chain pay here
        * `sweep_only` - no new invoices (plan switched back, chain paused, wallet archived); still swept
        * `retired` - superseded by a receiver with a newer contract version or fee; still swept while it holds funds
    Receiver:
      type: object
      required: [id, object, livemode, chain, wallet_id, address, wallet_address, fee_bps, deployed, status, created_at]
      properties:
        id: { type: string, example: rcv_base_4Fk9Lq2M }
        object: { type: string, const: receiver }
        livemode: { type: boolean }
        chain: { $ref: '#/components/schemas/Chain' }
        wallet_id: { type: string, description: The wallet whose address receives the merchant's share. }
        address:
          type: string
          description: |
            Where payers send funds. Known before anything is deployed:
            * EVM - CREATE2 address of `CoinVelloReceiver` from the factory; the same on every EVM chain for the same wallet address and fee
            * Tron - CREATE2 address from the Tron factory
            * Solana - the vault PDA `["receiver", wallet_address, fee_bps]` of the receiver program (tokens go to its associated token accounts)
        wallet_address: { type: string, description: The merchant's wallet address; receives `(10000 - fee_bps) / 10000` of every sweep. }
        fee_bps: { type: integer, example: 40, description: Fixed in the receiver; nobody can change it. }
        fee_recipient: { type: string, description: "CoinVello's fee address (a multisig) on this chain." }
        fee_recipient_backup: { type: string, description: "Receives the fee when the primary cannot (for example an issuer froze it); if neither can, the merchant is paid in full." }
        contract:
          type: object
          description: The on-chain code behind the receiver.
          properties:
            kind: { type: string, enum: [evm_factory, tron_factory, solana_program] }
            address: { type: string, description: "Factory address (EVM, Tron) or program id (Solana)." }
            version: { type: string, example: v1 }
        deployed: { type: boolean, description: "EVM and Tron receivers are deployed inside their first sweep; Solana vaults need no deployment (always true). Payments are safe either way." }
        deployed_at: { type: [string, 'null'], format: date-time }
        status: { $ref: '#/components/schemas/ReceiverStatus' }
        unswept:
          type: array
          description: Confirmed balances waiting for the next sweep, per asset, with the share each side will get.
          items:
            type: object
            properties:
              asset: { $ref: '#/components/schemas/AssetId' }
              amount: { $ref: '#/components/schemas/DecimalString' }
              to_wallet: { $ref: '#/components/schemas/DecimalString' }
              fee: { $ref: '#/components/schemas/DecimalString' }
        next_sweep:
          type: object
          description: When CoinVello's sweeper expects to sweep (it only sweeps when the fee covers the network fee several times over).
          properties:
            status: { type: string, enum: [nothing_to_sweep, waiting_for_balance, scheduled, gas_too_high] }
            estimated_at: { type: [string, 'null'], format: date-time }
            balance_needed_usd: { oneOf: [{ $ref: '#/components/schemas/DecimalString' }, { type: 'null' }], description: "Approximate balance at which the next sweep pays for itself at current network fees." }
        last_swept_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SweepStatus:
      type: string
      enum: [pending, confirmed, failed]
      description: "`pending` - broadcast, waiting for confirmations; `confirmed` - final; `failed` - reverted or dropped (nothing moved)."
    Sweep:
      type: object
      required: [id, object, livemode, receiver_id, chain, asset, amount, to_wallet, fee, fee_destination, status, initiated_by, created_at]
      properties:
        id: { type: string, example: swp_8Jd3Kq7Ws2 }
        object: { type: string, const: sweep }
        livemode: { type: boolean }
        receiver_id: { type: string }
        chain: { $ref: '#/components/schemas/Chain' }
        asset: { $ref: '#/components/schemas/AssetId' }
        amount: { $ref: '#/components/schemas/DecimalString', description: The receiver's whole balance of `asset` that was swept. }
        to_wallet: { $ref: '#/components/schemas/DecimalString', description: "Sent to the merchant's wallet (`amount - fee`)." }
        fee: { $ref: '#/components/schemas/DecimalString', description: "CoinVello's share, `floor(amount x fee_bps / 10000)`; 0 when forfeited." }
        fee_destination:
          type: string
          enum: [primary, backup, forfeited]
          description: "Where the fee went. `forfeited` - neither fee address could take it, so the merchant was paid in full."
        initiated_by:
          type: string
          enum: [coinvello, merchant, third_party]
          description: "Who triggered the sweep: CoinVello's sweeper, the merchant (`sweep_transaction`, or a sweep signed by the wallet address), or anyone else."
        network_fee:
          type: object
          description: What the sweep cost on-chain, paid by whoever triggered it (CoinVello for its own sweeps).
          properties:
            amount: { $ref: '#/components/schemas/DecimalString' }
            asset: { $ref: '#/components/schemas/AssetId' }
        includes_deployment: { type: boolean, description: "True when this sweep also deployed the receiver (EVM, Tron)." }
        tx_hash: { type: [string, 'null'] }
        block_height: { type: [integer, 'null'] }
        invoice_ids:
          type: array
          items: { type: string }
          description: Paid invoices whose fees this sweep collected.
        status: { $ref: '#/components/schemas/SweepStatus' }
        failure_reason: { type: [string, 'null'] }
        simulated: { type: boolean, description: True for sweeps created via `/test/simulate_sweep`. }
        created_at: { type: string, format: date-time }
        confirmed_at: { type: [string, 'null'], format: date-time }
    # ------------------------------------------------------------ account & auth
    MfaMethod:
      type: string
      enum: [totp, email, webauthn, recovery_code]
    SessionResponse:
      type: object
      required: [object, id, account_id, expires_at]
      properties:
        object: { type: string, const: session }
        id: { type: string, example: ses_7Kd2Lm9Qp }
        account_id: { type: string, description: "`mer_` for merchants, `stf_` for staff." }
        mfa_verified: { type: boolean, description: Whether this session completed 2FA (or came from a trusted device). }
        step_up_valid_until:
          type: [string, 'null']
          format: date-time
          description: Until when sensitive actions are allowed without a new code (5 minutes after a step-up verify).
        expires_at: { type: string, format: date-time }
        csrf_token:
          type: string
          description: Send as `X-CSRF-Token` on every mutating request made with the session cookie.
    TeamMember:
      type: object
      properties:
        id: { type: string, examples: [mbr_7Hq2kLp9Xc] }
        object: { type: string, const: team_member }
        email: { type: string }
        role: { type: string, enum: [admin, developer, viewer] }
        status: { type: string, enum: [invited, active, disabled] }
        email_verified: { type: boolean }
        invited_by: { type: [string, 'null'] }
        last_login_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    SupportTicketStatus:
      type: string
      enum: [open, waiting_on_customer, resolved]
      description: "`open` = waiting on CoinVello; `waiting_on_customer` = an agent asked something; `resolved` = done (a customer reply reopens it). A ticket left `waiting_on_customer` with no activity for 48 hours is resolved automatically, and the customer is emailed."
    SupportTicketCategory:
      type: string
      enum: [account_access, payments, billing, wallets, integrations, other]
      default: other
    SupportInvoiceIds:
      type: array
      maxItems: 20
      uniqueItems: true
      items: { type: string, pattern: '^inv_[A-Za-z0-9]{4,40}$' }
    SupportCaptcha:
      type: object
      properties:
        object: { type: string, const: support_captcha }
        algorithm: { type: string, const: SHA-256 }
        challenge: { type: string, description: Hex SHA-256 of salt + the secret number. }
        salt: { type: string, examples: ["9f2c4e1a7b3d5f60a1b2c3d4?expires=1793812345"] }
        signature: { type: string, description: HMAC of the challenge; send it back unchanged. }
        maxnumber: { type: integer, examples: [100000] }
        expires_at: { type: string, format: date-time }
    SupportCaptchaSolution:
      type: object
      required: [algorithm, challenge, salt, signature, number]
      properties:
        algorithm: { type: string, const: SHA-256 }
        challenge: { type: string, maxLength: 128 }
        salt: { type: string, maxLength: 128 }
        signature: { type: string, maxLength: 128 }
        number: { type: integer, minimum: 0 }
    SupportMessage:
      type: object
      properties:
        id: { type: string, examples: [tkm_4Rf8Nq2Wx7Lm] }
        object: { type: string, const: support_message }
        author:
          type: object
          properties:
            type: { type: string, enum: [customer, agent, system] }
            name: { type: [string, 'null'], description: "The agent's visible name; the requester's email for customers." }
            avatar_url: { type: [string, 'null'], format: uri }
        body: { type: string }
        internal: { type: boolean, description: Agent-only note (only ever returned on admin routes). }
        created_at: { type: string, format: date-time }
    SupportTicket:
      type: object
      properties:
        id: { type: string, examples: [tkt_8Kd2Lm4Np7Qx] }
        object: { type: string, const: support_ticket }
        number: { type: integer, examples: [1042] }
        subject: { type: string }
        category: { $ref: '#/components/schemas/SupportTicketCategory' }
        status: { $ref: '#/components/schemas/SupportTicketStatus' }
        source: { type: string, enum: [dashboard, web] }
        email: { type: string }
        email_verified: { type: boolean, description: "Dashboard tickets: true. Guest tickets: true once the emailed link was opened. Until then a guest ticket is not shown to agents or to the matching account, and it is deleted if the link is not opened within 24 hours." }
        invoice_ids: { $ref: '#/components/schemas/SupportInvoiceIds' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_message_at: { type: string, format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }
        messages:
          type: array
          description: Oldest first. Present when reading a single ticket.
          items: { $ref: '#/components/schemas/SupportMessage' }
    AdminSupportTicket:
      allOf:
        - $ref: '#/components/schemas/SupportTicket'
        - type: object
          properties:
            merchant:
              type: [object, 'null']
              properties:
                id: { type: string }
                email: { type: string }
                business_name: { type: [string, 'null'] }
                status: { type: string }
            member_id: { type: [string, 'null'] }
            assigned_agent:
              type: [object, 'null']
              properties:
                id: { type: string }
                name: { type: string }
                email: { type: string }
            invoices:
              type: array
              description: The invoices named in `invoice_ids`, looked up in both modes.
              items:
                type: object
                properties:
                  id: { type: string }
                  found: { type: boolean }
                  merchant_id: { type: [string, 'null'] }
                  same_account: { type: boolean, description: The invoice belongs to the ticket's merchant. }
                  livemode: { type: [boolean, 'null'] }
                  status: { type: [string, 'null'] }
                  amount: { type: [string, 'null'] }
                  currency: { type: [string, 'null'] }
                  created_at: { type: [string, 'null'], format: date-time }
            ip: { type: [string, 'null'] }
            user_agent: { type: [string, 'null'] }
            message_count: { type: integer }
            last_customer_message_at: { type: [string, 'null'], format: date-time }
            last_agent_message_at: { type: [string, 'null'], format: date-time }
    SupportAgent:
      type: object
      properties:
        id: { type: string, examples: [stf_2Lm8Qx4Rf7Nd] }
        object: { type: string, const: support_agent }
        email: { type: string }
        display_name: { type: string, description: The name customers see. Defaults to the part of the email before the @. }
        avatar_url: { type: [string, 'null'], format: uri }
        role: { type: string, enum: [owner, finance, support, readonly, agent], description: "Staff role; `agent` can use the Support Desk only." }
        active: { type: boolean }
        status: { type: string, enum: [invited, active, disabled], description: "`invited` until the agent has set up two-factor authentication." }
        support_admin: { type: boolean, description: Can add agents and turn their access off. }
        created_at: { type: string, format: date-time }
    Activity:
      type: object
      properties:
        id: { type: string, examples: [act_9Gm2Qx7Lp] }
        object: { type: string, const: activity }
        at: { type: string, format: date-time }
        actor:
          type: object
          properties:
            type: { type: string, enum: [owner, member, api_key, system, staff] }
            id: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
        action: { type: string, examples: [login.succeeded, 'POST /webhooks'] }
        method: { type: [string, 'null'] }
        route: { type: [string, 'null'] }
        target_id: { type: [string, 'null'] }
        status_code: { type: [integer, 'null'] }
        outcome: { type: string, enum: [success, failure] }
        ip: { type: [string, 'null'] }
        user_agent: { type: [string, 'null'] }
        details: { type: object, additionalProperties: true }
    EmailVerification:
      type: object
      properties:
        object: { type: string, const: email_verification }
        email: { type: [string, 'null'] }
        verified: { type: boolean }
        sent: { type: boolean }
    Account:
      type: object
      description: The merchant account behind a dashboard session. Email and a display name only; there is no identity data.
      required: [id, object, email, status, created_at]
      properties:
        id: { type: string, example: mer_8Pq2Rs6Tu }
        object: { type: string, const: account }
        email: { type: string, format: email }
        business_name: { type: [string, 'null'] }
        you:
          type: [object, 'null']
          description: The signed-in person (dashboard sessions); null for API keys.
          properties:
            role: { type: string, enum: [owner, admin, developer, viewer] }
            email: { type: [string, 'null'] }
            member_id: { type: [string, 'null'] }
            two_factor: { type: boolean }
        email_verified: { type: boolean, description: 'True once the merchant opened the confirmation link (or set a password from an emailed link). Live-mode writes and live API keys need it (`403 email_unverified`).' }
        status: { type: string, enum: [active, suspended, closed] }
        mfa_required: { type: boolean, description: Whether 2FA is enforced for this account. }
        locale: { type: [string, 'null'], description: "Default checkout language hint (BCP-47), or null." }
        display_currency: { type: [string, 'null'], description: "Default display currency hint for payers, or null." }
        billing_plan: { $ref: '#/components/schemas/BillingPlan' }
        auto_switch_to_pay_as_you_go:
          type: boolean
          default: true
          description: |
            On by default. On a prepaid account, when the credits cannot cover a new invoice (or run out after a
            fee), the account switches to pay as you go instead of refusing invoices (`402 insufficient_credits`),
            and a notice is emailed to the account email. Switch back to prepaid with `PATCH /account` at any
            time. When false, an account without credits (and without automatic top-up) cannot create invoices
            paid with credits. Takes effect only while pay as you go is open to the account
            (`pay_as_you_go.available`).
        pay_as_you_go: { $ref: '#/components/schemas/PayAsYouGoSettings' }
        records: { $ref: '#/components/schemas/RecordsSettings' }
        api_version: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: [string, 'null'], format: date-time }
    ApiKey:
      type: object
      description: >-
        A merchant API key. The secret `key` is in the create response and, for keys created from
        2026-10-29 on (stored encrypted), in the step-up-protected dashboard list. Older keys exist only as a
        hash and never return `key`.
      properties:
        id: { type: string, example: key_7Hq2kLm9Rt }
        object: { type: string, const: api_key }
        livemode: { type: boolean }
        name: { type: [string, 'null'] }
        prefix: { type: string, description: "First characters of the key for display, e.g. `cv_test_Ab12...`." }
        restricted: { type: boolean }
        scopes:
          type: array
          items: { type: string }
        key: { type: string, description: "The full secret. Returned on creation and by `GET /api-keys` (session with step-up); absent for keys created before 2026-10-29, which are stored as a hash only." }
        last_used_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    AuditLogEntry:
      type: object
      properties:
        id: { type: string, example: aud_3Kd9Fj2L }
        object: { type: string, const: audit_log_entry }
        staff_id: { type: string }
        action: { type: string, example: operator_wallet.approve }
        target_type: { type: [string, 'null'] }
        target_id: { type: [string, 'null'] }
        reason: { type: [string, 'null'], description: "The `CoinVello-Admin-Reason` header value." }
        before: { type: [object, 'null'], additionalProperties: true }
        after: { type: [object, 'null'], additionalProperties: true }
        ip: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    MfaRequiredResponse:
      type: object
      required: [mfa_required, mfa_token, methods, expires_at]
      properties:
        mfa_required: { type: boolean, const: true }
        mfa_token: { type: string, description: "Opaque, single-use, expires in 5 minutes." }
        methods:
          type: array
          items: { $ref: '#/components/schemas/MfaMethod' }
        preferred_method: { $ref: '#/components/schemas/MfaMethod' }
        expires_at: { type: string, format: date-time }
    PasswordResetRequest:
      type: object
      required: [object, expires_in]
      description: Returned for every well-formed request, whether or not the email belongs to an account.
      properties:
        object: { type: string, const: password_reset_request }
        expires_in: { type: integer, description: "Lifetime of an emailed link in seconds (1800).", examples: [1800] }
    PasswordResetResult:
      type: object
      required: [object, account_type, sessions_revoked, mfa_enabled]
      properties:
        object: { type: string, const: password_reset }
        account_type: { type: string, enum: [merchant, staff], description: Which sign-in page to return to. }
        sessions_revoked: { type: integer, description: Sessions that were signed out by the reset. }
        mfa_enabled: { type: boolean, description: "True when the next sign-in will ask for the second factor. A reset never disables 2FA." }
    MfaStatus:
      type: object
      properties:
        object: { type: string, const: mfa_status }
        enabled: { type: boolean }
        required: { type: boolean, description: True for staff accounts and accounts whose owner enforced 2FA. }
        methods:
          type: array
          items:
            type: object
            properties:
              method: { $ref: '#/components/schemas/MfaMethod' }
              enabled: { type: boolean }
              enrolled_at: { type: [string, 'null'], format: date-time }
              label: { type: [string, 'null'], description: Masked email or passkey label. }
        preferred_method: { $ref: '#/components/schemas/MfaMethod' }
        recovery_codes_remaining: { type: integer }
        trusted_devices: { type: integer }
        step_up_valid_until: { type: [string, 'null'], format: date-time }
    EmailCodeSent:
      type: object
      properties:
        object: { type: string, const: email_code }
        sent_to: { type: string, description: "Masked address, e.g. j***@example.com" }
        expires_at: { type: string, format: date-time }
        resend_available_at: { type: string, format: date-time }

    # ------------------------------------------------------------ admin
    OperatorWalletCreateRequest:
      type: object
      required: [assets, label]
      description: Exactly one of `chain` or `chains` is required.
      properties:
        chain: { $ref: '#/components/schemas/Chain' }
        chains:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Chain' }
          description: EVM chains to register `address` on as one group.
        assets:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AssetId' }
        xpub: { type: string, description: BTC. Extended public key; xprv is rejected. }
        derivation_path: { type: string, pattern: "^m(/\\d+'?)*$", example: "m/84'/0'/0'" }
        address_type: { type: string, enum: [p2pkh, p2sh-p2wpkh, p2wpkh, p2tr] }
        address: { type: string, description: EVM / Solana / Tron address. }
        label: { type: string, maxLength: 100 }
        enabled: { type: boolean, default: true }
        priority: { type: integer, minimum: 0, maximum: 1000, default: 100, description: Lower wins when several wallets serve the same asset. }
    OperatorWallet:
      type: object
      properties:
        id: { type: string, example: opw_4Kd8Lm2Qp }
        object: { type: string, const: operator_wallet }
        livemode: { type: boolean }
        chain: { $ref: '#/components/schemas/Chain' }
        type: { type: string, enum: [xpub, address] }
        assets:
          type: array
          items: { $ref: '#/components/schemas/AssetId' }
          description: Every asset on the wallet's chain in its mode. Operator wallets have no asset filter.
        group_id: { type: [string, 'null'], description: "Multi-chain group (`wgr_...`)." }
        first_address: { type: [string, 'null'], description: "xpub wallets: the first address derived (`.../0/0`), to compare with the hardware wallet. Null for address wallets." }
        group_chains:
          type: array
          items: { $ref: '#/components/schemas/Chain' }
          description: Chains already covered by the group. Present on `GET /admin/operator-wallets/{id}`.
        xpub: { type: [string, 'null'], description: Redacted. }
        derivation_path: { type: [string, 'null'] }
        address_type: { type: [string, 'null'] }
        next_index: { type: [integer, 'null'] }
        address: { type: [string, 'null'] }
        label: { type: string }
        enabled: { type: boolean }
        priority: { type: integer }
        stats:
          type: object
          properties:
            purchases_count: { type: integer }
            received_total:
              type: object
              additionalProperties: { $ref: '#/components/schemas/DecimalString' }
        status:
          type: string
          enum: [pending_approval, active, retired]
          description: |
            A wallet is created `active` by owner/finance staff under a 2FA step-up and starts receiving
            purchases once `active_from` (creation + the activation delay, 1 hour by default) has passed.
            `pending_approval` only remains on wallets created before that (`POST /admin/operator-wallets/{id}/approve`).
            Retired wallets keep being monitored for open purchases.
        created_by: { type: string, description: Staff member id. }
        approved_by: { type: [string, 'null'], description: Staff member who approved (may be the creator). }
        active_from: { type: [string, 'null'], format: date-time, description: "When the wallet starts (or started) receiving purchases." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, 'null'], format: date-time }
    CreditBundleWriteRequest:
      type: object
      properties:
        id: { type: string, pattern: '^bnd_[a-z0-9_]+$', description: Optional on create; defaults to a generated id. }
        name: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 300 }
        credits: { type: integer, minimum: 1 }
        bonus_credits: { type: integer, minimum: 0, default: 0 }
        price_usd: { $ref: '#/components/schemas/DecimalString' }
        enabled: { type: boolean, default: true }
        contact_sales: { type: boolean, default: false, description: "Price is negotiated; `POST /credits/purchases` returns 409 for this bundle and `crypto_prices` is empty." }
        sort_order: { type: integer }
    AccessBlock:
      type: object
      required: [id, object, subject_type, subject, source, status, expires_at, created_at]
      properties:
        id: { type: string, example: abb_Q2x8VbN1tR }
        object: { type: string, const: access_block }
        subject_type: { type: string, enum: [ip, merchant, email] }
        subject: { type: string, description: "The blocked IP address, merchant id, email address or `@domain`." }
        merchant_id: { type: [string, 'null'] }
        ip: { type: [string, 'null'], description: The address the triggering request came from (automatic blocks) or the blocked address. }
        source: { type: string, enum: [auto, staff] }
        rule: { type: [string, 'null'], description: "Detector rule of the last refused request: template, php, sql, command, traversal, xss, prototype_pollution." }
        field: { type: [string, 'null'], description: "Field that carried the payload, e.g. `business_name` or `metadata.note`." }
        route: { type: [string, 'null'], example: POST /v1/invoices }
        sample: { type: [string, 'null'], description: First 300 characters of the offending value. }
        strikes:
          type: array
          description: "The refused requests that led to an automatic block, oldest first (up to 10). Blocks made before payloads were kept list the account's logged refusals with `sample: null`."
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              rule: { type: [string, 'null'] }
              field: { type: [string, 'null'] }
              route: { type: string, example: POST /v1/webhooks }
              sample: { type: [string, 'null'] }
              ip: { type: [string, 'null'] }
              request_id: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        created_by: { type: [string, 'null'], description: Staff id for staff blocks. }
        status: { type: string, enum: [active, expired, lifted] }
        expires_at: { type: [string, 'null'], format: date-time, description: '`null` for a permanent block (it lasts until lifted).' }
        permanent: { type: boolean }
        lifted_at: { type: [string, 'null'], format: date-time }
        lifted_by: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    AdminMerchant:
      type: object
      properties:
        id: { type: string, example: mer_8Pq2Rs6Tu }
        object: { type: string, const: merchant }
        email: { type: string, format: email }
        business_name: { type: [string, 'null'] }
        status: { type: string, enum: [active, suspended, closed] }
        suspension:
          type: object
          properties:
            reason: { type: [string, 'null'] }
            note: { type: [string, 'null'] }
            suspended_at: { type: [string, 'null'], format: date-time }
            suspended_by: { type: [string, 'null'] }
        credits:
          type: object
          properties:
            available: { type: integer }
            reserved: { type: integer }
        counts:
          type: object
          properties:
            wallets: { type: integer }
            invoices_total: { type: integer }
            invoices_paid_30d: { type: integer }
            webhooks: { type: integer }
        api_version: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: [string, 'null'], format: date-time }

    # ------------------------------------------------------------ testing
    SimulateSweepRequest:
      type: object
      required: [receiver_id]
      properties:
        receiver_id: { type: string }
        assets:
          type: array
          items: { $ref: '#/components/schemas/AssetId' }
          description: Assets to sweep. Defaults to every asset with an unswept balance.
        initiated_by:
          type: string
          enum: [coinvello, merchant, third_party]
          default: coinvello
        fee_destination:
          type: string
          enum: [primary, backup, forfeited]
          default: primary
          description: Force a fallback outcome to test how your integration handles it.
    SimulatePaymentRequest:
      type: object
      required: [invoice_id]
      properties:
        invoice_id:
          type: string
          description: Invoice (`inv_`) **or** credit purchase (`cpu_`) to pay.
        asset:
          $ref: '#/components/schemas/AssetId'
          description: Which payment option to pay. Defaults to the first accepted asset.
        amount:
          $ref: '#/components/schemas/DecimalString'
          description: Amount in the asset. Defaults to the exact `payment_options[].amount`. Use less/more to simulate underpaid/overpaid.
        confirmations:
          type: integer
          minimum: 0
          default: 0
          description: Confirmations to report. `0` = detected only; `>= required_confirmations` = confirmed.
        tx_hash:
          type: string
          description: Reuse a hash from a previous call to advance the same payment's confirmations instead of creating a second payment.
        from_address: { type: string }
        delay_seconds:
          type: integer
          minimum: 0
          maximum: 300
          default: 0
          description: Delay before the simulated detection is processed (to test polling UIs).

