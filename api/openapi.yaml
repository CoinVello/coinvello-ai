      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAgent' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/support/profile/avatar:
    put:
      tags: [Admin]
      operationId: adminSetSupportAvatar
      summary: Upload your profile picture
      description: PNG, JPEG, WebP or GIF, at most 1 MB (1,048,576 bytes), base64 encoded. SVG is refused.
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, data]
              properties:
                content_type: { type: string, enum: [image/png, image/jpeg, image/webp, image/gif] }
                data: { type: string, maxLength: 1400000, description: Base64 of the image bytes. }
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAgent' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Admin]
      operationId: adminDeleteSupportAvatar
      summary: Remove your profile picture
      security: [{ AdminAuth: [] }, { AdminSession: [] }]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportAgent' }
        '403': { $ref: '#/components/responses/Forbidden' }
webhooks:
  invoice.paid:
    post:
      operationId: webhook_invoice_paid
      summary: Invoice fully paid and confirmed
      description: Fired once when the invoice reaches `paid`. Safe to fulfil the order.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInvoice' }
            examples:
              paid: { $ref: '#/components/examples/EventInvoicePaid' }
      responses:
        '200': { description: Return any 2xx within 10 seconds to acknowledge. }
  invoice.confirming:
    post:
      operationId: webhook_invoice_confirming
      summary: Sufficient payment seen; waiting for confirmations
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInvoice' }
      responses:
        '200': { description: Acknowledged }
  invoice.expired:
    post:
      operationId: webhook_invoice_expired
      summary: Invoice expired without sufficient payment
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInvoice' }
      responses:
        '200': { description: Acknowledged }
  invoice.underpaid:
    post:
      operationId: webhook_invoice_underpaid
      summary: Invoice confirmed but total received is below amount minus tolerance
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInvoice' }
