      operationId: listCreditBundles
      summary: List purchasable credit bundles
      description: |
        Prices are in USD; `crypto_prices` gives the current indicative equivalent for every asset CoinVello's
        operator wallets accept, with the 3% stablecoin discount already applied where `discount_applied` is true.
        The amount is locked (15 minutes) when a purchase is created. Canonical tiers (docs/03-fees-and-credits.md):
        Starter 2,500 ($25), Growth 15,000 ($120), Scale 75,000 ($450), Volume 400,000 ($1,600),
        Enterprise 2M+ (from $6,000, contact sales). 1 credit = $0.01 nominal; a confirmed payment consumes
        `clamp(round(fiat_usd x 30 bps / $0.01), 2, 2000)` credits.
      security: []
