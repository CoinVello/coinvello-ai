openapi: 3.1.0
info:
  title: CoinVello API
  version: "2026-10-01"
  summary: Non-custodial crypto payment processing API
  description: |
    The CoinVello API lets merchants accept cryptocurrency payments **without ever
    giving up custody**. CoinVello generates per-invoice receiving addresses from a
    merchant-supplied extended public key (BTC) or watches merchant-owned addresses
    (EVM chains, Solana, Tron), detects payments on-chain, and notifies you through
    signed webhooks.

    CoinVello **never holds funds**. Operations that move money (conversions, off-ramp
    deposits, refunds) are *orchestrated*: CoinVello prepares an unsigned transaction,
    the merchant signs it with their own key, and either side broadcasts it.

    ### Conventions
    * Base URL: `https://api.coinvello.com/v1`
    * Authentication: `Authorization: Bearer cv_live_...` or `cv_test_...`
    * All request and response bodies are JSON (`application/json`).
    * Monetary amounts are **strings** containing decimal numbers (e.g. `"0.00125000"`),
      never floats. Fiat amounts use at most 2 decimals; crypto amounts use the asset's
      native precision.
    * Timestamps are RFC 3339 / ISO 8601 UTC strings (`2026-10-21T12:34:56Z`).
    * Every object has an `object` discriminator and a prefixed `id` (`inv_`, `pay_`, `wal_`, ...).
    * Lists are cursor-paginated: `?limit=&cursor=` -> `{ data, has_more, next_cursor }`.
    * `POST` requests accept an `Idempotency-Key` header (recommended for every create).
    * Pin an API version with the `CoinVello-Version` header (default: the version your
      account was created on).
    * Assets are addressed as `<asset>:<chain>` identifiers, e.g. `btc:bitcoin`,
      `usdt:tron`, `usdc:polygon`, `eth:ethereum`, `sol:solana`.

    ### Environments
    | Mode | Key prefix | Networks |
    |------|-----------|----------|
    | Live | `cv_live_` | Mainnets |
    | Test | `cv_test_` | Testnets (Bitcoin signet or testnet4, Sepolia, Amoy, BNB testnet, Robinhood Chain testnet, Solana devnet, Tron Nile) + `/test/simulate_payment` |
  termsOfService: https://coinvello.com/legal/terms
  contact:
    name: CoinVello Developer Support
    url: https://coinvello.com/developers
    email: support@coinvello.com
  license:
    name: Proprietary
    url: https://coinvello.com/legal/api-license
  x-logo:
    url: https://coinvello.com/brand/logo.svg

servers:
  - url: https://api.coinvello.com/v1
    description: Production (live and test keys)
  - url: http://localhost:4242/v1
    description: Local reference mock server (api/reference-server)

security:
  - ApiKeyAuth: []

tags:
  - name: Invoices
    description: |
      An **Invoice** is a request for payment. It is priced in fiat or crypto, lists the
      assets you accept, and exposes one *payment option* per accepted asset/chain with a
      merchant-owned receiving address.

      Status lifecycle:

      ```
      new -> pending -> confirming -> paid
                    \-> underpaid      (less than amount, after tolerance)
                    \-> overpaid       (more than amount, after tolerance)
      new|pending -> expired           (expires_at reached without sufficient payment)
      new|pending -> cancelled         (merchant cancelled)
      paid|underpaid|overpaid|expired -> refund_requested  (customer or merchant asked for a refund)
      ```
  - name: Payments
    description: On-chain payment detections attached to invoices.
  - name: Wallets
    description: Merchant-registered receiving wallets (xpubs and addresses). Keys never leave the merchant.
  - name: Webhooks
    description: Webhook endpoints, deliveries, and signature secrets.
  - name: Credits
    description: |
      Prepaid processing credits that pay CoinVello fees. 1 credit = $0.01 nominal. Each confirmed payment
      consumes `clamp(round(fiat_value_usd x 0.0030 / 0.01), 2, 2000)` credits (30 bps nominal, floor 2, cap
      2,000); add-ons - conversion +10 bps nominal, off-ramp 20 credits per payout, screening +1. There are
      no free credits: an account that does not want to prepay uses pay as you go. Purchased credits expire
      after 24 months; 3% discount when paying in USDC/USDT/DAI. The balance never goes below zero: creating
      an invoice that is paid with credits reserves its estimated fee, and `402 insufficient_credits` is
      returned when `available` cannot cover it. A payment larger than the invoice never takes the balance
      below zero either (the fee is capped at what the account holds). With
      `Account.auto_switch_to_pay_as_you_go` (on by default) the account moves to pay as you go instead of
      refusing the invoice, and the account email is notified.
      Credits are bought with crypto (to CoinVello's operator wallets) or with a saved card. Cards are entered
      in Square's secure card fields (Square tokenizes them; CoinVello never sees a card number), and a saved
      card also powers automatic top-up.
      Canonical model - docs/03-fees-and-credits.md.
  - name: Pay as you go
    description: |
      The alternative to prepaid credits: CoinVello takes a fixed share (0.4%, `fee_bps: 40`) of each payment
      on-chain, with nothing to buy up front. On chains that support it, payment options point at the
      merchant's **receiver**, a merchant-owned contract (EVM, Tron) or program vault (Solana) that can only pay
      out to two places: the merchant's wallet (99.6%) and CoinVello's fee address. A **sweep** does that split;
      anyone can trigger one, including the merchant, so funds never depend on CoinVello to move, and nobody
      can redirect them. CoinVello's sweeper triggers sweeps once the fee covers the network fee several times
      over, so busy receivers are swept often and quiet ones less often.

      Receivers are created automatically for every wallet on a supported chain while the account's
      `billing_plan` is `pay_as_you_go`. Chains without receivers (Bitcoin) keep using credits.
      There is no billing in arrears: every fee is collected in the same transaction that pays the merchant.
      Canonical model - docs/03-fees-and-credits.md §3d; contracts and program - `contracts/`, `solana/`.
  - name: Records
    description: |
      The account's **book of record** for bookkeeping and tax: one immutable `record` per movement of value
      CoinVello observed or billed (payments received, reversals, refunds sent, fees, credit purchases,
      conversions, off-ramp payouts), valued in the reporting currency at the moment it happened with the rate
      and its source, plus **exports** of any dataset - the entire history or a date range - as CSV, Excel or
      JSON, in a generic layout or in the import formats of QuickBooks, Xero, Koinly, CoinTracker and CoinLedger.

      There is no balance here: records describe value that moved between the payer's wallet, the merchant's
      wallet and CoinVello's fee address. CoinVello is not a tax adviser; it records and exports.
      Design, column definitions and presets - docs/10-records-and-tax.md.
  - name: Rates
    description: Exchange rates, quotes, and rate locks.
  - name: Conversions
    description: Non-custodial coin conversion. CoinVello prepares; the merchant signs.
  - name: Off-ramp
    description: Fiat payouts executed by a partner the merchant connected themselves.
  - name: Checkout Sessions
    description: Hosted checkout pages on pay.coinvello.com.
  - name: Refunds
    description: Refund requests and merchant-signed execution.
  - name: Events
    description: Immutable log of everything that happened on your account.
  - name: Assets
    description: Supported chains and assets.
  - name: Testing
    description: Test-mode helpers.
  - name: Account & Auth
    description: |
      Dashboard **session** API used by the merchant dashboard and the staff admin panel - not by
      integrations (those use API keys). Covers login, two-factor authentication (TOTP, email
      codes, WebAuthn passkeys, recovery codes), trusted devices and step-up re-authentication.

      Policy: 2FA is optional for merchants but **required** (via a 5-minute step-up window) to
      change payout wallets/xpubs, webhook endpoints or API keys and to disable 2FA. Staff accounts
      must always have 2FA. See docs/security.md.

      The account-security routes (`/auth/mfa/*`, `/auth/sessions`, `/auth/logout`) accept either a
      merchant session (`cv_session`) or a staff session (`cv_admin_session`) and operate on the account
      that owns the session; `/api-keys` is merchant-only.
  - name: Admin
    description: |
      **Internal staff surface** - not available to merchants. Lives under `/admin` on the same
      host, but uses a separate authentication scheme (`AdminAuth`): either a staff dashboard
      session cookie with mandatory 2FA, or an admin API key prefixed `cv_admin_`. Merchant keys
      (`cv_live_`/`cv_test_`) receive `403 permission_error` here, and admin keys are rejected on
      merchant endpoints. All admin calls are written to an immutable audit log.

      Admin resources - operator wallets (where credit purchases are received), credit bundles,
      merchants, the global credit ledger, and credit purchases.

  - name: Support
    description: |
      The **Support Desk**: tickets between CoinVello agents and merchants (or anyone who cannot sign in).
      Not for integrations. Signed-in merchants and team members open and follow tickets from the dashboard
      (`SessionAuth`); the ticket carries their email and any invoices they name. People who cannot sign in
      open a ticket as a guest with an email address and a proof-of-work challenge (`GET /support/captcha`),
      and follow it through a private link sent to that address (header `CoinVello-Ticket-Token`). Agents
      are staff (`AdminAuth`); support desk admins add agents with `@coinvello.com` addresses.

      Status: `open` (waiting on CoinVello) -> `waiting_on_customer` | `resolved`. A customer reply reopens
      the ticket. Every reply from an agent is emailed to the requester.
paths:
  # ---------------------------------------------------------------- Invoices
  /invoices:
    post:
      tags: [Invoices]
      operationId: createInvoice
      summary: Create an invoice
      description: |
        Creates an invoice and derives/selects a receiving address for every accepted
        asset. Either `amount` + `currency` (fiat pricing, e.g. `"49.99"` `USD`) or
        `amount` + `currency` as a crypto asset id (e.g. `"0.001"` `btc:bitcoin`) may be used.

        If `accepted_assets` is omitted, all assets for which you have an enabled wallet are
        offered (live and test mode alike; wallet verification is optional).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreateRequest'
            examples:
              fiatPriced:
                summary: USD-priced invoice accepting BTC and USDT on Tron
                value:
                  amount: "49.99"
                  currency: USD
                  accepted_assets: ["btc:bitcoin", "usdt:tron", "usdc:polygon"]
                  order_id: "WC-10042"
                  description: "Order #10042 - 2x Widget"
                  success_url: "https://shop.example.com/order/10042/thanks"
                  cancel_url: "https://shop.example.com/cart"
                  expires_in: 900
                  customer:
                    email: "buyer@example.com"
                  metadata:
                    woocommerce_order_id: "10042"
              cryptoPriced:
                summary: Invoice priced directly in ETH
                value:
                  amount: "0.05"
                  currency: "eth:ethereum"
                  accepted_assets: ["eth:ethereum"]
                  order_id: "donation-77"
      responses:
        '201':
          description: Invoice created
          headers:
            Request-Id: { $ref: '#/components/headers/RequestId' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
              examples:
                invoice: { $ref: '#/components/examples/InvoiceNew' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/InsufficientCredits' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Invoices]
      operationId: listInvoices
      summary: List invoices
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/InvoiceStatus' }
        - name: order_id
          in: query
          schema: { type: string }
        - name: customer_email
          in: query
          schema: { type: string, format: email }
        - $ref: '#/components/parameters/CreatedGte'
        - $ref: '#/components/parameters/CreatedLte'
      responses:
        '200':
          description: A page of invoices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /invoices/{invoice_id}:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    get:
      tags: [Invoices]
      operationId: getInvoice
      summary: Retrieve an invoice
      responses:
        '200':
          description: The invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
              examples:
                paid: { $ref: '#/components/examples/InvoicePaid' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Invoices]
      operationId: updateInvoice
      summary: Update invoice metadata
      description: Only `metadata`, `description`, `success_url` and `cancel_url` may be changed, and only while the invoice is `new` or `pending`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string, maxLength: 500 }
                metadata: { $ref: '#/components/schemas/Metadata' }
                success_url: { type: string, format: uri }
                cancel_url: { type: string, format: uri }
      responses:
        '200':
          description: Updated invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /invoices/{invoice_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    post:
      tags: [Invoices]
      operationId: cancelInvoice
      summary: Cancel an invoice
      description: Allowed while `new` or `pending`. Any payment detected afterwards is still recorded (`payment.detected`) so it can be refunded.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Cancelled invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /invoices/{invoice_id}/expire:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    post:
      tags: [Invoices]
      operationId: expireInvoice
      summary: Expire an invoice immediately
      description: Forces `expires_at` to now. Allowed while `new` or `pending`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Expired invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /invoices/{invoice_id}/payments:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    get:
      tags: [Invoices, Payments]
      operationId: listInvoicePayments
      summary: List payments for an invoice
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Payments detected for this invoice
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Payment' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Payments
  /payments:
    get:
      tags: [Payments]
      operationId: listPayments
      summary: List payments
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: invoice_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PaymentStatus' }
        - name: chain
          in: query
          schema: { $ref: '#/components/schemas/Chain' }
        - name: tx_hash
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/CreatedGte'
        - $ref: '#/components/parameters/CreatedLte'
      responses:
        '200':
          description: A page of payments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Payment' }

  /payments/{payment_id}:
    parameters:
      - name: payment_id
        in: path
        required: true
        schema: { type: string, pattern: '^pay_[A-Za-z0-9]+$' }
        example: pay_7Hq2kLm9Rt
    get:
      tags: [Payments]
      operationId: getPayment
      summary: Retrieve a payment
      responses:
        '200':
          description: The payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
              examples:
                confirmed: { $ref: '#/components/examples/PaymentConfirmed' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Wallets
  /wallets:
    post:
      tags: [Wallets]
      operationId: createWallet
      summary: Register a receiving wallet
      description: |
        Registers a merchant-owned wallet. Two kinds exist:

        * **`xpub`** (Bitcoin): supply an extended public key (`xpub`/`ypub`/`zpub`,
          or testnet `tpub`/`vpub`) plus the account-level derivation path it
          was exported at. CoinVello derives a fresh address `<path>/0/<index>` for each invoice.
          **Never send a private key or xprv** - requests containing one are rejected and the key
          material is discarded.
        * **`address`** (Ethereum & EVM chains, Solana, Tron): supply a single address. Each invoice
          is matched by exact amount (CoinVello appends a unique sub-cent "amount tag" when two open
          invoices would otherwise collide) and by memo where the chain supports it.

        New wallets are `active` immediately, in live and test mode: the 2FA step-up required to
        create or change a wallet from the dashboard is the control. With an API key, live-mode wallet
        changes need a key whose scopes list `wallets:write`: full-access live keys created from
        2026-11-03 leave it out (`403 insufficient_scope`), so create a restricted key for wallet setup and
        keep it off your store. Every live wallet or webhook change not made by the owner's own dashboard
        session emails the owner (who, from which IP, what changed). Addresses are validated strictly
        per chain (`422 address_invalid` with `param` set): EVM must be valid hex and pass EIP-55 when
        mixed-case, and may not be the zero address, a burn address, a precompile or a token contract;
        Tron must be base58check with the `T` prefix; Solana a base58 32-byte public key; xpubs must
        match the mode's network, and the response's `first_address` is the first address CoinVello
        will derive (compare it with your wallet's first receive address). Bitcoin is
        xpub-only (`422 xpub_required`) so every invoice gets a fresh address.

        Proving ownership with a signed message (`POST /wallets/{id}/verification` then `/verify`) is
        **optional**: it marks the wallet `verified` for your own assurance and is never required.

        **One EVM address on several chains:** pass `chains` (an array of EVM chains) instead of `chain`
        with `type: address`. One wallet per chain is created atomically, all sharing a `group_id`
        (`wgr_...`) and the label; `assets` applies to every chain, narrowed to what each chain supports
        (matching by symbol, falling back to the chain's native coin). The response is then a list
        envelope of the created wallets. Mixing non-EVM chains, or `chains` with `type: xpub`, returns
        `422 chains_not_compatible` naming the chain. One verification challenge covers the whole group.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletCreateRequest' }
            examples:
              btcXpub:
                summary: Bitcoin native-segwit account xpub
                value:
                  type: xpub
                  chain: bitcoin
                  label: "Shop BTC (Ledger)"
                  xpub: "zpub6rFR7y4Q2AijBEqTUquhVz398htDFrtymD9xYYfG1m4wAcvPhXNfE3EfH1r1ADqtfSdVCToUG868RvUUkgDKf31mGDtKsAYz2oz2AGutZYs"
                  derivation_path: "m/84'/0'/0'"
                  address_type: p2wpkh
              tronAddress:
                summary: Tron address accepting USDT
                value:
                  type: address
                  chain: tron
                  label: "Treasury TRX"
                  address: "TN3W4H6rK2ce4vX9YnFQHwKENnHjoxb3m9"
                  assets: ["usdt:tron", "trx:tron"]
              evmAddress:
                summary: EVM address on Polygon accepting USDC
                value:
                  type: address
                  chain: polygon
                  label: "Polygon hot wallet"
                  address: "0x8ba1f109551bD432803012645Ac136ddd64DBA72"
                  assets: ["usdc:polygon", "usdt:polygon", "pol:polygon"]
      responses:
        '201':
          description: Wallet registered (one wallet), or the list of wallets created for a `chains` group
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Wallet'
                  - allOf:
                      - $ref: '#/components/schemas/ListResponse'
                      - type: object
                        properties:
                          group_id: { type: string }
                          data:
                            type: array
                            items: { $ref: '#/components/schemas/Wallet' }
              examples:
                xpub: { $ref: '#/components/examples/WalletXpub' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    get:
      tags: [Wallets]
      operationId: listWallets
      summary: List wallets
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: chain
          in: query
          schema: { $ref: '#/components/schemas/Chain' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/WalletStatus' }
        - name: group_id
          in: query
          description: Only wallets of this multi-chain group (`wgr_...`).
          schema: { type: string }
      responses:
        '200':
          description: A page of wallets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Wallet' }

  /wallets/{wallet_id}:
    parameters:
      - $ref: '#/components/parameters/WalletId'
    get:
      tags: [Wallets]
      operationId: getWallet
      summary: Retrieve a wallet
      responses:
        '200':
          description: The wallet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Wallets]
      operationId: updateWallet
      summary: Update a wallet
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 100 }
                assets:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/AssetId' }
                  description: Replaces the assets accepted at this wallet. Each must be on the wallet's chain and listed by `GET /assets` for its mode.
                enabled: { type: boolean }
                metadata: { $ref: '#/components/schemas/Metadata' }
      responses:
        '200':
          description: Updated wallet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Wallets]
      operationId: archiveWallet
      summary: Archive a wallet
      description: Archived wallets are no longer offered on new invoices. Existing invoices continue to be monitored and historical derived addresses are kept so late payments are still detected.
      responses:
        '200':
          description: Archived wallet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '404': { $ref: '#/components/responses/NotFound' }

  /wallets/{wallet_id}/chains:
    parameters:
      - $ref: '#/components/parameters/WalletId'
    post:
      tags: [Wallets]
      operationId: addWalletChains
      summary: Extend an EVM address wallet to more chains
      description: |
        Creates sibling wallets for the listed EVM chains with the same address, label, enabled flag and
        `assets` (or the given `assets`, narrowed per chain by symbol), joined to the wallet's multi-chain
        group (a `group_id` is assigned to the source first when it has none). Chains already in the group
        are skipped silently. A verified source passes its verification on to the siblings (same address,
        same key); an unverified source leaves them `unverified`. `422 chains_not_compatible` for non-EVM
        chains or when the source is not an address wallet on an EVM chain.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chains]
              properties:
                chains:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/Chain' }
                assets:
                  type: array
                  items: { $ref: '#/components/schemas/AssetId' }
                  description: Assets for the new chains; defaults to the source wallet's assets, matched by symbol.
      responses:
        '200':
          description: The sibling wallets created (empty when every chain was already covered)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      group_id: { type: string }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Wallet' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /wallets/{wallet_id}/verification:
    parameters:
      - $ref: '#/components/parameters/WalletId'
    post:
      tags: [Wallets]
      operationId: createWalletVerification
      summary: Start optional wallet verification (get challenge)
      description: |
        **Optional.** Wallets work in live and test mode without it. Signing the challenge marks the
        wallet `verified` (`verification.status: verified`, `wallet.verified` event) as your own proof
        that the address or xpub is yours.

        Returns a human-readable challenge message to sign with the wallet's key.

        * **xpub wallets**: sign with the private key of the *first* derived address
          (`.../0/0`) using BIP-137 / Bitcoin "signmessage". The address to sign with is
          returned in `signing_address`.
        * **EVM**: EIP-191 `personal_sign` of the message with the registered address.
        * **Solana**: Ed25519 signature of the UTF-8 message bytes (base58).
        * **Tron**: TIP-191 `signMessageV2`.

        Challenges expire after 15 minutes. For a multi-chain group (same EVM address on several
        chains) a challenge issued on any member verifies every member once completed.
      responses:
        '200':
          description: Challenge to sign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletVerificationChallenge' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /wallets/{wallet_id}/verify:
    parameters:
      - $ref: '#/components/parameters/WalletId'
    post:
      tags: [Wallets]
      operationId: verifyWallet
      summary: Submit the signed challenge (optional verification)
      description: Completes the optional ownership proof started with `POST /wallets/{id}/verification`. Not required for live mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signature]
              properties:
                signature:
                  type: string
                  description: Signature in the chain's conventional encoding (base64 for BTC, 0x-hex for EVM/Tron, base58 for Solana).
                challenge_id:
                  type: string
                  description: Optional; defaults to the most recent unexpired challenge.
      responses:
        '200':
          description: Wallet now verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422':
          description: Signature invalid or challenge expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  type: invalid_request_error
                  code: signature_invalid
                  message: "Signature does not match signing address bc1q... for challenge wvc_3kd9."
                  param: signature
                  request_id: req_9f8s7d6f

  /wallets/{wallet_id}/addresses:
    parameters:
      - $ref: '#/components/parameters/WalletId'
    get:
      tags: [Wallets]
      operationId: listWalletAddresses
      summary: List derived addresses (xpub wallets)
      description: Addresses CoinVello has derived from this xpub, with the invoice each was assigned to. Useful for reconciliation against your own wallet software.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Derived addresses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/DerivedAddress' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Webhooks
  /webhooks:
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Create a webhook endpoint
      description: |
        The response is the **only** time the signing `secret` (`whsec_...`) is returned in
        full. Store it securely. Use `POST /webhooks/{id}/rotate_secret` if it leaks.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookCreateRequest' }
            example:
              url: "https://shop.example.com/wc-api/coinvello"
              description: "WooCommerce production"
              events: ["invoice.paid", "invoice.confirming", "invoice.expired", "invoice.underpaid", "payment.detected"]
      responses:
        '201':
          description: Endpoint created (includes secret)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
              example:
                id: whe_2JxK9vL3mQ
                object: webhook
                livemode: true
                url: "https://shop.example.com/wc-api/coinvello"
                description: "WooCommerce production"
                events: ["invoice.paid", "invoice.confirming", "invoice.expired", "invoice.underpaid", "payment.detected"]
                enabled: true
                secret: "whsec_8f1c5f9ab2d84e3f9c0a7b6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f"
                api_version: "2026-10-01"
                created_at: "2026-10-21T10:00:00Z"
                updated_at: "2026-10-21T10:00:00Z"
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: List webhook endpoints
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Endpoints (secret omitted)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Webhook' }

  /webhooks/{webhook_id}:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    get:
      tags: [Webhooks]
      operationId: getWebhook
      summary: Retrieve a webhook endpoint
      responses:
        '200':
          description: The endpoint (secret omitted)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Webhooks]
      operationId: updateWebhook
      summary: Update a webhook endpoint
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                description: { type: string, maxLength: 200 }
                events:
                  type: array
                  items: { $ref: '#/components/schemas/EventType' }
                enabled: { type: boolean }
                api_version: { type: string }
      responses:
        '200':
          description: Updated endpoint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: Delete a webhook endpoint
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletedResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/{webhook_id}/rotate_secret:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    post:
      tags: [Webhooks]
      operationId: rotateWebhookSecret
      summary: Rotate the signing secret
      description: |
        Generates a new secret. For `grace_period_seconds` (default 86400, max 604800) deliveries
        are signed with **both** secrets (two `v1=` pairs in `CoinVello-Signature`) so you can roll
        over without downtime.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                grace_period_seconds: { type: integer, minimum: 0, maximum: 604800, default: 86400 }
      responses:
        '200':
          description: Endpoint with new secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/{webhook_id}/test:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    post:
      tags: [Webhooks]
      operationId: sendTestWebhook
      summary: Send a test event
      description: Sends a synthetic event of the given type (default `ping`) to the endpoint, signed with its secret. Available in live and test mode.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event_type:
                  oneOf:
                    - $ref: '#/components/schemas/EventType'
                    - type: string
                      enum: [ping]
                  default: ping
      responses:
        '200':
          description: Delivery attempt result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/{webhook_id}/replay:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    post:
      tags: [Webhooks]
      operationId: replayWebhook
      summary: Re-deliver past events to this endpoint
      description: |
        Re-enqueues every event the endpoint subscribes to that was created in `[since, until]`
        (default `until` = now; at most 1,000 events per call, oldest first; `truncated` tells you to
        call again with a later `since`). Use it after adding an endpoint or fixing a broken receiver.
        Replayed deliveries keep the original `event.id`, carry `replayed: true` and the
        `CoinVello-Delivery-Replayed: true` header, and are signed like any delivery.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [since]
              properties:
                since: { type: string, format: date-time }
                until: { type: string, format: date-time }
                types:
                  type: array
                  items: { $ref: '#/components/schemas/EventType' }
                  description: Restrict to these event types (must also be subscribed by the endpoint).
      responses:
        '200':
          description: Replay enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: webhook_replay }
                  webhook_id: { type: string }
                  since: { type: string, format: date-time }
                  until: { type: string, format: date-time }
                  types: { type: [array, 'null'], items: { type: string } }
                  events_matched: { type: integer }
                  deliveries_enqueued: { type: integer }
                  truncated: { type: boolean }
                  oldest_event_id: { type: [string, 'null'] }
                  newest_event_id: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/{webhook_id}/deliveries:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    get:
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      summary: List delivery attempts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { type: string, enum: [pending, succeeded, failed, exhausted] }
        - name: event_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Delivery attempts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/WebhookDelivery' }

  /webhooks/{webhook_id}/deliveries/{delivery_id}/retry:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
      - name: delivery_id
        in: path
        required: true
        schema: { type: string, pattern: '^whd_[A-Za-z0-9]+$' }
    post:
      tags: [Webhooks]
      operationId: retryWebhookDelivery
      summary: Retry a delivery now
      responses:
        '200':
          description: New delivery attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Credits
  /credits/balance:
    get:
      tags: [Credits]
      operationId: getCreditsBalance
      summary: Retrieve credit balance
