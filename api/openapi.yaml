      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventCreditsAdded' }
            examples:
              added: { $ref: '#/components/examples/EventCreditsAdded' }
      responses:
        '200': { description: Acknowledged }
  wallet.verified:
    post:
      operationId: webhook_wallet_verified
      summary: A wallet passed signature verification
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventWallet' }
      responses:
        '200': { description: Acknowledged }
  checkout_session.completed:
    post:
      operationId: webhook_checkout_session_completed
      summary: Hosted checkout reached a terminal paid state
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventCheckoutSession' }
      responses:
        '200': { description: Acknowledged }
  receiver.deployed:
    post:
      operationId: webhook_receiver_deployed
